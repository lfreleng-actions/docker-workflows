# =============================================================================
# EXAMPLE: Plain GitHub-native caller for the Docker build-test-release
# workflow
# =============================================================================
# Copy this file into your project's .github/workflows/ directory (for
# example as release.yaml) and adjust the `uses:` ref and the optional
# `with:` overrides to suit your project.
#
# This is Model A: the TAG-DRIVEN release model. The version comes from a
# validated, signed semver tag; the reusable workflow builds the images
# (multi-platform capable), pushes them to GHCR (and optionally Docker
# Hub), signs each pushed image with Sigstore cosign, attests SLSA build
# provenance, lints/scans/SBOMs the images, attaches the SBOMs and digest
# manifest to a draft GitHub release and promotes it.
#
# GHCR publishing authenticates with GITHUB_TOKEN, so the caller grants
# packages: write below. Docker Hub publishing additionally needs the
# DOCKERHUB_USERNAME/DOCKERHUB_PASSWORD secrets forwarded.
# =============================================================================
name: 'Build/Test/Release'

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - '**'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  release:
    name: 'Build/Test/Release'
    # Skip tag deletion events
    if: "!github.event.deleted"
    permissions:
      contents: write       # Create the GitHub release / attach assets
      id-token: write       # OIDC for cosign signing and attestations
      attestations: write   # Build provenance attestations
      packages: write       # Push images to GHCR
    # REPLACE the pinned SHA below with a docker-workflows release SHA.
    # The all-zero SHA is a non-functional placeholder, NOT a real commit.
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/docker-workflows/.github/workflows/build-test-release.yaml@0000000000000000000000000000000000000000  # REPLACE: vX.Y.Z
    # All inputs are optional. Uncomment and tune only what your project
    # needs; everything else falls back to sensible defaults.
    # with:
    #   path_prefix: '.'              # project root (monorepo subdir, etc.)
    #   images: ''                    # JSON image list; empty auto-discovers
    #   platforms: 'linux/amd64'      # csv; add linux/arm64 for multi-arch
    #   ghcr_publish: true            # ghcr.io/<owner>/<name>
    #   dockerhub_publish: false      # docker.io/<image_namespace>/<name>
    #   image_namespace: ''           # Docker Hub namespace (org/user)
    #   push_latest: false            # additionally push the latest tag
    #   test_command: ''              # smoke-test hook (IMAGES env = tags)
    #   attestations: true            # SLSA build provenance per image
    #   sigstore_sign: true           # cosign keyless signing per image
    #   sigstore_sign_required_registries: 'ghcr.io docker.io'  # hard-fail
    #   build_permit_egress_traffic: false  # audit egress for build job
    # Forward the Docker Hub secrets when dockerhub_publish is true:
    # secrets:
    #   DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    #   DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
