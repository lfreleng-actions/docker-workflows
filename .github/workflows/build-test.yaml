---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Reusable Docker build/test (verify) pipeline.
#
# Builds every container image in the repository (or an explicit list),
# lints the Dockerfiles, generates per-image SBOMs and scans them with
# Grype. Nothing publishes from this lane; merge.yaml and
# build-test-release.yaml own the publish legs.
#
# Job graph (-> denotes sequence; { } runs in parallel):
#   gerrit-validate -> { repository-metadata | docker-metadata }
#   docker-metadata -> { dockerfile-lint | build }
#   build -> { tests | sbom -> grype }
#
# The dockerfile-lint (hadolint) job gates on docker-metadata rather
# than build:
# Dockerfile lint needs no built image, and surfacing lint findings
# when the build itself fails shortens the fix cycle.
#
# Image discovery: with no 'images' input the docker-metadata job
# walks path_prefix for Dockerfiles at the locations observed across
# the LF project estate (repository root, docker/, src/main/docker/,
# and one-level per-image directories such as base_sdc-jetty/). Pass
# the 'images' JSON input to override discovery; its order is the
# build order, which also serves same-repository FROM chains.
#
# This verify lane builds single-platform images (the runner's native
# platform). Multi-architecture builds and manifest assembly belong to
# the publish lanes.
#
# Call this from a thin caller workflow; see examples/build-test/ for
# both a plain GitHub-native caller and a Gerrit-wrapped caller.
name: '[R] Docker Build/Test'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      # --- Checkout target (defaults to the calling repository) ---
      repository:
        description: 'Repository to check out (owner/name)'
        required: false
        type: string
        default: ''
      ref:
        description: 'Branch/tag/SHA to check out (empty = default branch)'
        required: false
        type: string
        default: ''

      # --- Project layout ---
      path_prefix:
        description: 'Path to the project root directory'
        required: false
        type: string
        default: '.'

      # --- Image selection/build ---
      images:
        description: >-
          JSON array describing the images to build; an empty string
          (the default) auto-discovers Dockerfiles under path_prefix.
          When provided, the array must be non-empty; each entry takes
          name and context (required), dockerfile (default
          context/Dockerfile), target and build_args (optional list of
          KEY=VALUE strings). Array order is the build order.
        required: false
        type: string
        default: ''
      image_namespace:
        description: >-
          Namespace prefixed to every image name (e.g. 'onap' tags
          images as onap/<name>). Empty applies no namespace.
        required: false
        type: string
        default: ''
      build_command:
        description: >-
          Escape hatch: a shell command run from path_prefix that
          builds the container images (e.g. 'make images' or
          'mvn -P docker package'). The workflow then enumerates the
          images the command created and feeds them to the test, SBOM
          and scan jobs. Empty (default) builds the discovered/declared
          Dockerfiles natively with docker buildx.
        required: false
        type: string
        default: ''
      build_command_images:
        description: >-
          Space or comma separated image references that
          build_command produces, e.g. 'onap/cps:latest'. Declaring
          them replaces the inference the workflow otherwise performs
          to work out which images the command built, and is the only
          reliable account where that inference cannot reach: a
          builder stamping a reproducible creation timestamp (jib
          pins it to the Unix epoch) is indistinguishable from a
          pulled base on daemons using the containerd image store.
          Empty (the default) infers.
        required: false
        type: string
        default: ''
      build_timeout_minutes:
        description: 'Timeout for the build job in whole minutes'
        required: false
        type: number
        default: 30
      build_permit_fail:
        description: >-
          Permit image build failures without failing the workflow.
          Intended for repositories whose Dockerfiles predate the
          current state of their upstream bases and package feeds:
          the lane still lints every Dockerfile and reports which
          images build, without gating review on breakage that
          predates the change under test. Images that do build carry
          on to the test, SBOM and scan jobs. Unlike the lint and
          scan toggles this input has no repository variable fallback, so
          nothing can disable build gating across an organisation by
          accident.
        required: false
        type: boolean
        default: false

      # --- Tests ---
      test_command:
        description: >-
          Shell command run from path_prefix after the built images
          load into the Docker daemon (a smoke/integration hook, e.g.
          'make test'). The IMAGES environment variable carries a JSON
          array of the built image tags. Empty skips the tests job
          with a notice.
        required: false
        type: string
        default: ''
      test_permit_fail:
        description: 'Permit test failures without failing the workflow'
        required: false
        type: boolean
        default: false

      # --- Dockerfile lint (hadolint) ---
      lint_enabled:
        description: 'Run the Dockerfile lint job (set false to skip)'
        required: false
        type: boolean
        default: true
      lint_permit_fail:
        description: 'Permit hadolint findings (the NO_BLOCK pattern)'
        required: false
        type: boolean
        default: false
      audit_permit_fail:
        description: >-
          DEPRECATED alias for lint_permit_fail, retained so existing
          callers keep working. This job lints Dockerfiles; it does not
          audit dependencies. Elsewhere in the estate audit_* governs a
          dependency audit, so the name is being retired here. Prefer
          lint_permit_fail; this input is removed at the next major.
        required: false
        type: boolean
        default: false

      # --- SBOM ---
      sbom_enabled:
        description: >-
          Generate an image SBOM (set false to skip). The Grype scan
          reads the SBOM, so skipping generation leaves it nothing to
          scan. To keep the SBOM but drop the scan, use grype_enabled.
        required: false
        type: boolean
        default: true

      # --- Grype scan ---
      grype_enabled:
        description: >-
          Run the Grype vulnerability scan over the generated SBOMs (set
          false to skip). Decoupling is one-way: disabling the scan
          keeps the SBOMs, but disabling the SBOM job also stops the
          scan, which has nothing to read.
        required: false
        type: boolean
        default: true
      grype_fail_on:
        description: 'Minimum severity that fails the Grype scan'
        required: false
        type: string
        default: 'medium'
      grype_permit_fail:
        description: >-
          Permit Grype findings without failing the job. When false, falls
          back to the NO_BLOCK_AUDIT_FAIL repository variable at runtime.
        required: false
        type: boolean
        default: false

      # --- Runner hardening ---
      harden_runner_egress:
        description: "Harden-runner egress policy: 'block' or 'audit'"
        required: false
        type: string
        default: 'block'
      harden_runner_allowlist:
        description: 'Out-of-band harden-runner allow-list configuration'
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@f0f76ac22f342c9a788ebcabe584e68a79cc2e83'  # v0.16.0
      build_permit_egress_traffic:
        description: >-
          Run harden-runner in audit mode for the build job only,
          permitting unrestricted egress. Use when base images or
          build-time dependencies come from registries/CDNs that are
          impractical to enumerate in the allow-list. Other jobs stay
          governed by harden_runner_egress; left unset, the build job
          follows it too.
        required: false
        type: boolean
        default: false

      # --- Gerrit-aware checkout (empty unless dispatched via Gerrit) ---
      gerrit_refspec:
        description: 'Gerrit refspec of the change under test'
        required: false
        type: string
        default: ''
      gerrit_project:
        description: 'Gerrit project name'
        required: false
        type: string
        default: ''
      gerrit_branch:
        description: 'Gerrit target branch'
        required: false
        type: string
        default: ''
      gerrit_url:
        description: >-
          Gerrit server URL. Empty falls back to the GERRIT_URL repository
          variable at runtime.
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  gerrit-validate:
    name: 'Validate Gerrit Inputs'
    # Fails fast with a clear message when gerrit_refspec is set without
    # the project/branch the Gerrit checkout path also requires. The
    # build-chain root job depends on this, so invalid Gerrit inputs stop
    # the pipeline early and cleanly. This job always runs (only the
    # validation step is conditional), so gating dependents on it does
    # not trip GitHub's "skipped need skips dependents" behaviour.
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: 'Require Gerrit project, branch and URL'
        if: inputs.gerrit_refspec != ''
        shell: bash
        env:
          GERRIT_PROJECT: ${{ inputs.gerrit_project }}
          GERRIT_BRANCH: ${{ inputs.gerrit_branch }}
          # yamllint disable-line rule:line-length
          GERRIT_URL: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
        run: |
          # gerrit_refspec is set, so the Gerrit checkout path runs and
          # also requires gerrit_project, gerrit_branch and a resolvable
          # Gerrit URL (the gerrit_url input or the GERRIT_URL variable).
          missing=''
          if [ -z "${GERRIT_PROJECT}" ]; then
            missing="${missing} gerrit_project"
          fi
          if [ -z "${GERRIT_BRANCH}" ]; then
            missing="${missing} gerrit_branch"
          fi
          if [ -z "${GERRIT_URL}" ]; then
            missing="${missing} gerrit_url/GERRIT_URL"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::gerrit_refspec is set but missing:${missing}"
            exit 1
          fi
          echo "Gerrit inputs validated ✅"

  repository-metadata:
    name: 'Repository Metadata'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@805eedb0508c07714b61887a2b87a5c4bbeff22a  # v0.12.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 'Gather repository metadata'
        id: repo-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/repository-metadata-action@847400e0d0b34cc88a572fa9575accd80401b796  # v0.3.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: 'true'
          gerrit_summary: ${{ inputs.gerrit_refspec != '' }}
          artifact_upload: 'true'
          artifact_formats: 'json'

  docker-metadata:
    name: 'Docker Metadata'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    outputs:
      images_json: ${{ steps.discover.outputs.images_json }}
      image_count: ${{ steps.discover.outputs.image_count }}
      build_id: ${{ steps.discover.outputs.build_id }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@805eedb0508c07714b61887a2b87a5c4bbeff22a  # v0.12.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: 'Discover images'
        id: discover
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
          IMAGES_INPUT: ${{ inputs.images }}
          TARGET_REPOSITORY: ${{ inputs.repository || github.repository }}
          IMAGE_NAMESPACE: ${{ inputs.image_namespace }}
          BUILD_COMMAND: ${{ inputs.build_command }}
          BUILD_COMMAND_IMAGES: ${{ inputs.build_command_images }}
        run: |
          # Resolve the image list: an explicit 'images' input wins;
          # otherwise walk the estate-observed Dockerfile locations.
          cd "${PATH_PREFIX}"
          if [ -n "${IMAGES_INPUT}" ]; then
            if ! jq -e 'type == "array" and length > 0 and
                all(.[]; (.name | type == "string") and
                         (.context | type == "string") and
                         ((.dockerfile // "") | type == "string") and
                         ((.target // "") | type == "string") and
                         ((.build_args // []) | type == "array" and
                           all(.[]; type == "string")))' \
                >/dev/null 2>&1 <<< "${IMAGES_INPUT}"; then
              echo "::error::images input must be a non-empty JSON" \
                "array of objects with string 'name' and 'context'" \
                "keys; optional 'dockerfile'/'target' take strings" \
                "and 'build_args' a list of KEY=VALUE strings. Pass" \
                "an empty string (not []) for auto-discovery"
              exit 1
            fi
            images=$(jq -c . <<< "${IMAGES_INPUT}")
          else
            repo_name="${TARGET_REPOSITORY##*/}"
            if [ "${PATH_PREFIX}" != "." ]; then
              repo_name=$(basename "${PATH_PREFIX}")
            fi
            images='[]'
            add_image() {
              images=$(jq -c \
                --arg n "$1" --arg d "$2" --arg c "$3" \
                '. + [{name: $n, dockerfile: $d, context: $c}]' \
                <<< "${images}")
            }
            if [ -f Dockerfile ]; then
              add_image "${repo_name}" "Dockerfile" "."
            fi
            if [ -f docker/Dockerfile ]; then
              add_image "${repo_name}" "docker/Dockerfile" "docker"
            fi
            if [ -f src/main/docker/Dockerfile ]; then
              add_image "${repo_name}" \
                "src/main/docker/Dockerfile" "src/main/docker"
            fi
            for df in */Dockerfile; do
              [ -f "${df}" ] || continue
              dir="${df%/Dockerfile}"
              case "${dir}" in
                docker|src) continue ;;
              esac
              add_image "${dir}" "${df}" "${dir}"
            done
          fi
          # Sanitise names to the docker repository character set
          images=$(jq -c \
            '[.[] | .name |= (ascii_downcase |
              gsub("[^a-z0-9._-]"; "-"))]' \
            <<< "${images}")
          if [ -n "${IMAGES_INPUT}" ]; then
            # Explicit entries whose names collide after
            # normalisation (e.g. API and api) must reject: silently
            # dropping one would build only part of the caller's
            # requested image set, and the publish lanes reject the
            # same input — verify must not pass what merge refuses
            dupes=$(jq -r '[.[].name] | group_by(.) |
              map(select(length > 1) | .[0]) | .[]' \
              <<< "${images}")
            if [ -n "${dupes}" ]; then
              echo "::error::Duplicate image name(s) after" \
                "normalisation in the images input: ${dupes}"
              exit 1
            fi
          else
            # Auto-discovery drops duplicates (e.g. a root Dockerfile
            # plus docker/ both mapping to the repository name). The
            # de-duplication preserves array order — order is the
            # build order, which same-repository FROM chains rely on
            # — keeping the first occurrence of each name.
            images=$(jq -c \
              'reduce .[] as $img ([];
                if any(.[]; .name == $img.name) then .
                else . + [$img] end)' \
              <<< "${images}")
          fi
          count=$(jq 'length' <<< "${images}")
          if [ "${count}" -eq 0 ] && [ -z "${BUILD_COMMAND}" ]; then
            echo "::error::No Dockerfiles found under" \
              "'${PATH_PREFIX}' and no images input provided"
            exit 1
          fi
          if [ "${count}" -eq 0 ]; then
            # The build_command escape hatch builds images with
            # project tooling, and jib or a Gradle plugin synthesises
            # an image without a Dockerfile to find, so an empty
            # discovery result is not an error here — the build job
            # enumerates whatever the command created
            echo "::notice::No Dockerfiles discovered under" \
              "'${PATH_PREFIX}'; build_command builds the images"
          fi
          # Post-sanitisation validation: every name must be a valid
          # Docker repository component (start and end alphanumeric),
          # so tag construction fails here with a clear message rather
          # than at build time.
          bad=$(jq -r '.[] | .name |
            select(test("^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$") | not)' \
            <<< "${images}")
          if [ -n "${bad}" ]; then
            echo "::error::Invalid image name(s) after sanitisation:" \
              "${bad} (names must start/end with a-z or 0-9)"
            exit 1
          fi
          echo "Discovered ${count} image(s):"
          jq -r '.[] | "  \(.name)  (\(.dockerfile //
            (.context + "/Dockerfile")))"' <<< "${images}"
          echo "images_json=${images}" >> "$GITHUB_OUTPUT"
          echo "image_count=${count}" >> "$GITHUB_OUTPUT"
          # Artifact names must be unique per workflow-call invocation:
          # matrix legs calling this workflow in parallel would
          # otherwise collide on the docker-archives/sbom-files names.
          # Duplicates are not rejected or merged: each upload is kept
          # as its own artifact and download-artifact resolves a name
          # to the newest match, so a downstream job would silently
          # consume another leg's images. Hash the distinguishing
          # inputs into a stable per-leg id.
          build_id=$(printf '%s|%s|%s|%s|%s|%s' \
            "${TARGET_REPOSITORY}" "${PATH_PREFIX}" "${IMAGES_INPUT}" \
            "${IMAGE_NAMESPACE}" "${BUILD_COMMAND}" \
            "${BUILD_COMMAND_IMAGES}" \
            | sha256sum | cut -c1-12)
          echo "build_id=${build_id}" >> "$GITHUB_OUTPUT"
          {
            echo "## Docker Images"
            echo ""
            echo "| Image | Dockerfile | Context |"
            echo "| ----- | ---------- | ------- |"
            jq -r '.[] | "| \(.name) | \(.dockerfile //
              (.context + "/Dockerfile")) | \(.context) |"' \
              <<< "${images}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: 'Docker Build'
    needs: docker-metadata
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.build.outputs.images }}
      image_count: ${{ steps.build.outputs.image_count }}
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    steps:
      # The build job can opt into audit egress independently of the
      # other jobs via build_permit_egress_traffic, for base images and
      # build-time dependencies from registries/CDNs impractical to
      # enumerate in the allow-list. Left unset it follows
      # harden_runner_egress like every other job.
      #
      # One harden-runner step with the policy computed, rather than
      # two selected by condition: harden-runner declares a 'pre'
      # entry point and no 'pre-if', so its pre-phase runs whatever a
      # step-level 'if:' says. Both would engage the agent, the first
      # would win, and audit mode would be unreachable.
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@805eedb0508c07714b61887a2b87a5c4bbeff22a  # v0.12.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ (inputs.build_permit_egress_traffic || inputs.harden_runner_egress == 'audit') && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: 'Set up Docker buildx'
        # yamllint disable-line rule:line-length
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
        with:
          # The default docker-container driver isolates builds from
          # the daemon's image store, so an image --load'ed by one
          # build is invisible to the next build's FROM — breaking
          # same-repository chains. The docker driver builds against
          # the daemon directly; multi-platform (which it lacks)
          # belongs to the publish lanes, not this verify lane.
          driver: docker

      - name: 'Build images'
        id: build
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
          IMAGES_JSON: ${{ needs.docker-metadata.outputs.images_json }}
          IMAGE_NAMESPACE: ${{ inputs.image_namespace }}
          BUILD_COMMAND: ${{ inputs.build_command }}
          BUILD_COMMAND_IMAGES: ${{ inputs.build_command_images }}
          PERMIT_FAIL: ${{ inputs.build_permit_fail }}
        run: |
          # Build every image, then export each to a docker archive so
          # the test/SBOM jobs can consume the exact bits built here.
          cd "${PATH_PREFIX}"
          if [ -n "${IMAGE_NAMESPACE}" ] &&
            [[ ! "${IMAGE_NAMESPACE}" =~ ^[a-z0-9._-]+(/[a-z0-9._-]+)*$ ]]
          then
            echo "::error::Invalid image_namespace" \
              "'${IMAGE_NAMESPACE}' (lowercase path components" \
              "without leading/trailing/consecutive slashes)"
            exit 1
          fi
          # build_command_images names what build_command produces, so
          # it says nothing on its own. Ignoring it would leave a
          # caller believing they had declared their images while the
          # workflow discovered a different set from Dockerfiles and
          # carried that downstream instead — a misconfiguration that
          # would otherwise succeed.
          if [ -n "${BUILD_COMMAND_IMAGES}" ] &&
            [ -z "${BUILD_COMMAND}" ]
          then
            echo "::error::build_command_images requires" \
              "build_command; it names the images that command" \
              "produces and has no meaning without it"
            exit 1
          fi
          declare -a tags=()
          declare -a failures=()
          declare -a unattributed=()
          if [ -n "${BUILD_COMMAND}" ]; then
            # Escape hatch: the project's own tooling builds the
            # images; enumerate what it created by diffing the image
            # list around the command. Both a locally built image and
            # a base the command pulled show up as new names, so
            # something has to tell them apart; see the candidate
            # loop below for how, and why one signal is not enough.
            #
            # Declared references are validated and cleared first,
            # because both have to happen before the command runs.
            declare -a declared_images=()
            while IFS= read -r declared; do
              [ -n "${declared}" ] || continue
              # Validate the whole reference, since all of it
              # reaches docker and crane. '@' is excluded outright:
              # a digest reference has no tag to publish under, and
              # the publish name comes from stripping the tag, which
              # would leave '@sha256' behind.
              #
              # An IPv6 registry is bracketed, so it needs its own
              # shape here: the brackets are the only characters in a
              # reference this gate would otherwise refuse outright,
              # and refusing them would leave a caller addressing a
              # registry that way unable to declare anything at all.
              ipv6_host='\[[0-9A-Fa-f:]+\]'
              body='[A-Za-z0-9][A-Za-z0-9._/:-]*'
              if [[ ! "${declared}" =~ ^${body}$ ]] &&
                [[ ! "${declared}" =~ ^${ipv6_host}(:[0-9]+)?/${body}$ ]]
              then
                echo "::error::Invalid build_command_images entry:" \
                  "${declared} (expected name:tag, no digest)"
                exit 1
              fi
              ref_body="${declared%:*}"
              ref_tag="${declared##*:}"
              # Cutting at the last colon finds a tag only when the
              # final component carries one. On
              # 'localhost:5000/team/app' it finds the registry port
              # instead, which is how such a value would come to
              # publish under the name 'localhost'.
              if [ "${ref_body}" = "${declared}" ] ||
                [[ "${ref_tag}" == */* ]]; then
                echo "::error::build_command_images entry" \
                  "'${declared}' needs a tag on its final component"
                exit 1
              fi
              if [[ ! "${ref_tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]
              then
                echo "::error::build_command_images entry" \
                  "'${declared}' has an invalid tag '${ref_tag}'"
                exit 1
              fi
              # 'sha256:<hex>' is how docker names an image by id, not
              # a repository and a tag, and it reads as the latter
              # here: 'sha256' passes as a name and the hex passes as a
              # tag. Left alone, 'docker image inspect' would resolve
              # it against any image already on the daemon, so the
              # post-command check could pass on something the command
              # never produced -- and the publish name, taken by
              # stripping the tag, would come out as 'sha256'. Docker
              # refuses the form outright; refuse it before the command
              # runs rather than after.
              if [ "${ref_body}" = 'sha256' ]; then
                echo "::error::build_command_images entry" \
                  "'${declared}' names an image by id, not a" \
                  "repository and tag"
                exit 1
              fi
              # Every path component has to hold up, not just the
              # last: docker rejects 'team//app', 'team/_bad/app' and
              # 'team:port/app' as surely as a bad name, and without
              # this the command runs before any of that surfaces.
              #
              # A trailing slash has to be caught before the split
              # rather than by the loop below: 'read' discards one
              # trailing empty field, so 'app/' splits to a single
              # 'app' and the gap disappears before anything can look
              # at it. Only one field goes, so 'app//' still leaves an
              # empty for the loop, which is why this covers the one
              # case rather than standing in for that check.
              if [[ "${ref_body}" == */ ]]; then
                echo "::error::build_command_images entry" \
                  "'${declared}' has an empty path component"
                exit 1
              fi
              old_ifs="${IFS}"
              IFS='/'
              read -ra ref_parts <<< "${ref_body}"
              IFS="${old_ifs}"
              component='^[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*$'
              # Docker's domain grammar, spelled out: a registry is
              # dot-separated labels, each starting and ending
              # alphanumeric with hyphens only inside, and an optional
              # port. Matching the characters without the boundaries
              # would admit 'bad-.example', 'bad..example' and
              # 'example.', all of which docker refuses to parse.
              label='[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?'
              registry="^(${label}([.]${label})*|${ipv6_host})(:[0-9]+)?$"
              has_registry='false'
              part_index=0
              for part in "${ref_parts[@]}"; do
                if [ -z "${part}" ]; then
                  echo "::error::build_command_images entry" \
                    "'${declared}' has an empty path component"
                  exit 1
                fi
                # A leading component carrying a dot or a colon, or
                # named localhost, is a registry rather than a path
                # component — docker's own rule for telling them
                # apart.
                #
                # Docker goes on to read such a component as a Docker
                # Hub path when it does not parse as a registry, so it
                # accepts 'a_b.c/x:v1' and 'UPPER/x:v1'. This refuses
                # them, and that asymmetry is deliberate: refusing a
                # reference docker would take costs a declaration that
                # never ran, while accepting one docker rejects spends
                # a whole build before anything surfaces. Parity with
                # the real parser belongs where it can be tested
                # directly against it, which is the extraction in #34.
                if [ "${part_index}" -eq 0 ] &&
                  [ "${#ref_parts[@]}" -gt 1 ] &&
                  { [[ "${part}" == *.* ]] || [[ "${part}" == *:* ]] ||
                    [ "${part}" = localhost ]; }
                then
                  has_registry='true'
                  if [[ ! "${part}" =~ ${registry} ]]
                  then
                    echo "::error::build_command_images entry" \
                      "'${declared}' has an invalid registry" \
                      "'${part}'"
                    exit 1
                  fi
                elif [[ ! "${part}" =~ ${component} ]]; then
                  echo "::error::build_command_images entry" \
                    "'${declared}' has an invalid path component" \
                    "'${part}'"
                  exit 1
                fi
                part_index=$((part_index + 1))
              done
              # Docker caps the repository path -- the reference minus
              # any registry -- at 255 characters and refuses a longer
              # one however well formed its components are, so without
              # this the command runs before the reference surfaces as
              # merely absent. A single component is normalised to
              # 'library/<name>' first, which spends eight of those
              # characters before the name gets any -- but only where
              # there is no registry, since that normalisation is for
              # bare Docker Hub names. The same limit is kept on
              # assembled namespace aliases in build-test-release.yaml.
              ref_path="${ref_body}"
              if [ "${has_registry}" = 'true' ]; then
                ref_path="${ref_body#*/}"
              elif [[ "${ref_path}" != */* ]]; then
                ref_path="library/${ref_path}"
              fi
              if [ "${#ref_path}" -gt 255 ]; then
                echo "::error::build_command_images entry" \
                  "'${declared}' resolves to a" \
                  "${#ref_path}-character repository path, over" \
                  "Docker's limit of 255"
                exit 1
              fi
              # A reference named twice would be saved twice: the
              # archive names derive from it, so the per-image save
              # collides in one lane and overwrites in the other.
              # Rejecting matches how the images input treats
              # duplicates, and a repeat says nothing a single entry
              # does not.
              for existing in "${declared_images[@]}"; do
                if [ "${existing}" = "${declared}" ]; then
                  echo "::error::build_command_images lists" \
                    "${declared} more than once"
                  exit 1
                fi
              done
              declared_images+=("${declared}")
            done < <(tr ',' ' ' <<< "${BUILD_COMMAND_IMAGES}" \
              | tr -s '[:space:]' '\n')
            # A value made only of separators parses to nothing. Left
            # alone it would fall through to inference, so a caller who
            # supplied the input precisely to replace inference would
            # get it anyway, and on a store where the digest does not
            # discriminate they would get the unattributable-images
            # error while holding the input that answers it.
            if [ -n "${BUILD_COMMAND_IMAGES}" ] &&
              [ "${#declared_images[@]}" -eq 0 ]
            then
              echo "::error::build_command_images is set but names no" \
                "references; list the images the command produces, or" \
                "remove the input to enumerate them by inference"
              exit 1
            fi
            # Drop any existing tag of the same name, so a reference
            # present afterwards is one this command produced.
            # Otherwise a daemon reused between runs lets a command
            # that quietly built nothing hand its previous image to
            # the test, SBOM and scan jobs as though it were fresh.
            for declared in "${declared_images[@]}"; do
              if docker image inspect "${declared}" \
                >/dev/null 2>&1; then
                echo "::notice::Clearing existing ${declared} so the" \
                  "command has to produce it"
                # A refusal has to stop the run. Docker declines to
                # remove a tag a container still references, and
                # carrying on would leave the stale image in place
                # for the check below to accept as fresh output,
                # which is the hole this clearing exists to close.
                if ! docker image rm "${declared}" >/dev/null 2>&1
                then
                  echo "::error::Could not clear the existing" \
                    "${declared}; with that tag still in place a" \
                    "command that builds nothing would look" \
                    "successful. Remove any container holding it"
                  exit 1
                fi
              fi
            done
            docker image ls --format '{{.Repository}}:{{.Tag}}' \
              | sort -u > /tmp/images-before.txt
            echo "::group::build_command"
            command_status=0
            bash -e -c "${BUILD_COMMAND}" || command_status=$?
            echo "::endgroup::"
            if [ "${command_status}" -ne 0 ]; then
              echo "::error::build_command exited ${command_status}"
              failures+=("build_command")
            fi
            if [ "${#declared_images[@]}" -gt 0 ]; then
              # Declared: no inference at all. The caller names what
              # the command produces, which is the only account that
              # holds for a builder stamping a reproducible creation
              # timestamp, and it costs a caller who knows their own
              # image names nothing to supply. Each reference was
              # cleared above, so its presence here means this
              # invocation created it.
              for declared in "${declared_images[@]}"; do
                if docker image inspect "${declared}" \
                  >/dev/null 2>&1; then
                  tags+=("${declared}")
                else
                  echo "::error::build_command_images names" \
                    "${declared}, which the command did not create"
                  failures+=("${declared}")
                fi
              done
            else
              docker image ls --format '{{.Repository}}:{{.Tag}}' \
                | sort -u > /tmp/images-after.txt
              while IFS= read -r candidate; do
                # A registry digest is the only evidence available
                # here that an image came from a registry rather
                # than from this command, and it discriminates under
                # the classic image store, where a local build
                # carries none.
                #
                # The containerd image store gives every image a
                # digest, so the evidence stops discriminating. Which
                # store this is shows in the run itself: a candidate
                # without a digest can only have been built here, and
                # proves the store gives local builds none, which
                # makes the digest-bearing candidates pulled bases.
                # Absent that proof the two readings cannot be told
                # apart, so those names are held rather than resolved,
                # and settled below where the answer is known.
                #
                # The creation timestamp is deliberately not consulted.
                # A pulled base carries its upstream build date while a
                # fresh build carries this run's, but that is metadata
                # the image holds rather than proof of where it came
                # from: a base published while the command ran would
                # read as locally built, and a builder stamping a
                # reproducible timestamp -- jib pins it to the Unix
                # epoch -- would read as pulled, on exactly the store
                # where nothing else can tell.
                digests=$(docker image inspect \
                  --format '{{len .RepoDigests}}' "${candidate}")
                if [ "${digests}" = "0" ]; then
                  tags+=("${candidate}")
                else
                  unattributed+=("${candidate}")
                fi
              done < <(comm -13 /tmp/images-before.txt \
                /tmp/images-after.txt | grep -v '<none>' || true)
              # Something was built here without a digest, so this
              # store gives local builds none and the held names are
              # pulled bases after all.
              if [ "${#tags[@]}" -gt 0 ]; then
                for held in "${unattributed[@]}"; do
                  echo "::notice::Skipping pulled image ${held}" \
                    "(registry digest, on a store that gives local" \
                    "builds none)"
                done
                unattributed=()
              fi
            fi
            # Nothing to carry downstream. Which of the two things
            # went wrong depends on what the daemon left behind, and
            # the attribution message is reported whether or not the
            # command also exited non-zero: it names the images and the
            # input that settles them, which is the actionable part,
            # and a failing command is exactly when a caller most needs
            # it. Under build_permit_fail the job carries on, so
            # without this the run would end green having silently
            # carried nothing.
            #
            # The bare "created nothing" line stays gated on there
            # being no prior failure, since a non-zero exit has already
            # said that: report it once, not twice. Likewise the
            # failure is recorded only when it is not already there.
            if [ "${#tags[@]}" -eq 0 ]; then
              if [ "${#unattributed[@]}" -gt 0 ]; then
                echo "::error::build_command left" \
                  "${#unattributed[@]} image(s) this run cannot" \
                  "attribute: ${unattributed[*]}. Every new image" \
                  "here carries a registry digest, which means a" \
                  "pulled base on one image store and proves nothing" \
                  "on another, so either the command built these and" \
                  "they need naming with the build_command_images" \
                  "input, or it built nothing at all"
              elif [ "${#failures[@]}" -eq 0 ]; then
                echo "::error::build_command completed but created" \
                  "no new images. Name them with the" \
                  "build_command_images input if the command builds" \
                  "images this workflow cannot observe"
              fi
              if [ "${#failures[@]}" -eq 0 ]; then
                failures+=("build_command")
              fi
            fi
          else
            while IFS= read -r spec; do
              name=$(jq -r '.name' <<< "${spec}")
              ctx=$(jq -r '.context' <<< "${spec}")
              df=$(jq -r '.dockerfile //
                (.context + "/Dockerfile")' <<< "${spec}")
              target=$(jq -r '.target // empty' <<< "${spec}")
              tag="${name}:verify"
              if [ -n "${IMAGE_NAMESPACE}" ]; then
                tag="${IMAGE_NAMESPACE}/${tag}"
              fi
              args=(--load -f "${df}" -t "${tag}")
              if [ -n "${target}" ]; then
                args+=(--target "${target}")
              fi
              while IFS= read -r build_arg; do
                [ -n "${build_arg}" ] &&
                  args+=(--build-arg "${build_arg}")
              done < <(jq -r '.build_args[]? // empty' <<< "${spec}")
              echo "::group::Build ${tag}"
              build_status=0
              docker buildx build "${args[@]}" "${ctx}" ||
                build_status=$?
              echo "::endgroup::"
              # Every image gets an attempt: a later image can build
              # when an earlier one does not, and a full picture of
              # what breaks beats stopping at the first failure. An
              # image whose same-repository base failed fails in
              # turn, which is the accurate signal.
              if [ "${build_status}" -eq 0 ]; then
                tags+=("${tag}")
                # With a namespace the alias becomes
                # <namespace>/<name>:verify; also apply the plain
                # <name>:verify alias so auto-discovered chains
                # (FROM <name>:verify) resolve either way, as they
                # already do in the merge lane
                if [ -n "${IMAGE_NAMESPACE}" ]; then
                  docker tag "${tag}" "${name}:verify"
                fi
              else
                echo "::error::Build failed for ${tag} (exit" \
                  "${build_status})"
                failures+=("${tag}")
              fi
            done < <(jq -c '.[]' <<< "${IMAGES_JSON}")
          fi
          if [ "${#tags[@]}" -gt 0 ]; then
            built=$(printf '%s\n' "${tags[@]}" | jq -cnR '[inputs]')
          else
            built='[]'
          fi
          echo "Built ${#tags[@]} image(s): ${built}"
          {
            echo "images=${built}"
            echo "image_count=${#tags[@]}"
            # docker-save-images-action takes a space-separated list.
            # An image reference cannot contain whitespace, so the
            # join stays unambiguous, and an empty array yields an
            # empty string, which the action reads as nothing to save
            echo "images_list=${tags[*]}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Docker Build"
            echo ""
            echo "Built **${#tags[@]}** image(s):"
            echo ""
            if [ "${#tags[@]}" -gt 0 ]; then
              printf -- '- %s\n' "${tags[@]}"
            else
              echo "- (none)"
            fi
            echo ""
            if [ "${#failures[@]}" -gt 0 ]; then
              # Entries are image tags, or the literal 'build_command'
              # when the escape hatch fails, so the wording stays
              # neutral rather than claiming every entry is an image.
              echo "Failed **${#failures[@]}** build(s):"
              echo ""
              printf -- '- %s\n' "${failures[@]}"
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Outputs and the summary land before the gate, so whatever
          # did build stays visible either way.
          if [ "${#failures[@]}" -gt 0 ]; then
            if [ "${PERMIT_FAIL}" != "true" ]; then
              exit 1
            fi
            echo "::warning::${#failures[@]} build(s) failed;" \
              "permitted by build_permit_fail"
            echo "⚠️ Build failures permitted by build_permit_fail" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 'Save and upload image archives'
        # One archive per image, because the SBOM job runs syft per
        # image and Grype scans the per-image SBOMs; a single
        # combined tar could not be separated again. The artifact
        # name carries build_id so parallel workflow_call legs cannot
        # overwrite each other, and overwrite stays false so a
        # collision fails loudly rather than silently taking the last
        # writer. fail-on-empty is false because build_permit_fail
        # makes building nothing a legitimate outcome.
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/docker-save-images-action@fd148182fc22be846b343f92404f4104d8d049f1  # v0.2.0
        with:
          docker-artifacts-to-save: ${{ steps.build.outputs.images_list }}
          mode: 'per-image'
          # yamllint disable-line rule:line-length
          artifact-name: docker-archives-${{ needs.docker-metadata.outputs.build_id }}
          output-directory: 'docker-archives'
          overwrite: 'false'
          retention-days: '1'
          fail-on-empty: 'false'

  tests:
    name: 'Tests'
    runs-on: ubuntu-latest
    needs: ['build', 'docker-metadata']
    # Under build_permit_fail the build job can succeed having built
    # nothing, in which case no image archive exists to test.
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
          && needs.build.outputs.image_count != '0' }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@805eedb0508c07714b61887a2b87a5c4bbeff22a  # v0.12.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: 'Download image archives'
        if: inputs.test_command != ''
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: docker-archives-${{ needs.docker-metadata.outputs.build_id }}
          path: /tmp/docker-archives

      - name: 'Run tests'
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
          TEST_COMMAND: ${{ inputs.test_command }}
          IMAGES: ${{ needs.build.outputs.images }}
          # The NO_BLOCK/soft-fail pattern: the test_permit_fail input
          # (or, when unset, the NO_BLOCK_AUDIT_FAIL repository
          # variable) disables failure propagation.
          # yamllint disable-line rule:line-length
          NO_BLOCK: ${{ inputs.test_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
        run: |
          # Load the built images and run the caller's test hook; the
          # IMAGES environment variable carries the built tag list.
          if [ -z "${TEST_COMMAND}" ]; then
            echo "::notice::No test_command provided; nothing to run"
            exit 0
          fi
          # nullglob: a missing/empty artifact must fail with a clear
          # message, not a literal-glob docker load error.
          shopt -s nullglob
          archives=(/tmp/docker-archives/*.tar)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::No image archives found to load"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            docker load -i "${archive}"
          done
          cd "${PATH_PREFIX}"
          status=0
          bash -e -c "${TEST_COMMAND}" || status=$?
          if [ "${status}" != "0" ]; then
            if [ "${NO_BLOCK}" = "true" ]; then
              echo "::warning::Tests failed, but failures are" \
                "permitted so the job will not fail."
              exit 0
            fi
            exit "${status}"
          fi

  dockerfile-lint:
    name: 'Dockerfile Lint'
    runs-on: ubuntu-latest
    needs: 'docker-metadata'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.docker-metadata.result == 'success' && inputs.lint_enabled }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@805eedb0508c07714b61887a2b87a5c4bbeff22a  # v0.12.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: 'Lint Dockerfiles (hadolint)'
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
          IMAGES_JSON: ${{ needs.docker-metadata.outputs.images_json }}
          # Digest-pinned hadolint container; docker.io serves it and
          # sits in the egress allow-list.
          # yamllint disable-line rule:line-length
          HADOLINT_IMAGE: 'hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d'
          # The NO_BLOCK/soft-fail pattern: the lint_permit_fail input
          # (or its deprecated audit_permit_fail alias)
          # (or, when unset, the NO_BLOCK_AUDIT_FAIL repository
          # variable) disables failure propagation.
          # yamllint disable-line rule:line-length
          NO_BLOCK: ${{ inputs.lint_permit_fail || inputs.audit_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
        run: |
          # Lint exactly the Dockerfiles the build consumes (from the
          # resolved image list), so per-image dockerfile overrides
          # and non-standard filenames stay covered. The resolved
          # paths are relative to path_prefix (discovery runs there).
          cd "${PATH_PREFIX}"
          status=0
          while IFS= read -r dockerfile; do
            echo "::group::hadolint ${dockerfile}"
            docker run --rm \
              -v "${PWD}:/mnt:ro" -w /mnt \
              "${HADOLINT_IMAGE}" \
              hadolint "${dockerfile}" || status=1
            echo "::endgroup::"
          done < <(jq -r '.[] | .dockerfile //
            (.context + "/Dockerfile")' <<< "${IMAGES_JSON}")
          if [ "${status}" = "0" ]; then
            echo "Dockerfile lint passed ✅"
            exit 0
          fi
          if [ "${NO_BLOCK}" = "true" ]; then
            echo "::warning::hadolint reported findings, but failures" \
              "are permitted so the job will not fail."
            exit 0
          fi
          echo "::error::hadolint reported findings"
          exit 1

  sbom:
    name: 'Image SBOM'
    runs-on: ubuntu-latest
    needs: ['build', 'docker-metadata']
    # As for the tests job: no images built means no archive to scan.
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
          && needs.build.outputs.image_count != '0'
          && inputs.sbom_enabled }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@805eedb0508c07714b61887a2b87a5c4bbeff22a  # v0.12.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download image archives'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: docker-archives-${{ needs.docker-metadata.outputs.build_id }}
          path: /tmp/docker-archives

      - name: 'Install Syft'
        id: syft
        # yamllint disable-line rule:line-length
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0

      - name: 'Generate image SBOMs'
        shell: bash
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: |
          # One CycloneDX SBOM per image archive; the Grype job scans
          # every sbom-cyclonedx-*.json this step produces. nullglob:
          # a missing/empty artifact must fail with a clear message,
          # not a literal-glob Syft error.
          shopt -s nullglob
          archives=(/tmp/docker-archives/*.tar)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::No image archives found to scan"
            exit 1
          fi
          total=0
          for archive in "${archives[@]}"; do
            base=$(basename "${archive}" .tar)
            out="sbom-cyclonedx-${base}.json"
            echo "::group::SBOM ${base}"
            "${SYFT_CMD}" scan "docker-archive:${archive}" \
              -o "cyclonedx-json=${out}"
            echo "::endgroup::"
            count=$(jq '.components | length' "${out}")
            echo "${base}: ${count} components"
            total=$((total + count))
          done
          {
            echo "## SBOM Summary"
            echo ""
            echo "CycloneDX SBOM per image;" \
              "**${total}** components in total"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 'Upload SBOM artifacts'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-files-${{ needs.docker-metadata.outputs.build_id }}
          path: sbom-cyclonedx-*.json
          retention-days: 45
          # Fail fast: the downstream Grype job requires this artifact,
          # so a missing/misnamed SBOM must surface here, not later
          if-no-files-found: error

  grype:
    name: 'Grype Audit SBOM'
    runs-on: ubuntu-latest
    needs: ['sbom', 'docker-metadata']
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.sbom.result == 'success' && inputs.grype_enabled }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@805eedb0508c07714b61887a2b87a5c4bbeff22a  # v0.12.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download SBOM artefact'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom-files-${{ needs.docker-metadata.outputs.build_id }}

      # The grype_permit_fail input (or, when unset, the NO_BLOCK_AUDIT_FAIL
      # repository variable) disables failure propagation so pull requests
      # can proceed when blocked by newly discovered CVEs in base images
      # or transitive dependencies.
      - name: 'Grype audit SBOMs'
        id: grype-audit
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@87fd7bdad7f0809af58108e65f60debc244df348  # v0.0.2
        with:
          sbom: 'sbom-cyclonedx-*.json'
          fail-on: ${{ inputs.grype_fail_on }}
          # yamllint disable-line rule:line-length
          permit-fail: ${{ inputs.grype_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
          # yamllint disable-line rule:line-length
          artifact-name: grype-scan-results-${{ needs.docker-metadata.outputs.build_id }}
          retention-days: '45'
          github-token: ${{ secrets.GITHUB_TOKEN }}
