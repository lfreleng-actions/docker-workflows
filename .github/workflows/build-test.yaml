---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Reusable Docker build/test (verify) pipeline.
#
# Builds every container image in the repository (or an explicit list),
# lints the Dockerfiles, generates per-image SBOMs and scans them with
# Grype. Nothing publishes from this lane; merge.yaml and
# build-test-release.yaml own the publish legs.
#
# Job graph (-> denotes sequence; { } runs in parallel):
#   gerrit-validate -> { repository-metadata | docker-metadata
#     | check-release }
#   docker-metadata -> { dockerfile-lint | build }
#   build -> { tests | sbom -> grype }
#   repository-metadata -> grype (the dependency change verdict)
#   check-release -> release-verify
#
# Release-file verification: with snapshot_registry and
# release_registry set (the values merge.yaml receives), a change
# that adds or edits a container release file under releases/ or
# .releases/ is checked before it merges, as Jenkins'
# gerrit-release-verify does. check-release validates the file
# offline, then against the release container schema; release-verify
# then runs the promotion's registry checks without writing
# anything, when a registry credential is available. Neither job
# touches the image build. check-release still runs detection on
# every change, which takes seconds; the schema check, which
# installs uv and lftools-uv from astral.sh and PyPI, and
# release-verify skip when it finds no release file.
#
# The dockerfile-lint (hadolint) job gates on docker-metadata rather
# than build:
# Dockerfile lint needs no built image, and surfacing lint findings
# when the build itself fails shortens the fix cycle.
#
# Image discovery: with no 'images' input the docker-metadata job
# walks path_prefix for Dockerfiles at the locations observed across
# the LF project estate (repository root, docker/, src/main/docker/,
# and one-level per-image directories such as base_sdc-jetty/). Pass
# the 'images' JSON input to override discovery; its order is the
# build order, which also serves same-repository FROM chains.
#
# This verify lane builds single-platform images (the runner's native
# platform). Multi-architecture builds and manifest assembly belong to
# the publish lanes.
#
# Grype gating: grype_gate_when 'dependencies-changed' blocks on
# findings only when the change touched a Dockerfile or a dependency
# file of the ecosystems grype_dependency_ecosystems names. The grype
# job has no checkout, so repository-metadata, which checks out full
# history (or the Gerrit change at depth 2), runs the detection
# through repository-metadata-action and exports the verdict as its
# dependencies_changed output. The grype job forwards it only when
# that job succeeded. A change the detection cannot resolve, a
# context or Dockerfile the images input names that no pattern can
# express, and a failed or skipped repository-metadata job all leave
# the verdict empty, and the gate stays on.
#
# Call this from a thin caller workflow; see examples/build-test/ for
# both a plain GitHub-native caller and a Gerrit-wrapped caller.
name: '[R] Docker Build/Test'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      # --- Checkout target (defaults to the calling repository) ---
      repository:
        description: 'Repository to check out (owner/name)'
        required: false
        type: string
        default: ''
      ref:
        description: 'Branch/tag/SHA to check out (empty = default branch)'
        required: false
        type: string
        default: ''
      checkout_submodules:
        description: >-
          Check out git submodules in every job that checks out the
          repository, on the Gerrit and plain checkout paths alike, so
          image builds, tests and lint all see content a submodule
          carries. The Gerrit path also initialises submodules the
          change adds.
        required: false
        type: boolean
        default: false

      # --- Project layout ---
      path_prefix:
        description: 'Path to the project root directory'
        required: false
        type: string
        default: '.'
      build_artifacts:
        description: >-
          JSON array of build artefacts that earlier jobs of this
          workflow run uploaded, placed in the checkout before the
          images build: [{"name": "<artefact>", "path": "<dir>"}].
          path is optional, defaults to '.' and is relative to
          path_prefix. Only same-run artefacts qualify, so the
          calling job must 'needs:' the job that uploads them. A file
          the checkout already holds fails the build: artefacts add
          to the source tree and never replace it. Empty (the
          default) or '[]' downloads nothing.
        required: false
        type: string
        default: ''

      # --- Image selection/build ---
      images:
        description: >-
          JSON array describing the images to build; an empty string
          (the default) auto-discovers Dockerfiles under path_prefix.
          When provided, the array must be non-empty; each entry takes
          name and context (required), dockerfile (default
          context/Dockerfile), target and build_args (optional list of
          KEY=VALUE strings). Array order is the build order.
        required: false
        type: string
        default: ''
      select:
        description: >-
          Comma- or space-separated image name globs choosing a subset
          of the images discovery finds or the images input lists, e.g.
          'api-*'. Empty (the default) builds every image. A selection
          matching no image fails the run. Cannot combine with
          build_command, whose project tooling decides what it builds.
        required: false
        type: string
        default: ''
      select_dependencies:
        description: >-
          With select, also build the same-repository images the
          selected ones build FROM, so a partial build still resolves
          its chain. No effect when select is empty.
        required: false
        type: boolean
        default: true
      namespace_mode:
        description: >-
          How the namespace prefixed to every image name resolves:
          'none' (no namespace), 'auto' (the lowercased owner of the
          repository built) or 'manual' (the namespace input). With
          'onap', images tag as onap/<name>.
        required: false
        type: string
        default: 'none'
      namespace:
        description: >-
          Image namespace for namespace_mode 'manual' (e.g. 'onap' or
          'onap/so'); an error with any other mode.
        required: false
        type: string
        default: ''
      build_command:
        description: >-
          Escape hatch: a shell command run from path_prefix that
          builds the container images (e.g. 'make images' or
          'mvn -P docker package'). The workflow then enumerates the
          images the command created and feeds them to the test, SBOM
          and scan jobs. Empty (default) builds the discovered/declared
          Dockerfiles natively with docker buildx.
        required: false
        type: string
        default: ''
      build_command_images:
        description: >-
          Space or comma separated image references that
          build_command produces, e.g. 'onap/cps:latest'. Declaring
          them replaces the inference the workflow otherwise performs
          to work out which images the command built, and is the only
          reliable account where that inference cannot reach: a
          builder stamping a reproducible creation timestamp (jib
          pins it to the Unix epoch) is indistinguishable from a
          pulled base on daemons using the containerd image store.
          Empty (the default) infers.
        required: false
        type: string
        default: ''
      build_timeout_minutes:
        description: 'Timeout for the build job in whole minutes'
        required: false
        type: number
        default: 30
      build_permit_fail:
        description: >-
          Permit image build failures without failing the workflow.
          Intended for repositories whose Dockerfiles predate the
          current state of their upstream bases and package feeds:
          the lane still lints every Dockerfile and reports which
          images build, without gating review on breakage that
          predates the change under test. Images that do build carry
          on to the test, SBOM and scan jobs. Unlike the lint and
          scan toggles this input has no repository variable fallback, so
          nothing can disable build gating across an organisation by
          accident.
        required: false
        type: boolean
        default: false

      # --- Tests ---
      test_command:
        description: >-
          Shell command run from path_prefix after the built images
          load into the Docker daemon (a smoke/integration hook, e.g.
          'make test'). The IMAGES environment variable carries a JSON
          array of the built image tags. Empty runs no command: the
          tests job passes with a notice.
        required: false
        type: string
        default: ''
      test_permit_fail:
        description: 'Permit test failures without failing the workflow'
        required: false
        type: boolean
        default: false

      # --- Dockerfile lint (hadolint) ---
      lint_enabled:
        description: 'Run the Dockerfile lint job (set false to skip)'
        required: false
        type: boolean
        default: true
      lint_permit_fail:
        description: 'Permit hadolint findings (the NO_BLOCK pattern)'
        required: false
        type: boolean
        default: false
      audit_permit_fail:
        description: >-
          DEPRECATED alias for lint_permit_fail, retained so existing
          callers keep working. This job lints Dockerfiles; it does not
          audit dependencies. Elsewhere in the estate audit_* governs a
          dependency audit, so the name is being retired here. Prefer
          lint_permit_fail; this input is removed at the next major.
        required: false
        type: boolean
        default: false

      # --- SBOM ---
      sbom_enabled:
        description: >-
          Generate an image SBOM (set false to skip). The Grype scan
          reads the SBOM, so skipping generation leaves it nothing to
          scan. To keep the SBOM but drop the scan, use grype_enabled.
        required: false
        type: boolean
        default: true

      # --- Grype scan ---
      grype_enabled:
        description: >-
          Run the Grype vulnerability scan over the generated SBOMs (set
          false to skip). Decoupling is one-way: disabling the scan
          keeps the SBOMs, but disabling the SBOM job also stops the
          scan, which has nothing to read.
        required: false
        type: boolean
        default: true
      grype_fail_on:
        description: 'Minimum severity that fails the Grype scan'
        required: false
        type: string
        default: 'medium'
      grype_permit_fail:
        description: >-
          Permit Grype findings without failing the job. When false, falls
          back to the NO_BLOCK_AUDIT_FAIL repository variable at runtime.
        required: false
        type: boolean
        default: false
      grype_cache_db:
        description: >-
          How the Grype scan uses the Actions cache for the
          vulnerability database: 'true' restores and saves,
          'restore-only' restores but never saves, 'false' disables
          caching. Cache entries rotate on the database build time, so
          exactly one job may write a given prefix; where a caller
          invokes this workflow several times in parallel, give one
          call 'true' and the rest 'restore-only'. With several
          writers, creation order and build order can disagree, and a
          restore then returns an older database than the newest
          saved.
        required: false
        type: string
        default: 'true'
      grype_gate_when:
        description: >-
          When Grype findings block the job: 'always', or
          'dependencies-changed' to report them as warnings unless the
          change under review touched a Dockerfile or a dependency
          file of the ecosystems grype_dependency_ecosystems names. A
          change the workflow cannot compare against its base keeps
          the gate on.
        required: false
        type: string
        default: 'always'
      grype_dependency_ecosystems:
        description: >-
          Comma-separated dependency-change-action presets that make
          up the images' dependency set under grype_gate_when
          'dependencies-changed': the ecosystems of the application
          the images build, e.g. 'docker,python'. The 'docker' preset
          for the image recipes is always included, and Dockerfiles
          the images input names reach the detection whatever this
          says.
        required: false
        type: string
        default: 'docker'
      grype_dependency_patterns:
        description: >-
          Extra dependency-change patterns, one per line, added to the
          presets under grype_gate_when 'dependencies-changed', for a
          file no preset covers. A pattern follows
          dependency-change-action's grammar and matches inside the
          detection scope: path_prefix, or the repository root where
          the lane widens it. A pattern the detector rejects fails the
          repository-metadata job.
        required: false
        type: string
        default: ''
      grype_dependency_policy:
        description: >-
          Which Grype findings gate: 'all', or 'declared' to gate only
          on packages the project declares and report inherited ones
          as warnings. An image SBOM declares no dependency graph, so
          'all' is the sensible choice here; see the README.
        required: false
        type: string
        default: 'declared'
      grype_transitive_fail_on:
        description: >-
          Minimum severity at which an inherited package still gates
          under grype_dependency_policy 'declared': 'none',
          'negligible', 'low', 'medium', 'high' or 'critical'
        required: false
        type: string
        default: 'critical'
      grype_only_fixed:
        description: >-
          Gate only on findings with a published fix; one nobody can
          act on yet is reported as a warning instead
        required: false
        type: boolean
        default: true
      grype_remediation_window_days:
        description: >-
          Under grype_gate_when 'dependencies-changed', on a change
          that left the dependency chain alone, a finding stays a
          warning for this many days after its fix became available
          and then gates. A whole number of days; empty (the default)
          turns the window off. 'always' runs ignore it.
        required: false
        type: string
        default: ''
      grype_remediation_window_start:
        description: >-
          Optional YYYY-MM-DD floor for the remediation window clock,
          which starts at the later of the fix date and this date.
          Empty (the default) starts it at the fix date.
        required: false
        type: string
        default: ''
      grype_bypass_repository:
        description: >-
          Repository, as owner/name, whose labelled BYPASS: issues the
          Grype scan accepts. Empty (the default) reads the calling
          repository; set it to share one bypass list. The scan reads
          it with the workflow's GITHUB_TOKEN, and a list it cannot
          read leaves no bypass, so the gate stays closed.
        required: false
        type: string
        default: ''

      # --- Release-file verification (off unless the registries are set) ---
      snapshot_registry:
        description: >-
          Registry that receives snapshot/staging publishes, as
          host[:port] with an optional repository path. Nexus 3
          distinguishes repositories by port
          (nexus3.onap.org:10003); JFrog Artifactory's
          repository-path method puts them in the path
          (acme.jfrog.io/docker-snapshot), and its subdomain method
          in the host (docker-snapshot.acme.jfrog.io). Also the
          default registry release promotion pulls staged images
          from (a container_pull_registry field in the release file
          wins). Pass the value merge.yaml receives; with
          release_registry, it turns on the release-file checks.
          Empty (the default) leaves them off.
        required: false
        type: string
        default: ''
      release_registry:
        description: >-
          Registry that receives release promotions, as host[:port]
          with an optional repository path, e.g.
          nexus3.onap.org:10002 or acme.jfrog.io/docker-release. A
          container_push_registry field in the release file wins.
          Pass the value merge.yaml receives; empty (the default)
          leaves the release-file checks off.
        required: false
        type: string
        default: ''
      registry_user:
        description: >-
          Registry username override; empty derives the username from
          the repository name (the 1Password credential naming
          contract)
        required: false
        type: string
        default: ''

      # --- Runner hardening ---
      harden_runner_egress:
        description: "Harden-runner egress policy: 'block' or 'audit'"
        required: false
        type: string
        default: 'block'
      harden_runner_allowlist:
        description: 'Out-of-band harden-runner allow-list configuration'
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
      harden_runner_supplemental_allowlist:
        description: >-
          Extra harden-runner allow-list merged with
          harden_runner_allowlist, in the same coordinate grammar.
          Empty adds nothing
        required: false
        type: string
        default: ''
      harden_runner_supplemental_unpinned:
        description: >-
          Let harden_runner_supplemental_allowlist omit '@ref' and
          follow its default branch; only a list in the caller's own
          organisation qualifies
        required: false
        type: boolean
        default: false
      harden_runner_extra_endpoints:
        description: >-
          Extra egress endpoints written inline, host[:port] tokens
          separated by spaces or newlines, merged into the allow-list
          for short-lived fixes. Empty adds nothing
        required: false
        type: string
        default: ''
      build_permit_egress_traffic:
        description: >-
          Run harden-runner in audit mode for the build job only,
          permitting unrestricted egress. Use when base images or
          build-time dependencies come from registries/CDNs that are
          impractical to enumerate in the allow-list. Other jobs stay
          governed by harden_runner_egress; left unset, the build job
          follows it too.
        required: false
        type: boolean
        default: false

      # --- Gerrit-aware checkout (empty unless dispatched via Gerrit) ---
      gerrit_refspec:
        description: 'Gerrit refspec of the change under test'
        required: false
        type: string
        default: ''
      gerrit_project:
        description: 'Gerrit project name'
        required: false
        type: string
        default: ''
      gerrit_branch:
        description: 'Gerrit target branch'
        required: false
        type: string
        default: ''
      gerrit_url:
        description: >-
          Gerrit server URL. Empty falls back to the GERRIT_URL repository
          variable at runtime.
        required: false
        type: string
        default: ''

    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        description: >-
          1Password service-account token used by credential-load-action
          to fetch the per-repository registry credential from the common
          per-org CI/CD vault (op://<vault>/<repository-name>/password).
          The release-verify job skips its registry checks with a
          warning when unset, leaving the offline release-file check,
          so PR/self-test contexts still work.
        required: false
      VAULT_MAPPING_JSON:
        description: >-
          Base64-encoded JSON mapping of organisation name to 1Password
          vault ID, keyed on github.repository_owner; consumed by
          credential-load-action to resolve the correct vault. The
          release-verify job skips its registry checks with a warning
          when unset, leaving the offline release-file check, so
          PR/self-test contexts still work.
        required: false

    outputs:
      has_release:
        description: >-
          Detection result: 'true' when the change adds or edits a
          container release file, 'false' when it carries none, empty
          when the release-file checks are off. 'true' can stay set
          when that file then fails the offline or schema check, so
          also require the workflow run to succeed before treating
          the file as valid
        value: ${{ jobs.check-release.outputs.has_release }}
      grype_gate_active:
        description: >-
          'true' when a Grype finding could have blocked this run,
          'false' when the dependencies-changed gate withheld it;
          empty when the scan did not run
        value: ${{ jobs.grype.outputs.gate_active }}
      grype_gate_reason:
        description: >-
          Why the Grype gate was or was not armed; empty when the scan
          did not run
        value: ${{ jobs.grype.outputs.gate_reason }}

permissions: {}

jobs:
  gerrit-validate:
    name: 'Validate Gerrit Inputs'
    # Fails fast with a clear message when gerrit_refspec is set without
    # the project/branch the Gerrit checkout path also requires. The
    # build-chain root job depends on this, so invalid Gerrit inputs stop
    # the pipeline early and cleanly. This job always runs (only the
    # validation step is conditional), so gating dependents on it does
    # not trip GitHub's "skipped need skips dependents" behaviour.
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    outputs:
      # The effective image namespace; empty for namespace_mode none
      namespace: ${{ steps.namespace.outputs.namespace }}
    steps:
      - name: 'Require Gerrit project, branch and URL'
        if: inputs.gerrit_refspec != ''
        shell: bash
        env:
          GERRIT_PROJECT: ${{ inputs.gerrit_project }}
          GERRIT_BRANCH: ${{ inputs.gerrit_branch }}
          # yamllint disable-line rule:line-length
          GERRIT_URL: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
        run: |
          # gerrit_refspec is set, so the Gerrit checkout path runs and
          # also requires gerrit_project, gerrit_branch and a resolvable
          # Gerrit URL (the gerrit_url input or the GERRIT_URL variable).
          missing=''
          if [ -z "${GERRIT_PROJECT}" ]; then
            missing="${missing} gerrit_project"
          fi
          if [ -z "${GERRIT_BRANCH}" ]; then
            missing="${missing} gerrit_branch"
          fi
          if [ -z "${GERRIT_URL}" ]; then
            missing="${missing} gerrit_url/GERRIT_URL"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::gerrit_refspec is set but missing:${missing}"
            exit 1
          fi
          echo "Gerrit inputs validated ✅"

      # The ecosystems reach the detection in repository-metadata only
      # after this job, so a typo fails here in seconds instead. The
      # input belongs to repository-metadata-action, not
      # grype-scan-action, so it keeps a shell check; the release lane
      # always gates, so it has no such input and this step stays
      # this lane's own.
      - name: 'Validate Grype dependency ecosystems'
        id: validate-grype-ecosystems
        shell: bash
        env:
          GRYPE_DEPENDENCY_ECOSYSTEMS: ${{ inputs.grype_dependency_ecosystems }}
        run: |
          # A comma-separated list of the action's seven preset names
          errors=0
          # reject NAME VALUE: records an invalid input
          reject() {
            # A newline in the value could forge a workflow command
            echo "::error::Invalid $1 input:" \
              "$(printf '%s' "$2" | tr -d '\r\n')"
            errors=1
          }
          if [[ ! "${GRYPE_DEPENDENCY_ECOSYSTEMS}" =~ ^[a-z]+(,[a-z]+)*$ ]]
          then
            reject grype_dependency_ecosystems "${GRYPE_DEPENDENCY_ECOSYSTEMS}"
          else
            IFS=',' read -r -a ecosystems <<< "${GRYPE_DEPENDENCY_ECOSYSTEMS}"
            for ecosystem in "${ecosystems[@]}"; do
              case "${ecosystem}" in
                node|python|go|maven|gradle|rust|docker) ;;
                *)
                  detail="(unknown preset ${ecosystem})"
                  reject grype_dependency_ecosystems \
                    "${GRYPE_DEPENDENCY_ECOSYSTEMS} ${detail}"
                  break
                  ;;
              esac
            done
          fi
          if [ "${errors}" -ne 0 ]; then
            exit 1
          fi
          echo "Grype dependency ecosystems:" \
            "${GRYPE_DEPENDENCY_ECOSYSTEMS} ✅"

      # The Grype inputs reach grype-scan-action only after the build
      # and SBOM jobs have run, so a bad value fails here first. The
      # action checks them itself in validate-only mode, with the same
      # with: block the scan gets, less the SBOM: it installs no Grype,
      # fetches no database, scans nothing and makes no network
      # request. Each input the scan passes as one grype_* input
      # appears here with the same expression, at the same pin, and
      # tests/test_dependency_change.sh checks the two stay in step.
      - name: 'Validate Grype inputs'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@f65dca2762823cfc8f376e32fee9baa6f3292696  # v0.6.2
        with:
          validate-only: 'true'
          fail-on: ${{ inputs.grype_fail_on }}
          only-fixed: ${{ inputs.grype_only_fixed }}
          dependency-policy: ${{ inputs.grype_dependency_policy }}
          transitive-fail-on: ${{ inputs.grype_transitive_fail_on }}
          gate-when: ${{ inputs.grype_gate_when }}
          # yamllint disable-line rule:line-length
          remediation-window-days: ${{ inputs.grype_remediation_window_days }}
          # yamllint disable-line rule:line-length
          remediation-window-start: ${{ inputs.grype_remediation_window_start }}
          cache-db: ${{ inputs.grype_cache_db }}
          bypass-repository: ${{ inputs.grype_bypass_repository }}

      # build_command builds whatever the project's tooling builds, so
      # select cannot narrow it; refuse the pair rather than ignore
      # select. tests/test_image_select.sh runs this script.
      - name: 'Reject select with build_command'
        id: select
        shell: bash
        env:
          SELECT: ${{ inputs.select }}
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: |
          # select only narrows discovered or declared Dockerfile builds
          if [ -n "${SELECT}" ] && [ -n "${BUILD_COMMAND}" ]; then
            echo "::error::select cannot combine with build_command:" \
              "the command builds whatever the project's tooling builds." \
              "Clear select, or drop build_command and build from" \
              "discovered Dockerfiles or the images input"
            exit 1
          fi
          echo "Image selection inputs validated ✅"

      # Resolved once here, the root every job descends from; each
      # job that names an image reads this job's namespace output
      - name: 'Resolve image namespace'
        id: namespace
        shell: bash
        env:
          NAMESPACE_MODE: ${{ inputs.namespace_mode }}
          NAMESPACE: ${{ inputs.namespace }}
          REPOSITORY: ${{ inputs.repository || github.repository }}
        run: |
          # none: no prefix; auto: the lowercased repository owner;
          # manual: the namespace input
          case "${NAMESPACE_MODE}" in
            none) namespace='' ;;
            auto) namespace="${REPOSITORY%%/*}"; namespace="${namespace,,}" ;;
            manual) namespace="${NAMESPACE}" ;;
            *)
              echo "::error::Invalid namespace_mode '${NAMESPACE_MODE}'" \
                "(expected none, auto or manual)"
              exit 1
              ;;
          esac
          if [ "${NAMESPACE_MODE}" != 'manual' ] && [ -n "${NAMESPACE}" ]
          then
            echo "::error::namespace '${NAMESPACE}' is set but" \
              "namespace_mode is '${NAMESPACE_MODE}'; set namespace_mode" \
              "to 'manual' or clear namespace"
            exit 1
          fi
          if [ "${NAMESPACE_MODE}" = 'manual' ] && [ -z "${NAMESPACE}" ]; then
            echo "::error::namespace_mode 'manual' requires the namespace input"
            exit 1
          fi
          # Docker's repository path grammar: '/'-separated components,
          # each runs of lowercase alphanumerics joined by a single '.'
          # or '_', exactly '__', or one or more '-'
          component='[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*'
          if [ -n "${namespace}" ] &&
            [[ ! "${namespace}" =~ ^${component}(/${component})*$ ]]; then
            echo "::error::Invalid namespace '${namespace}'" \
              "(namespace_mode ${NAMESPACE_MODE}): expected '/'-separated" \
              "components of lowercase alphanumerics joined by a single" \
              "'.' or '_', exactly '__', or one or more '-'"
            exit 1
          fi
          echo "namespace=${namespace}" >> "${GITHUB_OUTPUT}"
          echo "Image namespace (${NAMESPACE_MODE}): ${namespace:-<none>} ✅"

  repository-metadata:
    name: 'Repository Metadata'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    timeout-minutes: 5
    outputs:
      # The Grype job forwards this only when this job succeeded
      # yamllint disable-line rule:line-length
      dependencies_changed: ${{ steps.repo-metadata.outputs.dependencies_changed }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@8721c15dacdd703064df5ade1416f7e5590b65f3  # v1.4.1
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          gerrit-branch: ${{ inputs.gerrit_branch }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          fetch-depth: ${{ inputs.gerrit_refspec != '' && '2' || '0' }}
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
          submodules: ${{ inputs.checkout_submodules }}

      # The docker preset matches the conventional Dockerfile names at
      # any depth inside the detection scope, which covers discovered
      # images, and it joins the presets the caller names whatever
      # they say: the image recipe is always part of the dependency
      # set. An image whose 'dockerfile' has another name reaches the
      # detection as an extra pattern, so a change to it counts too;
      # an image without one builds the Dockerfile in its 'context',
      # which the preset matches. A local named build context in the
      # image's build_flags ('--build-context deps=../shared') is a
      # directory the recipe copies from, so it counts as a context
      # too, and so does an 'oci-layout://' source, a local directory
      # holding an image layout; a remote one (an image, a URL,
      # another stage) holds nothing the checkout carries. The images
      # input gives every path relative to path_prefix; a context or
      # recipe outside it (a sibling directory, say) lies outside the
      # scope the presets search, so the scope widens to the
      # repository root and every pattern becomes repository-relative.
      # Over-matching costs one strict run. A path no pattern can name
      # at all, outside the repository or with a character the dialect
      # refuses, a name with a control character, which the action's
      # line-per-pattern input cannot carry, and a name the action's
      # reading of that input would alter (whitespace at either end,
      # or a Unicode line separator) skip the detection: no verdict,
      # so the gate stays on. So does a build_command: the command
      # builds whatever it likes from wherever it likes, so the
      # discovered images do not describe the dependency set, and a
      # caller with one stays on the full gate. The step reads
      # workflow inputs alone, never the checkout or another job;
      # docker-metadata's discovery validates the images input, and a
      # malformed one fails that job, so no image builds and no scan
      # runs.
      - name: 'Resolve dependency change scope'
        id: dependency-scope
        # yamllint disable-line rule:line-length
        if: inputs.grype_enabled && inputs.grype_gate_when == 'dependencies-changed'
        shell: bash
        env:
          IMAGES: ${{ inputs.images }}
          PATH_PREFIX: ${{ inputs.path_prefix }}
          BUILD_COMMAND: ${{ inputs.build_command }}
          GRYPE_DEPENDENCY_ECOSYSTEMS: ${{ inputs.grype_dependency_ecosystems }}
        run: |
          # Outputs: ecosystems (docker plus the caller's presets),
          # path_prefix (the detection scope), patterns (one per named
          # Dockerfile, relative to that scope, one per line) and skip
          # ('true' when a path has no pattern or a build_command
          # replaces the discovered builds, so detection must not run)

          # normalise PATH: resolves '.' and '..' segments lexically
          # and drops empty ones; a '..' that climbs past the start
          # stays in front, so a result beginning '..' left its root
          normalise() {
            local -a segments=() out=()
            local segment
            IFS='/' read -r -a segments <<< "$1"
            for segment in "${segments[@]}"; do
              case "${segment}" in
                ''|.) ;;
                ..)
                  if [ "${#out[@]}" -gt 0 ] && [ "${out[-1]}" != '..' ]; then
                    unset 'out[-1]'
                  else
                    out+=('..')
                  fi
                  ;;
                *) out+=("${segment}") ;;
              esac
            done
            local IFS='/'
            echo "${out[*]}"
          }
          # outside PATH: true when a normalised repository-relative
          # path climbs past the repository root
          outside() {
            case "$1" in
              ..|../*) return 0 ;;
            esac
            return 1
          }
          # dialect_ok PATTERN: the action takes a relative path of
          # plain segments: no leading '/', no '.' or '..' segment,
          # and none of '**', '?', '[', ']' or '\'
          dialect_ok() {
            case "$1" in
              ''|/*|*//*|*'**'*|*'?'*|*'['*|*']'*|*\\*) return 1 ;;
            esac
            case "/$1/" in
              *'/./'*|*'/../'*) return 1 ;;
            esac
          }
          # intact PATTERN: the action reads its patterns input as
          # Python does, splitting it into lines and stripping each,
          # so a pattern must come through that unchanged: no line
          # separator anywhere (U+0085, U+2028, U+2029; the ASCII
          # ones are control characters, refused before this) and no
          # whitespace at either end (U+0020, U+00A0, U+1680, U+2000
          # to U+200A, U+202F, U+205F, U+3000). Otherwise the action
          # watches another path and a change to this one reports
          # 'changed: false'. tests/test_dependency_change.sh checks
          # the two lists against Python.
          intact() {
            jq -e -n --arg p "$1" '
              def edge: . == 32 or . == 160 or . == 5760
                or (. >= 8192 and . <= 8202) or . == 8239 or . == 8287
                or . == 12288;
              ($p | explode) as $c
              | ($c | any(. == 133 or . == 8232 or . == 8233) | not)
                and ($c | first | edge | not)
                and ($c | last | edge | not)' > /dev/null
          }
          # Always docker, then the caller's presets, each once
          ecosystems='docker'
          IFS=',' read -r -a named <<< "${GRYPE_DEPENDENCY_ECOSYSTEMS}"
          for name in "${named[@]}"; do
            case ",${ecosystems}," in
              *",${name},"*|,,) ;;
              *) ecosystems+=",${name}" ;;
            esac
          done
          prefix=$(normalise "${PATH_PREFIX}")
          widen=false
          skipped=''
          scoped=''
          rooted=''
          custom_build=false
          if [ -n "${BUILD_COMMAND}" ]; then
            # The command replaces the discovered builds: it may build
            # any recipe from any directory, so the images input, the
            # presets and path_prefix describe nothing of what it
            # builds, and no scope can be proved
            custom_build=true
            echo "::notice::build_command replaces the discovered image" \
              "builds, so the dependency change detection cannot tell" \
              "which recipes and contexts the build reads; detection" \
              "is skipped and the Grype gate stays on"
          elif [ -n "${IMAGES}" ]; then
            # One compact JSON object per line keeps a name with a
            # newline in one piece, where a raw string would split
            # into two lines that match nothing
            while IFS= read -r image; do
              # The values of every '--build-context' in the image's
              # build_flags, as buildx reads them: the flag's own
              # value after '=', or the next element; one without a
              # next element reads as empty
              sources=$(jq -c '(.build_flags // []) as $flags
                | if ($flags | type) != "array" then [] else
                  [range($flags | length) as $i | $flags[$i] | strings
                    | if . == "--build-context" then
                        ($flags[$i + 1]
                          | if type == "string" then . else "" end)
                      elif startswith("--build-context=") then .[16:]
                      else empty end]
                  end' <<< "${image}")
              # The action takes one pattern per line, so a name with
              # a control character has no pattern; the check runs on
              # the JSON strings, before anything splits them
              strings=$(jq -c --argjson sources "${sources}" '
                ([.context, .dockerfile] | map(select(. != null)
                  | tostring)) + $sources' <<< "${image}")
              if jq -e 'any(.[]; explode | any(. < 32 or . == 127))' \
                <<< "${strings}" > /dev/null; then
                label=$(jq -r 'map(select(explode
                  | any(. < 32 or . == 127))) | first' <<< "${strings}" \
                  | tr -d '\000-\037\177')
                echo "::notice::images names the path ${label} with a" \
                  "control character, which the dependency change" \
                  "detection cannot express as a pattern; detection is" \
                  "skipped and the Grype gate stays on"
                skipped+="${label}"$'\n'
                continue
              fi
              # The context holds the application's manifests and,
              # without a 'dockerfile', its recipe: the detection must
              # look there, so a context outside path_prefix widens
              # the scope and one outside the repository skips it
              context=$(jq -r '.context' <<< "${image}")
              ctx_relative=$(normalise "${context}")
              if [[ "${context}" == /* ]] ||
                outside "$(normalise "${prefix}/${context}")"; then
                echo "::notice::images names the context ${context}," \
                  "which lies outside the repository, where the" \
                  "dependency change detection cannot look; detection" \
                  "is skipped and the Grype gate stays on"
                skipped+="${context}"$'\n'
                continue
              fi
              if outside "${ctx_relative}"; then
                widen=true
              fi
              # A named build context is a directory the recipe copies
              # from ('COPY --from=deps'), so a local one is scoped as
              # the context is: it resolves against path_prefix too,
              # since the build runs there. An 'oci-layout://' source
              # is local as well: buildx reads
              # 'oci-layout://PATH[:TAG][@DIGEST]' as a directory
              # holding an image layout, the path ending at the first
              # '@' and then at the first ':', so a change inside it
              # changes the image. A remote source (an image, a URL, a
              # git reference, another stage) holds nothing the
              # checkout carries. A value buildx refuses (no
              # 'name=source' pair, or a layout without a path) has no
              # scope to prove, so it skips the detection; buildx
              # fails the build on it anyway.
              unscoped=''
              while IFS= read -r source; do
                name="${source%%=*}"
                path="${source#*=}"
                if [[ "${source}" != *=* ]] || [ -z "${name}" ] ||
                  [ -z "${path}" ]; then
                  unscoped="--build-context ${source}"
                  echo "::notice::images passes '${unscoped}', which" \
                    "names no name=source pair, so the dependency" \
                    "change detection cannot tell where the build" \
                    "context lies; detection is skipped and the Grype" \
                    "gate stays on"
                  break
                fi
                given="${path}"
                case "${path}" in
                  oci-layout://*)
                    path="${path#oci-layout://}"
                    path="${path%%@*}"
                    path="${path%%:*}"
                    if [ -z "${path}" ]; then
                      unscoped="--build-context ${source}"
                      echo "::notice::images passes '${unscoped}'," \
                        "which names no layout directory, so the" \
                        "dependency change detection cannot tell where" \
                        "the build context lies; detection is skipped" \
                        "and the Grype gate stays on"
                      break
                    fi
                    ;;
                  *://*|target:*|git@*|github.com/*) continue ;;
                esac
                if [[ "${path}" == /* ]] ||
                  outside "$(normalise "${prefix}/${path}")"; then
                  unscoped="${given}"
                  echo "::notice::images names the build context" \
                    "${name}=${given}, which lies outside the" \
                    "repository, where the dependency change detection" \
                    "cannot look; detection is skipped and the Grype" \
                    "gate stays on"
                  break
                fi
                if outside "$(normalise "${path}")"; then
                  widen=true
                fi
              done < <(jq -r '.[]' <<< "${sources}")
              if [ -n "${unscoped}" ]; then
                skipped+="${unscoped}"$'\n'
                continue
              fi
              dockerfile=$(jq -r 'if .dockerfile == null then ""
                else .dockerfile | tostring end' <<< "${image}")
              if [ -z "${dockerfile}" ]; then
                continue
              fi
              relative=$(normalise "${dockerfile}")
              rel_root=$(normalise "${prefix}/${dockerfile}")
              # Both forms must hold: the scope is decided only once
              # every image has been read
              if [[ "${dockerfile}" == /* ]] || [ -z "${relative}" ] ||
                ! dialect_ok "${rel_root}" || ! intact "${relative}" ||
                ! intact "${rel_root}"; then
                echo "::notice::images names the dockerfile ${dockerfile}," \
                  "which the dependency change detection cannot express" \
                  "as a pattern; detection is skipped and the Grype" \
                  "gate stays on"
                skipped+="${dockerfile}"$'\n'
                continue
              fi
              if outside "${relative}"; then
                widen=true
              fi
              scoped+="${relative}"$'\n'
              rooted+="${rel_root}"$'\n'
            done < <(jq -c '.[]' <<< "${IMAGES}")
          fi
          skip=false
          scope="${PATH_PREFIX}"
          patterns="${scoped}"
          if [ "${custom_build}" = true ]; then
            skip=true
            patterns=''
            {
              echo "### Dependency change detection skipped"
              echo ""
              echo "The \`build_command\` input replaces the discovered" \
                "image builds, so the dependency change detection" \
                "cannot tell which recipes and contexts the build" \
                "reads; detection did not run and the Grype gate stays" \
                "on. Build the images with the \`images\` input, or the" \
                "discovered Dockerfiles, to gate on dependency changes."
            } >> "${GITHUB_STEP_SUMMARY}"
          elif [ -n "${skipped}" ]; then
            skip=true
            patterns=''
            {
              echo "### Dependency change detection skipped"
              echo ""
              echo "The \`images\` input names a path the dependency" \
                "change detection cannot reach or express as a" \
                "pattern, so detection did not run and the Grype gate" \
                "stays on:"
              echo ""
              printf '%s' "${skipped}" | while IFS= read -r file; do
                echo "- \`${file}\`"
              done
            } >> "${GITHUB_STEP_SUMMARY}"
          elif [ "${widen}" = true ]; then
            scope='.'
            patterns="${rooted}"
          fi
          # The heredoc ends at the first line equal to its delimiter,
          # and a recipe named DOCKERFILE_PATTERNS is a valid pattern,
          # so the delimiter grows until no pattern equals it
          delimiter='DOCKERFILE_PATTERNS'
          while grep -qxF -- "${delimiter}" <<< "${patterns}"; do
            delimiter+='_'
          done
          {
            echo "ecosystems=${ecosystems}"
            echo "path_prefix=${scope}"
            echo "skip=${skip}"
            echo "patterns<<${delimiter}"
            printf '%s' "${patterns}"
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"
          echo "Dependency change presets: ${ecosystems}"
          if [ "${custom_build}" = true ]; then
            echo "Detection skipped: build_command replaces the builds"
          elif [ "${skip}" = true ]; then
            echo "Detection skipped: a named path has no pattern"
          elif [ -n "${patterns}" ]; then
            echo "Dockerfile patterns, relative to ${scope}:"
            printf '%s' "${patterns}" | sed 's/^/  /'
          else
            echo "No named Dockerfiles; the docker preset covers discovery"
          fi

      # Runs dependency-change-action against this job's checkout
      # (full history, or the Gerrit change at depth 2) for the Grype
      # job's dependencies-changed gate, scoped by the step above. The
      # verdict leaves as the dependencies_changed job output: 'true'
      # or 'false' once resolved, empty otherwise, and empty gates. A
      # recipe the step above found no pattern for turns detection
      # off, which leaves the verdict empty too.
      - name: 'Gather repository metadata'
        id: repo-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/repository-metadata-action@f0e5d2d8dc1154a5d702b75acc551eff6ba072dc  # v0.5.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: 'true'
          gerrit_summary: ${{ inputs.gerrit_refspec != '' }}
          artifact_upload: 'true'
          artifact_formats: 'json'
          # yamllint disable-line rule:line-length
          dependency_change: ${{ inputs.grype_enabled && inputs.grype_gate_when == 'dependencies-changed' && steps.dependency-scope.outputs.skip != 'true' }}
          gerrit_refspec: ${{ inputs.gerrit_refspec }}
          # yamllint disable-line rule:line-length
          dependency_ecosystems: ${{ steps.dependency-scope.outputs.ecosystems }}
          # The resolver's patterns, then the caller's; the detector
          # skips the blank line either leaves
          dependency_patterns: |-
            ${{ steps.dependency-scope.outputs.patterns }}
            ${{ inputs.grype_dependency_patterns }}
          # yamllint disable-line rule:line-length
          dependency_path_prefix: ${{ steps.dependency-scope.outputs.path_prefix }}

  docker-metadata:
    name: 'Docker Metadata'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    outputs:
      images_json: ${{ steps.discover.outputs.images_json }}
      image_count: ${{ steps.discover.outputs.image_count }}
      build_id: ${{ steps.discover.outputs.build_id }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@8721c15dacdd703064df5ade1416f7e5590b65f3  # v1.4.1
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          gerrit-branch: ${{ inputs.gerrit_branch }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
          submodules: ${{ inputs.checkout_submodules }}

      # An explicit 'images' input wins; otherwise the action walks
      # the estate-observed Dockerfile locations, keeping discovery
      # order as build order. It also draws the per-invocation
      # build_id that names this run's artifacts.
      - name: 'Discover images'
        id: discover
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/docker-build-matrix-action@a0ea3e47113ea81ebb13c1d0326899f157c0744d  # v0.1.1
        with:
          path_prefix: ${{ inputs.path_prefix }}
          images: ${{ inputs.images }}
          # A subset of the images, plus their same-repository bases
          # unless select_dependencies is false. No allow_empty: a
          # selection matching nothing must fail, since the downstream
          # jobs cannot handle an empty image set.
          select: ${{ inputs.select }}
          select_dependencies: ${{ inputs.select_dependencies }}
          repository: ${{ inputs.repository || github.repository }}
          # Bind ref to this job's effective checkout ref, so the
          # build id discriminates on the tree actually discovered.
          # This lane checks out inputs.ref directly.
          ref: ${{ inputs.ref }}
          gerrit_refspec: ${{ inputs.gerrit_refspec }}
          image_namespace: ${{ needs.gerrit-validate.outputs.namespace }}
          # With build_command set, an empty discovery is not an
          # error: the build job enumerates what the command created
          build_command: ${{ inputs.build_command }}
          build_command_images: ${{ inputs.build_command_images }}

  build:
    name: 'Docker Build'
    needs: ['gerrit-validate', 'docker-metadata']
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.build.outputs.images }}
      image_count: ${{ steps.build.outputs.image_count }}
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    steps:
      # The build job can opt into audit egress independently of the
      # other jobs via build_permit_egress_traffic, for base images and
      # build-time dependencies from registries/CDNs impractical to
      # enumerate in the allow-list. Left unset it follows
      # harden_runner_egress like every other job.
      #
      # One harden-runner step with the policy computed, rather than
      # two selected by condition: harden-runner declares a 'pre'
      # entry point and no 'pre-if', so its pre-phase runs whatever a
      # step-level 'if:' says. Both would engage the agent, the first
      # would win, and audit mode would be unreachable.
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ (inputs.build_permit_egress_traffic || inputs.harden_runner_egress == 'audit') && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@8721c15dacdd703064df5ade1416f7e5590b65f3  # v1.4.1
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          gerrit-branch: ${{ inputs.gerrit_branch }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
          submodules: ${{ inputs.checkout_submodules }}

      # build_artifacts places this run's earlier build output (a
      # Java lane's jars, say) in the checkout, so Dockerfile COPY
      # and build_command both see it. Validation fails before
      # anything downloads; the downloads take this run's artefacts
      # only, staged outside the checkout; and placement refuses any
      # file the checkout already holds, so an artefact adds to the
      # source tree but never replaces a Dockerfile or script. Unset
      # or '[]', none of these steps runs.
      - name: 'Validate build_artifacts'
        id: build-artifacts
        # yamllint disable-line rule:line-length
        if: inputs.build_artifacts != '' && inputs.build_artifacts != '[]'
        shell: bash
        env:
          BUILD_ARTIFACTS: ${{ inputs.build_artifacts }}
          PATH_PREFIX: ${{ inputs.path_prefix }}
        run: |
          # Check every entry before anything downloads, then hand the
          # download steps their names and the place step a normalised
          # plan. Paths resolve against the checkout, so a symlink cannot
          # carry one outside path_prefix.
          plan="${RUNNER_TEMP}/build-artifacts.json"
          if [[ -z "${BUILD_ARTIFACTS//[[:space:]]/}" ]]; then
            printf 'first=\npattern=\n' >> "${GITHUB_OUTPUT}"
            echo "build_artifacts is empty; nothing to download"
            exit 0
          fi
          if ! jq -se 'length == 1 and (.[0] | type == "array")' \
            > /dev/null 2>&1 <<< "${BUILD_ARTIFACTS}"; then
            echo "::error::build_artifacts must be a JSON array of" \
              "{\"name\": ..., \"path\": ...} objects"
            exit 1
          fi
          root=$(realpath -m -- "${PATH_PREFIX}")
          count=$(jq 'length' <<< "${BUILD_ARTIFACTS}")
          if [ "${count}" -eq 0 ]; then
            printf 'first=\npattern=\n' >> "${GITHUB_OUTPUT}"
            echo "build_artifacts is empty; nothing to download"
            exit 0
          fi
          errors=0
          for ((i = 0; i < count; i++)); do
            entry=$(jq -c --argjson i "${i}" '.[$i]' <<< "${BUILD_ARTIFACTS}")
            label="build_artifacts[${i}] ${entry}"
            if [ "$(jq -r 'type' <<< "${entry}")" != 'object' ]; then
              echo "::error::${label}: each entry must be an object"
              errors=$((errors + 1))
              continue
            fi
            name=$(jq -r '.name | if type == "string" then . else "" end' \
              <<< "${entry}")
            if [ -z "${name}" ]; then
              echo "::error::${label}: 'name' must be a non-empty string"
              errors=$((errors + 1))
              continue
            fi
            # Tested in jq, before the shell strips a trailing newline
            if ! jq -e '.name | test("\\A[A-Za-z0-9._-]+\\z")' \
              > /dev/null <<< "${entry}" ||
              [ "${name}" = '.' ] || [ "${name}" = '..' ]; then
              echo "::error::${label}: 'name' may only contain A-Z, a-z, 0-9," \
                "'.', '_' and '-'"
              errors=$((errors + 1))
              continue
            fi
            case "$(jq -r '.path | type' <<< "${entry}")" in
              null) path='.' ;;
              string)
                if jq -e '.path | explode | any(. < 32 or . == 127)' \
                  > /dev/null <<< "${entry}"; then
                  echo "::error::${label}: 'path' must not contain control" \
                    "characters"
                  errors=$((errors + 1))
                  continue
                fi
                path=$(jq -r '.path' <<< "${entry}")
                ;;
              *)
                echo "::error::${label}: 'path' must be a string"
                errors=$((errors + 1))
                continue
                ;;
            esac
            path="${path:-.}"
            if [[ "${path}" == /* ]]; then
              echo "::error::${label}: 'path' must be relative to" \
                "path_prefix, not absolute"
              errors=$((errors + 1))
              continue
            fi
            if [[ "/${path}/" == */../* ]]; then
              echo "::error::${label}: 'path' must not contain a '..' segment"
              errors=$((errors + 1))
              continue
            fi
            resolved=$(realpath -m -- "${root}/${path}")
            if [ "${resolved}" != "${root}" ] &&
              [[ "${resolved}" != "${root}/"* ]]; then
              echo "::error::${label}: 'path' resolves to ${resolved}," \
                "outside path_prefix (${root})"
              errors=$((errors + 1))
              continue
            fi
          done
          if [ "${errors}" -gt 0 ]; then
            exit 1
          fi
          jq -c '[.[] | {name,
            path: (if (.path // "") == "" then "." else .path end)}]' \
            <<< "${BUILD_ARTIFACTS}" > "${plan}"
          # The first name downloads by name, which proves it exists. Two
          # or more also download as a brace set, which download-artifact's
          # minimatch expands to the exact names
          first=$(jq -r '[.[].name] | unique | .[0]' "${plan}")
          pattern=$(jq -r '[.[].name] | unique
            | if length == 1 then "" else "{" + join(",") + "}" end' \
            "${plan}")
          printf 'first=%s\npattern=%s\n' "${first}" "${pattern}" \
            >> "${GITHUB_OUTPUT}"
          echo "build_artifacts: $(jq length "${plan}") entr(y/ies) valid ✅"
      # A missing artefact fails this download; the place step reports
      # it with the same-run rule, so the job does not stop here
      - name: 'Download build artifacts'
        id: download-build-artifacts
        if: steps.build-artifacts.outputs.first != ''
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ steps.build-artifacts.outputs.first }}
          path: ${{ runner.temp }}/build-artifacts/first
      - name: 'Download further build artifacts'
        id: download-build-artifacts-set
        if: steps.build-artifacts.outputs.pattern != ''
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: ${{ steps.build-artifacts.outputs.pattern }}
          path: ${{ runner.temp }}/build-artifacts/set
      - name: 'Place build artifacts'
        id: place-build-artifacts
        if: steps.build-artifacts.outputs.first != ''
        shell: bash
        env:
          FIRST_OUTCOME: ${{ steps.download-build-artifacts.outcome }}
          PATH_PREFIX: ${{ inputs.path_prefix }}
        run: |
          # Check every artefact arrived and that no file it carries already
          # exists in the checkout, then copy. Nothing is copied unless every
          # check passes, so a failure leaves the checkout as it was.
          staging="${RUNNER_TEMP}/build-artifacts"
          plan="${RUNNER_TEMP}/build-artifacts.json"
          root=$(realpath -m -- "${PATH_PREFIX}")
          same_run="Artefacts must be uploaded earlier in the same workflow"
          same_run+=" run, and the job calling this workflow must 'needs:'"
          same_run+=" the job that uploads them."
          mapfile -t names < <(jq -r '[.[].name] | unique[]' "${plan}")
          declare -A found=()
          errors=0
          # The first name downloaded by name, so its outcome says whether
          # it exists. download-artifact unpacks a pattern's lone match
          # straight into set/ and several matches into set/<name>, and an
          # archive's own directories cannot tell the two apart. The first
          # name is one of the matches, so set/ holds one directory per
          # name exactly when set/<first> is that same artefact.
          if [ "${FIRST_OUTCOME}" = success ]; then
            mkdir -p -- "${staging}/first"
            found["${names[0]}"]="${staging}/first"
            if [ "${#names[@]}" -gt 1 ] &&
              [ -d "${staging}/set/${names[0]}" ] &&
              diff -rq --no-dereference -- "${staging}/first" \
                "${staging}/set/${names[0]}" > /dev/null 2>&1; then
              for name in "${names[@]:1}"; do
                if [ -d "${staging}/set/${name}" ]; then
                  found["${name}"]="${staging}/set/${name}"
                fi
              done
            fi
          fi
          for name in "${names[@]}"; do
            if [ -z "${found[${name}]:-}" ]; then
              echo "::error::build_artifacts entry '${name}': no artefact of" \
                "that name exists in this run. ${same_run}"
              errors=$((errors + 1))
            fi
          done
          if [ "${errors}" -gt 0 ]; then
            exit 1
          fi
          declare -A taken=() parents=()
          sources=()
          targets=()
          count=$(jq 'length' "${plan}")
          for ((i = 0; i < count; i++)); do
            name=$(jq -r --argjson i "${i}" '.[$i].name' "${plan}")
            path=$(jq -r --argjson i "${i}" '.[$i].path' "${plan}")
            label="build_artifacts[${i}] (name '${name}', path '${path}')"
            from="${found[${name}]}"
            while IFS= read -r -d '' file; do
              rel="${file#"${from}"/}"
              if [ "${path}" != '.' ]; then
                rel="${path}/${rel}"
              fi
              shown="${PATH_PREFIX}/${rel}"
              if [ -L "${file}" ] || [ ! -f "${file}" ]; then
                echo "::error::${label}: '${rel}' is not a regular file"
                errors=$((errors + 1))
                continue
              fi
              target="${root}/${rel}"
              # Command substitution would strip a trailing newline from
              # the name and so check one file but write another
              IFS= read -r -d '' resolved < <(realpath -zm -- "${target}")
              if [[ "${resolved}" != "${root}/"* ]]; then
                echo "::error::${label}: '${shown}' resolves outside" \
                  "path_prefix (${resolved})"
                errors=$((errors + 1))
                continue
              fi
              clash=''
              if [ -e "${target}" ] || [ -L "${target}" ]; then
                clash="${shown}"
              else
                dir="${target%/*}"
                while [ -n "${dir}" ] && [ "${dir}" != "${root}" ]; do
                  if [ -e "${dir}" ] && [ ! -d "${dir}" ]; then
                    clash="${PATH_PREFIX}/${dir#"${root}"/}"
                    break
                  fi
                  dir="${dir%/*}"
                done
              fi
              if [ -n "${clash}" ]; then
                echo "::error::${label}: '${shown}' would overwrite" \
                  "'${clash}' from the checkout; build artefacts add to the" \
                  "source tree and never replace it"
                errors=$((errors + 1))
                continue
              fi
              if [ -n "${taken[${resolved}]:-}" ] ||
                [ -n "${parents[${resolved}]:-}" ]; then
                echo "::error::${label}: '${shown}' collides with a file" \
                  "another build_artifacts entry places"
                errors=$((errors + 1))
                continue
              fi
              dir="${resolved%/*}"
              while [ -n "${dir}" ] && [ "${dir}" != "${root}" ]; do
                if [ -n "${taken[${dir}]:-}" ]; then
                  echo "::error::${label}: '${shown}' collides with a file" \
                    "another build_artifacts entry places"
                  errors=$((errors + 1))
                  continue 2
                fi
                parents["${dir}"]=1
                dir="${dir%/*}"
              done
              taken["${resolved}"]="${label}"
              sources+=("${file}")
              targets+=("${resolved}")
            done < <(find "${from}" -mindepth 1 ! -type d -print0)
          done
          if [ "${errors}" -gt 0 ]; then
            exit 1
          fi
          for ((i = 0; i < ${#sources[@]}; i++)); do
            mkdir -p -- "${targets[i]%/*}"
            cp -- "${sources[i]}" "${targets[i]}"
          done
          echo "Placed ${#sources[@]} build artefact file(s) under" \
            "${PATH_PREFIX} ✅"

      # Builds each image, in order, into the daemon as
      # [<namespace>/]<name>:verify (plus the plain <name>:verify
      # alias), so a same-repository FROM chain resolves against the
      # image built just before it. The action sets up buildx with the
      # docker driver for that reason: the default docker-container
      # driver cannot see an image --load'ed by the previous build.
      # build_command replaces the Dockerfile builds with the
      # project's own tooling, and the action works out which images
      # it produced, or takes build_command_images as the answer.
      # Every image gets an attempt; build_permit_fail lets the job
      # pass on failures, with outputs and a summary for whatever did
      # build.
      - name: 'Build images'
        id: build
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/docker-build-images-action@ce40ba64cd9420040dd00dc75b74dee3a333c884  # v0.2.2
        with:
          images: ${{ needs.docker-metadata.outputs.images_json }}
          path_prefix: ${{ inputs.path_prefix }}
          image_namespace: ${{ needs.gerrit-validate.outputs.namespace }}
          build_command: ${{ inputs.build_command }}
          build_command_images: ${{ inputs.build_command_images }}
          build_permit_fail: ${{ inputs.build_permit_fail }}

      - name: 'Save and upload image archives'
        # One archive per image, because the SBOM job runs syft per
        # image and Grype scans the per-image SBOMs; a single
        # combined tar could not be separated again. The artifact
        # name carries build_id so parallel workflow_call legs cannot
        # overwrite each other, and overwrite stays false so a
        # collision fails loudly rather than silently taking the last
        # writer. fail-on-empty is false because build_permit_fail
        # makes building nothing a legitimate outcome.
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/docker-save-images-action@b0d9fa6318d0ff08779b0487749fc784fa073969  # v0.2.2
        with:
          docker-artifacts-to-save: ${{ steps.build.outputs.images_list }}
          mode: 'per-image'
          # yamllint disable-line rule:line-length
          artifact-name: docker-archives-${{ needs.docker-metadata.outputs.build_id }}
          output-directory: 'docker-archives'
          overwrite: 'false'
          retention-days: '1'
          fail-on-empty: 'false'

  tests:
    name: 'Tests'
    runs-on: ubuntu-latest
    needs: ['build', 'docker-metadata']
    # Under build_permit_fail the build job can succeed having built
    # nothing, in which case no image archive exists to test.
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
          && needs.build.outputs.image_count != '0' }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@8721c15dacdd703064df5ade1416f7e5590b65f3  # v1.4.1
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          gerrit-branch: ${{ inputs.gerrit_branch }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
          submodules: ${{ inputs.checkout_submodules }}

      - name: 'Download image archives'
        if: inputs.test_command != ''
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: docker-archives-${{ needs.docker-metadata.outputs.build_id }}
          path: /tmp/docker-archives

      - name: 'Run tests'
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
          TEST_COMMAND: ${{ inputs.test_command }}
          IMAGES: ${{ needs.build.outputs.images }}
          # The NO_BLOCK/soft-fail pattern: the test_permit_fail input
          # (or, when unset, the NO_BLOCK_AUDIT_FAIL repository
          # variable) disables failure propagation.
          # yamllint disable-line rule:line-length
          NO_BLOCK: ${{ inputs.test_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
        run: |
          # Load the built images and run the caller's test hook; the
          # IMAGES environment variable carries the built tag list.
          if [ -z "${TEST_COMMAND}" ]; then
            echo "::notice::No test_command provided; nothing to run"
            exit 0
          fi
          # nullglob: a missing/empty artifact must fail with a clear
          # message, not a literal-glob docker load error.
          shopt -s nullglob
          archives=(/tmp/docker-archives/*.tar)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::No image archives found to load"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            docker load -i "${archive}"
          done
          cd "${PATH_PREFIX}"
          status=0
          bash -e -c "${TEST_COMMAND}" || status=$?
          if [ "${status}" != "0" ]; then
            if [ "${NO_BLOCK}" = "true" ]; then
              echo "::warning::Tests failed, but failures are" \
                "permitted so the job will not fail."
              exit 0
            fi
            exit "${status}"
          fi

  dockerfile-lint:
    name: 'Dockerfile Lint'
    runs-on: ubuntu-latest
    needs: 'docker-metadata'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.docker-metadata.result == 'success' && inputs.lint_enabled }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@8721c15dacdd703064df5ade1416f7e5590b65f3  # v1.4.1
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          gerrit-branch: ${{ inputs.gerrit_branch }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
          submodules: ${{ inputs.checkout_submodules }}

      - name: 'Lint Dockerfiles (hadolint)'
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
          IMAGES_JSON: ${{ needs.docker-metadata.outputs.images_json }}
          # Digest-pinned hadolint container; docker.io serves it and
          # sits in the egress allow-list.
          # yamllint disable-line rule:line-length
          HADOLINT_IMAGE: 'hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d'
          # The NO_BLOCK/soft-fail pattern: the lint_permit_fail input
          # (or its deprecated audit_permit_fail alias)
          # (or, when unset, the NO_BLOCK_AUDIT_FAIL repository
          # variable) disables failure propagation.
          # yamllint disable-line rule:line-length
          NO_BLOCK: ${{ inputs.lint_permit_fail || inputs.audit_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
        run: |
          # Lint exactly the Dockerfiles the build consumes (from the
          # resolved image list), so per-image dockerfile overrides
          # and non-standard filenames stay covered. The resolved
          # paths are relative to path_prefix (discovery runs there).
          cd "${PATH_PREFIX}"
          status=0
          while IFS= read -r dockerfile; do
            echo "::group::hadolint ${dockerfile}"
            docker run --rm \
              -v "${PWD}:/mnt:ro" -w /mnt \
              "${HADOLINT_IMAGE}" \
              hadolint "${dockerfile}" || status=1
            echo "::endgroup::"
          done < <(jq -r '.[] | .dockerfile //
            (.context + "/Dockerfile")' <<< "${IMAGES_JSON}")
          if [ "${status}" = "0" ]; then
            echo "Dockerfile lint passed ✅"
            exit 0
          fi
          if [ "${NO_BLOCK}" = "true" ]; then
            echo "::warning::hadolint reported findings, but failures" \
              "are permitted so the job will not fail."
            exit 0
          fi
          echo "::error::hadolint reported findings"
          exit 1

  sbom:
    name: 'Image SBOM'
    runs-on: ubuntu-latest
    needs: ['build', 'docker-metadata']
    # As for the tests job: no images built means no archive to scan.
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
          && needs.build.outputs.image_count != '0'
          && inputs.sbom_enabled }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download image archives'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: docker-archives-${{ needs.docker-metadata.outputs.build_id }}
          # Image mode only reads archives inside the workspace or
          # RUNNER_TEMP, so they land under runner.temp, not /tmp
          path: ${{ runner.temp }}/docker-archives

      # One CycloneDX SBOM per image archive, named
      # sbom-cyclonedx-<archive-basename>.json; the Grype job scans
      # every one. An empty archive directory fails the step.
      # sbom_spec_version 1.7 keeps the spec the inline syft call
      # wrote by default.
      - name: 'Generate image SBOMs'
        id: sbom
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/sbom-action@6a9b119a4ddeb29a02f24fbbc0446da5eaa25fdd  # v0.7.2
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/docker-archives
          sbom_format: json
          sbom_spec_version: '1.7'

      - name: 'Upload SBOM artifacts'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-files-${{ needs.docker-metadata.outputs.build_id }}
          path: sbom-cyclonedx-*.json
          retention-days: 45
          # Fail fast: the downstream Grype job requires this artifact,
          # so a missing/misnamed SBOM must surface here, not later
          if-no-files-found: error

  grype:
    name: 'Grype Audit SBOM'
    runs-on: ubuntu-latest
    # repository-metadata carries the dependency change verdict. The
    # !cancelled() guard keeps the scan running when that job failed
    # or skipped; the verdict is then empty, and empty gates.
    needs: ['sbom', 'docker-metadata', 'repository-metadata']
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.sbom.result == 'success' && inputs.grype_enabled }}
    timeout-minutes: 10
    outputs:
      gate_active: ${{ steps.grype-audit.outputs.gate-active }}
      gate_reason: ${{ steps.grype-audit.outputs.gate-reason }}
    permissions:
      contents: read
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download SBOM artefact'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sbom-files-${{ needs.docker-metadata.outputs.build_id }}

      # The grype_permit_fail input (or, when unset, the NO_BLOCK_AUDIT_FAIL
      # repository variable) disables failure propagation so pull requests
      # can proceed when blocked by newly discovered CVEs in base images
      # or transitive dependencies. grype_gate_when narrows when findings
      # block in the first place; permit-fail still passes an armed gate.
      - name: 'Grype audit SBOMs'
        id: grype-audit
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@f65dca2762823cfc8f376e32fee9baa6f3292696  # v0.6.2
        with:
          sbom: 'sbom-cyclonedx-*.json'
          fail-on: ${{ inputs.grype_fail_on }}
          only-fixed: ${{ inputs.grype_only_fixed }}
          dependency-policy: ${{ inputs.grype_dependency_policy }}
          transitive-fail-on: ${{ inputs.grype_transitive_fail_on }}
          gate-when: ${{ inputs.grype_gate_when }}
          # A failed job can still expose outputs its earlier steps
          # wrote, so the verdict travels only from a job that
          # succeeded; anything else is empty, which keeps the gate on
          # yamllint disable-line rule:line-length
          dependencies-changed: ${{ needs.repository-metadata.result == 'success' && needs.repository-metadata.outputs.dependencies_changed || '' }}
          # yamllint disable-line rule:line-length
          remediation-window-days: ${{ inputs.grype_remediation_window_days }}
          # yamllint disable-line rule:line-length
          remediation-window-start: ${{ inputs.grype_remediation_window_start }}
          # yamllint disable-line rule:line-length
          permit-fail: ${{ inputs.grype_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
          # yamllint disable-line rule:line-length
          artifact-name: grype-scan-results-${{ needs.docker-metadata.outputs.build_id }}
          retention-days: '45'
          cache-db: ${{ inputs.grype_cache_db }}
          bypass-repository: ${{ inputs.grype_bypass_repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The action's summary gives the gate's reason only when it
      # downgraded findings to warnings; record the decision on every
      # dependency-aware run, including those that gate or find nothing
      - name: 'Grype gate summary'
        # yamllint disable-line rule:line-length
        if: ${{ !cancelled() && inputs.grype_gate_when == 'dependencies-changed' && steps.grype-audit.outcome != 'skipped' }}
        shell: bash
        env:
          GATE_ACTIVE: ${{ steps.grype-audit.outputs.gate-active }}
          GATE_REASON: ${{ steps.grype-audit.outputs.gate-reason }}
          ADVISORY: ${{ steps.grype-audit.outputs.advisory-matches }}
        run: |
          # Grype gate summary
          {
            echo "### Grype gate"
            echo ""
            echo "| Gate active | Reason | Advisory matches |"
            echo "| ----------- | ------ | ---------------- |"
            echo "| ${GATE_ACTIVE:-unknown} | ${GATE_REASON:-unknown}" \
              "| ${ADVISORY:-unknown} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  # Release-file check: the change adds or edits a container release
  # file under releases/ or .releases/, and it must parse, validate
  # and pass the release container schema as merge.yaml's
  # check-release job will check it once merged. Same actions, same
  # registry inputs, so verify predicts merge. The registry inputs
  # are what turn this on: without them, a release file's registry
  # overrides have no host to be checked against.
  check-release:
    name: 'Check Release File'
    needs: gerrit-validate
    # yamllint disable-line rule:line-length
    if: inputs.snapshot_registry != '' || inputs.release_registry != ''
    runs-on: ubuntu-latest
    outputs:
      has_release: ${{ steps.detect.outputs.has_release }}
      version: ${{ steps.detect.outputs.version }}
      containers_json: ${{ steps.detect.outputs.containers_json }}
      pull_registry: ${{ steps.detect.outputs.pull_registry }}
      push_registry: ${{ steps.detect.outputs.push_registry }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Validate registry inputs'
        id: registries
        shell: bash
        env:
          SNAPSHOT_REGISTRY: ${{ inputs.snapshot_registry }}
          RELEASE_REGISTRY: ${{ inputs.release_registry }}
        run: |
          # merge.yaml requires both registries, and an override in a
          # release file is checked against the matching one, so a
          # check with only one of them could not predict the merge.
          # The next step checks each value against the registry rule
          # docker-promote-action holds; this step holds what that
          # rule does not: both set, and no whitespace.
          if [ -z "${SNAPSHOT_REGISTRY}" ] || [ -z "${RELEASE_REGISTRY}" ]
          then
            echo "::error::Release-file checks need both" \
              "snapshot_registry and release_registry (the values" \
              "merge.yaml receives); set both, or neither"
            exit 1
          fi
          # Mode validate strips surrounding whitespace before its
          # check, while merge.yaml refuses it, so refuse whitespace
          # and anything beyond printable ASCII here too.
          LC_ALL=C  # so [:graph:] means printable ASCII alone
          for input in "snapshot_registry=${SNAPSHOT_REGISTRY}" \
            "release_registry=${RELEASE_REGISTRY}"
          do
            case "${input#*=}" in
              *[![:graph:]]*)
                echo "::error::${input%%=*} holds whitespace or a" \
                  "character outside printable ASCII"
                exit 1
                ;;
            esac
          done
          echo "Both registry inputs set ✅"

      # Runs only once the step above has found both registries set.
      # docker-promote-action holds the registry rule every lane
      # shares (host[:port] of DNS labels and a TCP port, a host
      # Docker reads as a host, and an optional repository path of
      # Docker reference components), so this lane accepts the values
      # merge.yaml does. Mode validate contacts no registry.
      - name: 'Validate registry hosts'
        id: registry-hosts
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/docker-promote-action@e93fab056a6e66d199df08e864287fcc68313dbd  # v0.5.0
        with:
          mode: 'validate'
          pull_registry: ${{ inputs.snapshot_registry }}
          push_registry: ${{ inputs.release_registry }}

      # The detect action compares HEAD with its first parent, so both
      # checkout modes fetch depth 2 and it fails on one too shallow
      # to hold it. A Gerrit patch set compares with the commit it
      # sits on. A pull request's default checkout is the merge commit
      # GitHub prepares, whose first parent is the target branch, so
      # every commit of the pull request counts; a caller pinning ref
      # to the head commit would see only that commit's own changes.
      - name: 'Checkout'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@8721c15dacdd703064df5ade1416f7e5590b65f3  # v1.4.1
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          gerrit-branch: ${{ inputs.gerrit_branch }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          fetch-depth: '2'
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
          submodules: ${{ inputs.checkout_submodules }}

      # Reads files and git history only; runs nothing from the
      # checkout and contacts no registry. It looks under releases/
      # and .releases/, as Jenkins does, and refuses more than one
      # container release file across the two. Any value it outputs
      # has passed its grammar checks, and a registry override has
      # kept the host of the matching input, before release-verify
      # sends it, with a credential, to a registry. Release files with
      # other distribution types are left to their own pipelines.
      - name: 'Detect container release file in change'
        id: detect
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/docker-release-detect-action@90e24d4dfd4bfa21e2b2e65273c9b66b522e826d  # v0.0.3
        with:
          snapshot_registry: ${{ inputs.snapshot_registry }}
          release_registry: ${{ inputs.release_registry }}

      # Jenkins' lftools schema verify. Detection does not evaluate
      # the schema, and each accepts files the other rejects (a
      # missing or empty ref, an unquoted numeric release tag), so
      # both run. It follows detection, whose untrusted-input guards
      # have then passed, and checks the file detection found:
      # release_file, never a path of its own.
      - name: 'Verify release file schema'
        id: schema
        if: steps.detect.outputs.has_release == 'true'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/verify-release-schema-action@4402955a5beef8f98d755094a74f82c6755a3bf9  # v1.1.4
        with:
          distribution-type: 'container'
          release-file: ${{ steps.detect.outputs.release_file }}
          lftools-uv-version: '0.5.7'

  # The promotion's own checks, with nothing written: every staged
  # image the release file names must exist, and no release tag may
  # already hold different bits. A tag already holding the staged
  # digest passes as released. The job checks out nothing, so no
  # project code runs beside the registry credential; it consumes
  # only check-release's validated outputs. A failed job still
  # exports the outputs its earlier steps set, so a file that fails
  # the schema reports has_release 'true'; the job's result gates too.
  release-verify:
    name: 'Verify Release Promotion'
    runs-on: ubuntu-latest
    needs:
      - 'gerrit-validate'
      - 'check-release'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.check-release.result == 'success' && needs.check-release.outputs.has_release == 'true' }}
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # Staged images on Nexus 3 snapshot ports may need a login to
      # read. Without a credential (fork pull requests, self-tests)
      # the change keeps the offline check alone, with a warning.
      - name: 'Check registry credentials'
        id: creds
        shell: bash
        env:
          # yamllint disable-line rule:line-length
          HAS_CREDENTIALS: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' && secrets.VAULT_MAPPING_JSON != '' }}
        run: |
          # Gate the registry checks on credential availability
          if [ "${HAS_CREDENTIALS}" = 'true' ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::OP_SERVICE_ACCOUNT_TOKEN and/or" \
              "VAULT_MAPPING_JSON unavailable; the release file passed" \
              "the offline check, but its staged images and release" \
              "tags were not checked"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Resolve registry username'
        id: registry-user
        if: steps.creds.outputs.available == 'true'
        shell: bash
        env:
          REGISTRY_USER_INPUT: ${{ inputs.registry_user }}
          # The repository actually checked out, which can differ
          # from GITHUB_REPOSITORY for cross-repository calls
          TARGET_REPOSITORY: ${{ inputs.repository || github.repository }}
        run: |
          # merge.yaml's 1Password credential naming contract: the
          # credential item takes the name of the repository being
          # released, and so does the username unless registry_user
          # overrides it. Both reach $GITHUB_OUTPUT, so each is
          # constrained to a character set holding no line break.
          registry_user="${REGISTRY_USER_INPUT:-${TARGET_REPOSITORY##*/}}"
          credential_name="${TARGET_REPOSITORY##*/}"
          if [[ ! "${registry_user}" =~ ^[A-Za-z0-9._@+-]+$ ]]; then
            echo "::error::Invalid registry username:" \
              "${registry_user}"
            exit 1
          fi
          if [[ ! "${credential_name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid credential name:" \
              "${credential_name}"
            exit 1
          fi
          {
            echo "registry_user=${registry_user}"
            echo "credential_name=${credential_name}"
          } >> "$GITHUB_OUTPUT"

      - name: 'Load registry credential'
        id: load-credential
        if: steps.creds.outputs.available == 'true'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/credential-load-action@c4bf64f187865afb318669d8c9a95147c9e9d832  # v2.1.1
        with:
          # yamllint disable-line rule:line-length
          op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          vault_mapping_json: ${{ secrets.VAULT_MAPPING_JSON }}
          # yamllint disable-line rule:line-length
          credential_name: ${{ steps.registry-user.outputs.credential_name }}
          credential_grants_json: ${{ vars.CREDENTIAL_LOAD_GRANTS }}
          export_env: 'false'

      # The registries and namespace resolve exactly as merge.yaml's
      # promotion resolves them: a release-file override, else the
      # input, with the lane's namespace between registry and name.
      # on_conflict 'fail' matches the merge lane's promotion through
      # docker-promote-action (#135): release tags are immutable, so
      # a tag already holding other bits fails here as it will there.
      # The action logs in to both endpoints itself, in a private
      # docker config it removes when the step ends.
      - name: 'Verify staged images and release tags'
        if: steps.creds.outputs.available == 'true'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/docker-promote-action@e93fab056a6e66d199df08e864287fcc68313dbd  # v0.5.0
        with:
          mode: 'verify'
          containers_json: ${{ needs.check-release.outputs.containers_json }}
          release_tag: ${{ needs.check-release.outputs.version }}
          # yamllint disable-line rule:line-length
          pull_registry: ${{ needs.check-release.outputs.pull_registry || inputs.snapshot_registry }}
          # yamllint disable-line rule:line-length
          push_registry: ${{ needs.check-release.outputs.push_registry || inputs.release_registry }}
          namespace: ${{ needs.gerrit-validate.outputs.namespace }}
          on_conflict: 'fail'
          registry_user: ${{ steps.registry-user.outputs.registry_user }}
          registry_password: ${{ steps.load-credential.outputs.credential }}
