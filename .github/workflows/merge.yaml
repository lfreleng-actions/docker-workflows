---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Reusable Docker merge/publish pipeline (Model B: merge-driven).
#
# Implements the Jenkins-heritage LF/Gerrit container release model:
# every merge builds the repository's images and publishes the
# snapshot/staging tag set to the snapshot registry (version derived
# from version.properties), and a release promotion triggers when the
# merged commit adds a container release file under releases/:
#   gerrit-validate -> { repository-metadata | docker-metadata
#     | resolve-version | check-release }
#   docker-metadata -> build -> snapshot-publish
#   check-release -> release-publish (registry-side crane promotion)
#
# Snapshot tag set (one shared timestamp per run), matching the
# Jenkins include-docker-push.sh / fabric8 idiom the LF project
# estate consumes:
#   X.Y.Z-SNAPSHOT-latest    (rolling snapshot)
#   X.Y-STAGING-latest       (rolling staging)
#   X.Y.Z-<ts>Z              (immutable, promotable tag; the tag
#                             container release files reference)
#
# Release promotion is registry-side: the merged
# releases/<version>-container.yaml names previously staged
# name:version pairs, which crane copies from the snapshot registry
# to the release registry at container_release_tag — no rebuild, and
# multi-architecture manifests survive intact.
#
# The build job builds single-platform images (the runner's native
# platform) and hands the exact built bits to snapshot-publish as
# docker archives. Multi-architecture merge builds remain a
# follow-up (docs/BRIEF.md section 8).
#
# Call this from a thin caller workflow dispatched on Gerrit
# change-merged events (or push-to-main for GitHub-native projects);
# see examples/merge/ for both caller forms.
name: '[R] Docker Merge/Publish'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      # --- Checkout target (defaults to the calling repository) ---
      repository:
        description: 'Repository to check out (owner/name)'
        required: false
        type: string
        default: ''
      ref:
        description: 'Branch/tag/SHA to check out (empty = default branch)'
        required: false
        type: string
        default: ''

      # --- Project layout ---
      path_prefix:
        description: 'Path to the project root directory'
        required: false
        type: string
        default: '.'

      # --- Image selection/build ---
      images:
        description: >-
          JSON array describing the images to build; an empty string
          (the default) auto-discovers Dockerfiles under path_prefix.
          When provided, the array must be non-empty; each entry takes
          name and context (required), dockerfile (default
          context/Dockerfile), target and build_args (optional list of
          KEY=VALUE strings). Array order is the build order.
        required: false
        type: string
        default: ''
      image_namespace:
        description: >-
          Namespace prefixed to every image name on the registries
          (e.g. 'onap' publishes <registry>/onap/<name>). Empty
          applies no namespace.
        required: false
        type: string
        default: ''
      build_command:
        description: >-
          Escape hatch: a shell command run from path_prefix that
          builds the container images (e.g. 'make images' or
          'mvn -P docker package'). The workflow then enumerates the
          images the command created and publishes them. Empty
          (default) builds the discovered/declared Dockerfiles
          natively with docker buildx.
        required: false
        type: string
        default: ''
      build_timeout_minutes:
        description: 'Timeout for the build job in whole minutes'
        required: false
        type: number
        default: 30

      # --- Registry publishing ---
      snapshot_registry:
        description: >-
          Registry host[:port] that receives snapshot/staging
          publishes, e.g. nexus3.onap.org:10003. Also the default
          registry release promotion pulls staged images from (a
          container_pull_registry field in the release file wins).
        required: true
        type: string
      release_registry:
        description: >-
          Registry host[:port] that receives release promotions, e.g.
          nexus3.onap.org:10002. A container_push_registry field in
          the release file wins.
        required: true
        type: string
      nexus_user:
        description: >-
          Registry username override; empty derives the username from
          the repository name (the 1Password credential naming
          contract)
        required: false
        type: string
        default: ''
      push_latest:
        description: >-
          Additionally tag promoted release images as 'latest' on the
          release registry
        required: false
        type: boolean
        default: false
      dry_run:
        description: >-
          Run the publish/promotion steps without pushing. Dry runs
          skip credential loading and registry logins entirely, so
          they also exercise the lane where no credentials exist.
        required: false
        type: boolean
        default: false

      # --- Runner hardening ---
      harden_runner_egress:
        description: "Harden-runner egress policy: 'block' or 'audit'"
        required: false
        type: string
        default: 'block'
      harden_runner_allowlist:
        description: 'Out-of-band harden-runner allow-list configuration'
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@f0f76ac22f342c9a788ebcabe584e68a79cc2e83'  # v0.16.0
      build_permit_egress_traffic:
        description: >-
          Run harden-runner in audit mode for the build job only,
          permitting unrestricted egress. Use when base images or
          build-time dependencies come from registries/CDNs that are
          impractical to enumerate in the allow-list. Other jobs stay
          governed by harden_runner_egress; left unset, the build job
          follows it too.
        required: false
        type: boolean
        default: false

      # --- Gerrit-aware checkout (empty unless dispatched via Gerrit) ---
      gerrit_refspec:
        description: 'Gerrit refspec of the merged change'
        required: false
        type: string
        default: ''
      gerrit_project:
        description: 'Gerrit project name'
        required: false
        type: string
        default: ''
      gerrit_branch:
        description: 'Gerrit target branch'
        required: false
        type: string
        default: ''
      gerrit_revision:
        description: >-
          Immutable revision SHA of the merged change (the
          dispatcher's GERRIT_PATCHSET_REVISION). When set, content
          checkouts pin to this commit on the GitHub mirror instead
          of resolving the moving branch ref, so a queued run still
          examines the merge that dispatched it.
        required: false
        type: string
        default: ''
      gerrit_url:
        description: >-
          Gerrit server URL. Empty falls back to the GERRIT_URL repository
          variable at runtime.
        required: false
        type: string
        default: ''

    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        description: >-
          1Password service-account token used by credential-load-action
          to fetch the per-repository Nexus credential from the common
          per-org CI/CD vault (op://<vault>/<repository-name>/password).
          The publish jobs skip credential loading and publishing with a
          warning when unset, so PR/self-test contexts still work.
        required: false
      VAULT_MAPPING_JSON:
        description: >-
          Base64-encoded JSON mapping of organisation name to 1Password
          vault ID, keyed on github.repository_owner; consumed by
          credential-load-action to resolve the correct vault. The
          publish jobs skip credential loading and publishing with a
          warning when unset, so PR/self-test contexts still work.
        required: false

permissions: {}

jobs:
  gerrit-validate:
    name: 'Validate Gerrit Inputs'
    # Fails fast with a clear message when gerrit_refspec is set without
    # the project/branch the Gerrit checkout path also requires. The
    # build-chain root job depends on this, so invalid Gerrit inputs stop
    # the pipeline early and cleanly. This job always runs (only the
    # Gerrit validation step is conditional), so gating dependents on it
    # does not trip GitHub's "skipped need skips dependents" behaviour.
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: 'Validate registry inputs'
        shell: bash
        env:
          SNAPSHOT_REGISTRY: ${{ inputs.snapshot_registry }}
          RELEASE_REGISTRY: ${{ inputs.release_registry }}
        run: |
          # Require plain host[:port] registry references: the values
          # compose image references and reach docker login/push and
          # crane, so schemes, paths or hostile content must stop here
          for registry in "${SNAPSHOT_REGISTRY}" "${RELEASE_REGISTRY}"
          do
            if [[ ! "${registry}" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]]
            then
              echo "::error::Invalid registry input: ${registry}" \
                "(expected host or host:port)"
              exit 1
            fi
          done
          echo "Registry inputs validated ✅"

      - name: 'Require Gerrit project, branch and URL'
        if: inputs.gerrit_refspec != ''
        shell: bash
        env:
          GERRIT_PROJECT: ${{ inputs.gerrit_project }}
          GERRIT_BRANCH: ${{ inputs.gerrit_branch }}
          GERRIT_REVISION: ${{ inputs.gerrit_revision }}
          # yamllint disable-line rule:line-length
          GERRIT_URL: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
        run: |
          # gerrit_refspec is set, so the Gerrit checkout path runs and
          # also requires gerrit_project, gerrit_branch and a resolvable
          # Gerrit URL (the gerrit_url input or the GERRIT_URL variable).
          missing=''
          if [ -z "${GERRIT_PROJECT}" ]; then
            missing="${missing} gerrit_project"
          fi
          if [ -z "${GERRIT_BRANCH}" ]; then
            missing="${missing} gerrit_branch"
          fi
          if [ -z "${GERRIT_URL}" ]; then
            missing="${missing} gerrit_url/GERRIT_URL"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::gerrit_refspec is set but missing:${missing}"
            exit 1
          fi
          if [ -n "${GERRIT_REVISION}" ] &&
            [[ ! "${GERRIT_REVISION}" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::Invalid gerrit_revision:" \
              "${GERRIT_REVISION} (expected a commit SHA)"
            exit 1
          fi
          echo "Gerrit inputs validated ✅"

  repository-metadata:
    name: 'Repository Metadata'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@2a70c3284392b8d6ee85a509dd4e9818801a7e82  # v0.11.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 'Gather repository metadata'
        id: repo-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/repository-metadata-action@13657ed127e7fdb228cc83889e6f455f4b0039fe  # v0.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: 'true'
          gerrit_summary: ${{ inputs.gerrit_refspec != '' }}
          artifact_upload: 'true'
          artifact_formats: 'json'

  docker-metadata:
    name: 'Docker Metadata'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    outputs:
      images_json: ${{ steps.discover.outputs.images_json }}
      image_count: ${{ steps.discover.outputs.image_count }}
      build_id: ${{ steps.discover.outputs.build_id }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@2a70c3284392b8d6ee85a509dd4e9818801a7e82  # v0.11.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # A supplied gerrit_revision pins the checkout to the immutable
      # merged commit on the GitHub mirror (standard checkout below);
      # the Gerrit checkout path resolves the moving branch ref and
      # only serves callers that cannot supply the revision
      - name: 'Checkout Gerrit change'
        # yamllint disable-line rule:line-length
        if: inputs.gerrit_refspec != '' && inputs.gerrit_revision == ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        if: inputs.gerrit_refspec == '' || inputs.gerrit_revision != ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.gerrit_revision || inputs.ref }}
          persist-credentials: false

      - name: 'Discover images'
        id: discover
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
          IMAGES_INPUT: ${{ inputs.images }}
          TARGET_REPOSITORY: ${{ inputs.repository || github.repository }}
          IMAGE_NAMESPACE: ${{ inputs.image_namespace }}
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: |
          # Resolve the image list: an explicit 'images' input wins;
          # otherwise walk the estate-observed Dockerfile locations.
          cd "${PATH_PREFIX}"
          if [ -n "${IMAGES_INPUT}" ]; then
            if ! jq -e 'type == "array" and length > 0 and
                all(.[]; (.name | type == "string") and
                         (.context | type == "string") and
                         ((.dockerfile // "") | type == "string") and
                         ((.target // "") | type == "string") and
                         ((.build_args // []) | type == "array" and
                           all(.[]; type == "string")))' \
                >/dev/null 2>&1 <<< "${IMAGES_INPUT}"; then
              echo "::error::images input must be a non-empty JSON" \
                "array of objects with string 'name' and 'context'" \
                "keys; optional 'dockerfile'/'target' take strings" \
                "and 'build_args' a list of KEY=VALUE strings. Pass" \
                "an empty string (not []) for auto-discovery"
              exit 1
            fi
            images=$(jq -c . <<< "${IMAGES_INPUT}")
          else
            repo_name="${TARGET_REPOSITORY##*/}"
            if [ "${PATH_PREFIX}" != "." ]; then
              repo_name=$(basename "${PATH_PREFIX}")
            fi
            images='[]'
            add_image() {
              images=$(jq -c \
                --arg n "$1" --arg d "$2" --arg c "$3" \
                '. + [{name: $n, dockerfile: $d, context: $c}]' \
                <<< "${images}")
            }
            if [ -f Dockerfile ]; then
              add_image "${repo_name}" "Dockerfile" "."
            fi
            if [ -f docker/Dockerfile ]; then
              add_image "${repo_name}" "docker/Dockerfile" "docker"
            fi
            if [ -f src/main/docker/Dockerfile ]; then
              add_image "${repo_name}" \
                "src/main/docker/Dockerfile" "src/main/docker"
            fi
            for df in */Dockerfile; do
              [ -f "${df}" ] || continue
              dir="${df%/Dockerfile}"
              case "${dir}" in
                docker|src) continue ;;
              esac
              add_image "${dir}" "${df}" "${dir}"
            done
          fi
          # Sanitise names to the docker repository character set
          images=$(jq -c \
            '[.[] | .name |= (ascii_downcase |
              gsub("[^a-z0-9._-]"; "-"))]' \
            <<< "${images}")
          if [ -n "${IMAGES_INPUT}" ]; then
            # Explicit entries whose names collide after
            # normalisation (e.g. API and api) must reject: silently
            # dropping one would publish only part of the caller's
            # requested image set
            dupes=$(jq -r '[.[].name] | group_by(.) |
              map(select(length > 1) | .[0]) | .[]' \
              <<< "${images}")
            if [ -n "${dupes}" ]; then
              echo "::error::Duplicate image name(s) after" \
                "normalisation in the images input: ${dupes}"
              exit 1
            fi
          else
            # Auto-discovery drops duplicates (e.g. a root Dockerfile
            # plus docker/ both mapping to the repository name). The
            # de-duplication preserves array order — order is the
            # build order, which same-repository FROM chains rely on
            # — keeping the first occurrence of each name.
            images=$(jq -c \
              'reduce .[] as $img ([];
                if any(.[]; .name == $img.name) then .
                else . + [$img] end)' \
              <<< "${images}")
          fi
          count=$(jq 'length' <<< "${images}")
          if [ "${count}" -eq 0 ] && [ -z "${BUILD_COMMAND}" ]; then
            echo "::error::No Dockerfiles found under" \
              "'${PATH_PREFIX}' and no images input provided"
            exit 1
          fi
          if [ "${count}" -eq 0 ]; then
            # The build_command escape hatch builds images with
            # project tooling (possibly from nonstandard/generated
            # Dockerfiles), so an empty discovery result is not an
            # error — the build job enumerates what the command
            # creates
            echo "::notice::No Dockerfiles discovered under" \
              "'${PATH_PREFIX}'; build_command builds the images"
          fi
          # Post-sanitisation validation: every name must be a valid
          # Docker repository component (start and end alphanumeric),
          # so tag construction fails here with a clear message rather
          # than at build time.
          bad=$(jq -r '.[] | .name |
            select(test("^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$") | not)' \
            <<< "${images}")
          if [ -n "${bad}" ]; then
            echo "::error::Invalid image name(s) after sanitisation:" \
              "${bad} (names must start/end with a-z or 0-9)"
            exit 1
          fi
          echo "Discovered ${count} image(s):"
          jq -r '.[] | "  \(.name)  (\(.dockerfile //
            (.context + "/Dockerfile")))"' <<< "${images}"
          echo "images_json=${images}" >> "$GITHUB_OUTPUT"
          echo "image_count=${count}" >> "$GITHUB_OUTPUT"
          # Artifact names must be unique per workflow-call invocation:
          # matrix legs calling this workflow in parallel would
          # otherwise overwrite each other's docker-archives artifacts
          # (upload-artifact overwrites duplicate names) and downstream
          # jobs would consume another leg's images. Hash the
          # distinguishing inputs into a stable per-leg id.
          build_id=$(printf '%s|%s|%s|%s|%s' \
            "${TARGET_REPOSITORY}" "${PATH_PREFIX}" "${IMAGES_INPUT}" \
            "${IMAGE_NAMESPACE}" "${BUILD_COMMAND}" \
            | sha256sum | cut -c1-12)
          echo "build_id=${build_id}" >> "$GITHUB_OUTPUT"
          {
            echo "## Docker Images"
            echo ""
            echo "| Image | Dockerfile | Context |"
            echo "| ----- | ---------- | ------- |"
            jq -r '.[] | "| \(.name) | \(.dockerfile //
              (.context + "/Dockerfile")) | \(.context) |"' \
              <<< "${images}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  resolve-version:
    name: 'Resolve Version'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    outputs:
      # yamllint disable-line rule:line-length
      version: ${{ steps.build-metadata.outputs.version_properties_version }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@2a70c3284392b8d6ee85a509dd4e9818801a7e82  # v0.11.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # A supplied gerrit_revision pins the checkout to the immutable
      # merged commit on the GitHub mirror (standard checkout below);
      # the Gerrit checkout path resolves the moving branch ref and
      # only serves callers that cannot supply the revision
      - name: 'Checkout Gerrit change'
        # yamllint disable-line rule:line-length
        if: inputs.gerrit_refspec != '' && inputs.gerrit_revision == ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        if: inputs.gerrit_refspec == '' || inputs.gerrit_revision != ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.gerrit_revision || inputs.ref }}
          persist-credentials: false

      # version.properties (the Jenkins/global-jjb heritage version
      # source, present at the root of 110 LF project repositories)
      # remains mandatory for the merge workflow. The
      # build-metadata-action parses it (never sourcing it, and
      # skipping Jenkins-era ${...} interpolated values), so no
      # version extraction logic lives in workflow shell code.
      - name: 'Gather version metadata'
        id: build-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/build-metadata-action@504ee845e954566de1d220137fd40635e15468a9  # v0.8.0
        with:
          path_prefix: ${{ inputs.path_prefix }}
          artifact_upload: 'false'

      - name: 'Require version.properties version'
        env:
          # yamllint disable-line rule:line-length
          PROPS_VERSION: ${{ steps.build-metadata.outputs.version_properties_version }}
        shell: bash
        run: |
          # Fail fast unless version.properties supplied a full X.Y.Z
          # numeric version: the merge workflow requires one, and the
          # guard keeps malformed content out of downstream jobs
          if [ -z "${PROPS_VERSION}" ]; then
            echo "::error::No version resolved from" \
              "version.properties; the merge workflow requires one"
            exit 1
          fi
          if [[ ! "${PROPS_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version resolved: ${PROPS_VERSION}"
            exit 1
          fi
          echo "Resolved version: ${PROPS_VERSION}"

  build:
    name: 'Docker Build'
    needs: docker-metadata
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.build.outputs.images }}
      image_count: ${{ steps.build.outputs.image_count }}
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    steps:
      # The build job can opt into audit egress independently of the
      # other jobs via build_permit_egress_traffic, for base images and
      # build-time dependencies from registries/CDNs impractical to
      # enumerate in the allow-list. Left unset it follows
      # harden_runner_egress like every other job.
      #
      # One harden-runner step with the policy computed, rather than
      # two selected by condition: harden-runner declares a 'pre'
      # entry point and no 'pre-if', so its pre-phase runs whatever a
      # step-level 'if:' says. Both would engage the agent, the first
      # would win, and audit mode would be unreachable.
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@2a70c3284392b8d6ee85a509dd4e9818801a7e82  # v0.11.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ (inputs.build_permit_egress_traffic || inputs.harden_runner_egress == 'audit') && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # A supplied gerrit_revision pins the checkout to the immutable
      # merged commit on the GitHub mirror (standard checkout below);
      # the Gerrit checkout path resolves the moving branch ref and
      # only serves callers that cannot supply the revision
      - name: 'Checkout Gerrit change'
        # yamllint disable-line rule:line-length
        if: inputs.gerrit_refspec != '' && inputs.gerrit_revision == ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        if: inputs.gerrit_refspec == '' || inputs.gerrit_revision != ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.gerrit_revision || inputs.ref }}
          persist-credentials: false

      - name: 'Set up Docker buildx'
        # yamllint disable-line rule:line-length
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
        with:
          # The default docker-container driver isolates builds from
          # the daemon's image store, so an image --load'ed by one
          # build is invisible to the next build's FROM — breaking
          # same-repository chains. The docker driver builds against
          # the daemon directly; the archives it exports are what
          # snapshot-publish pushes.
          driver: docker

      - name: 'Build images'
        id: build
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
          IMAGES_JSON: ${{ needs.docker-metadata.outputs.images_json }}
          IMAGE_NAMESPACE: ${{ inputs.image_namespace }}
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: |
          # Build every image, then export each to a docker archive so
          # snapshot-publish pushes the exact bits built here. Unlike
          # the verify lane there is no soft-fail: a publish lane must
          # never publish a partial image set.
          cd "${PATH_PREFIX}"
          if [ -n "${IMAGE_NAMESPACE}" ] &&
            [[ ! "${IMAGE_NAMESPACE}" =~ ^[a-z0-9._-]+(/[a-z0-9._-]+)*$ ]]
          then
            echo "::error::Invalid image_namespace" \
              "'${IMAGE_NAMESPACE}' (lowercase path components" \
              "without leading/trailing/consecutive slashes)"
            exit 1
          fi
          declare -a tags=()
          declare -a failures=()
          if [ -n "${BUILD_COMMAND}" ]; then
            # Escape hatch: the project's own tooling builds the
            # images; enumerate what it created by diffing the image
            # list around the command. Pulled images (e.g. FROM base
            # images fetched by a classic 'docker build') carry a
            # registry RepoDigest, locally built images do not, so
            # the diff filters to genuinely built images and the
            # publish job never pushes unrelated bases.
            docker image ls --format '{{.Repository}}:{{.Tag}}' \
              | sort -u > /tmp/images-before.txt
            echo "::group::build_command"
            command_status=0
            bash -e -c "${BUILD_COMMAND}" || command_status=$?
            echo "::endgroup::"
            if [ "${command_status}" -ne 0 ]; then
              echo "::error::build_command exited ${command_status}"
              failures+=("build_command")
            fi
            docker image ls --format '{{.Repository}}:{{.Tag}}' \
              | sort -u > /tmp/images-after.txt
            while IFS= read -r candidate; do
              digests=$(docker image inspect \
                --format '{{len .RepoDigests}}' "${candidate}")
              if [ "${digests}" = "0" ]; then
                tags+=("${candidate}")
              else
                echo "::notice::Skipping pulled image ${candidate}" \
                  "(has a registry digest; not built here)"
              fi
            done < <(comm -13 /tmp/images-before.txt \
              /tmp/images-after.txt | grep -v '<none>' || true)
            if [ "${#tags[@]}" -eq 0 ] && [ "${#failures[@]}" -eq 0 ]
            then
              echo "::error::build_command completed but created no" \
                "new images"
              failures+=("build_command")
            fi
          else
            while IFS= read -r spec; do
              name=$(jq -r '.name' <<< "${spec}")
              ctx=$(jq -r '.context' <<< "${spec}")
              df=$(jq -r '.dockerfile //
                (.context + "/Dockerfile")' <<< "${spec}")
              target=$(jq -r '.target // empty' <<< "${spec}")
              # The lane-neutral local alias: same-repository FROM
              # chains reference <earlier-image>:verify (the shared
              # discovery contract), and local tags never publish —
              # snapshot-publish retags from the archives
              tag="${name}:verify"
              if [ -n "${IMAGE_NAMESPACE}" ]; then
                tag="${IMAGE_NAMESPACE}/${tag}"
              fi
              args=(--load -f "${df}" -t "${tag}")
              if [ -n "${target}" ]; then
                args+=(--target "${target}")
              fi
              while IFS= read -r build_arg; do
                [ -n "${build_arg}" ] &&
                  args+=(--build-arg "${build_arg}")
              done < <(jq -r '.build_args[]? // empty' <<< "${spec}")
              echo "::group::Build ${tag}"
              build_status=0
              docker buildx build "${args[@]}" "${ctx}" ||
                build_status=$?
              echo "::endgroup::"
              # Every image gets an attempt: a later image can build
              # when an earlier one does not, and a full picture of
              # what breaks beats stopping at the first failure. An
              # image whose same-repository base failed fails in
              # turn, which is the accurate signal.
              if [ "${build_status}" -eq 0 ]; then
                tags+=("${tag}")
                # With a namespace the alias becomes
                # <namespace>/<name>:verify; also apply the plain
                # <name>:verify alias so auto-discovered chains
                # (FROM <name>:verify) resolve either way
                if [ -n "${IMAGE_NAMESPACE}" ]; then
                  docker tag "${tag}" "${name}:verify"
                fi
              else
                echo "::error::Build failed for ${tag} (exit" \
                  "${build_status})"
                failures+=("${tag}")
              fi
            done < <(jq -c '.[]' <<< "${IMAGES_JSON}")
          fi
          mkdir -p /tmp/docker-archives
          for tag in "${tags[@]}"; do
            # Collision-safe archive names: the character mapping
            # alone is not injective (team/api:v1 and team_api:v1
            # both map to team_api_v1), so a short hash of the full
            # tag disambiguates and no docker save overwrites another
            safe=$(tr '/:' '__' <<< "${tag}")
            suffix=$(sha256sum <<< "${tag}" | cut -c1-8)
            docker save "${tag}" \
              -o "/tmp/docker-archives/${safe}-${suffix}.tar"
          done
          if [ "${#tags[@]}" -gt 0 ]; then
            built=$(printf '%s\n' "${tags[@]}" | jq -cnR '[inputs]')
          else
            built='[]'
          fi
          echo "Built ${#tags[@]} image(s): ${built}"
          echo "images=${built}" >> "$GITHUB_OUTPUT"
          echo "image_count=${#tags[@]}" >> "$GITHUB_OUTPUT"
          {
            echo "## Docker Build"
            echo ""
            echo "Built **${#tags[@]}** image(s):"
            echo ""
            if [ "${#tags[@]}" -gt 0 ]; then
              printf -- '- %s\n' "${tags[@]}"
            else
              echo "- (none)"
            fi
            echo ""
            if [ "${#failures[@]}" -gt 0 ]; then
              echo "Failed **${#failures[@]}** build(s):"
              echo ""
              printf -- '- %s\n' "${failures[@]}"
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${#failures[@]}" -gt 0 ]; then
            exit 1
          fi

      - name: 'Upload image archives'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: docker-archives-${{ needs.docker-metadata.outputs.build_id }}
          path: /tmp/docker-archives/
          retention-days: 1
          if-no-files-found: error

  snapshot-publish:
    name: 'Publish Snapshot'
    runs-on: ubuntu-latest
    needs:
      - 'resolve-version'
      - 'docker-metadata'
      - 'build'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.resolve-version.result == 'success' && needs.build.result == 'success' }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@2a70c3284392b8d6ee85a509dd4e9818801a7e82  # v0.11.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # Publishing pushes the build job's archives — the exact bits
      # the build produced — rather than rebuilding, so what publishes
      # is what built.
      - name: 'Download image archives'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: docker-archives-${{ needs.docker-metadata.outputs.build_id }}
          path: /tmp/docker-archives

      # The credential secrets stay optional so PR/self-test contexts
      # can exercise the pipeline; when absent the publish steps skip
      # with a warning rather than failing. A dry run skips credential
      # loading and login entirely and still exercises the tagging.
      - name: 'Check publish credentials'
        id: creds
        shell: bash
        env:
          # yamllint disable-line rule:line-length
          HAS_CREDENTIALS: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' && secrets.VAULT_MAPPING_JSON != '' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Gate publishing on credential availability
          if [ "${DRY_RUN}" = 'true' ]; then
            echo "Dry run: skipping credential loading and login"
            echo "available=false" >> "$GITHUB_OUTPUT"
          elif [ "${HAS_CREDENTIALS}" = 'true' ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::OP_SERVICE_ACCOUNT_TOKEN and/or" \
              "VAULT_MAPPING_JSON unavailable; skipping publish"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Resolve registry username'
        id: publish-params
        if: steps.creds.outputs.available == 'true'
        shell: bash
        env:
          NEXUS_USER_INPUT: ${{ inputs.nexus_user }}
          # The repository actually checked out/published, which can
          # differ from GITHUB_REPOSITORY for cross-repository calls
          TARGET_REPOSITORY: ${{ inputs.repository || github.repository }}
        run: |
          # 1Password credential naming contract: the credential (and
          # username) take the name of the repository being published
          # (the checked-out repository, not necessarily the caller)
          nexus_user="${NEXUS_USER_INPUT}"
          if [ -z "${nexus_user}" ]; then
            nexus_user="${TARGET_REPOSITORY##*/}"
          fi
          # The credential item always keys on the published
          # repository's name (nexus_user overrides the login
          # username only), so cross-repository calls load the
          # target's item rather than the caller's
          credential_name="${TARGET_REPOSITORY##*/}"
          # Constrain to a safe single-line character set before the
          # values reach $GITHUB_OUTPUT (output-file injection)
          for value in "${nexus_user}" "${credential_name}"; do
            if [[ ! "${value}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Invalid registry username or" \
                "credential name: ${value}"
              exit 1
            fi
          done
          echo "nexus_user=${nexus_user}" >> "$GITHUB_OUTPUT"
          echo "credential_name=${credential_name}" >> "$GITHUB_OUTPUT"

      # credential_grants_json wires the admin-managed
      # CREDENTIAL_LOAD_GRANTS repository/organisation variable in at
      # the workflow layer: composite actions cannot read vars, and the
      # grants list must never become a caller-facing input.
      - name: 'Load registry credential'
        id: load-credential
        if: steps.creds.outputs.available == 'true'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/credential-load-action@560620cbe18a05ace2104a8997176c094cd0a940  # v2.0.3
        with:
          # yamllint disable-line rule:line-length
          op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          vault_mapping_json: ${{ secrets.VAULT_MAPPING_JSON }}
          # yamllint disable-line rule:line-length
          credential_name: ${{ steps.publish-params.outputs.credential_name }}
          credential_grants_json: ${{ vars.CREDENTIAL_LOAD_GRANTS }}
          export_env: 'false'

      - name: 'Login to snapshot registry'
        if: steps.creds.outputs.available == 'true'
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ inputs.snapshot_registry }}
          username: ${{ steps.publish-params.outputs.nexus_user }}
          password: ${{ steps.load-credential.outputs.credential }}

      # Snapshot publishes skip release-grade signing/provenance by
      # design: the LF Nexus 3 registries lack dependable OCI
      # referrer/attestation support (docs/BRIEF.md section 5.4), and
      # snapshot tags are transient.
      - name: 'Publish snapshot/staging tags'
        # yamllint disable-line rule:line-length
        if: steps.creds.outputs.available == 'true' || inputs.dry_run
        shell: bash
        env:
          IMAGES: ${{ needs.build.outputs.images }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          SNAPSHOT_REGISTRY: ${{ inputs.snapshot_registry }}
          IMAGE_NAMESPACE: ${{ inputs.image_namespace }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Retag the built images with the LF snapshot/staging tag
          # set and push each to the snapshot registry. One timestamp
          # per run: every image in a merge shares the promotable tag,
          # which is what container release files reference.
          shopt -s nullglob
          archives=(/tmp/docker-archives/*.tar)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::No image archives found to publish"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            docker load -i "${archive}"
          done
          timestamp=$(date -u '+%Y%m%dT%H%M%SZ')
          major_minor="${VERSION%.*}"
          declare -a pushed=()
          declare -A seen_names=()
          while IFS= read -r local_tag; do
            # Strip the tag (the last colon-suffix) rather than the
            # first colon match: build_command-produced tags can
            # carry a registry:port prefix
            repo="${local_tag%:*}"
            name="${repo##*/}"
            # Publish names derive from the repository basename, so
            # distinct images sharing a basename (team-a/api,
            # team-b/api) would silently overwrite each other on the
            # snapshot registry. Deduplicate identical images (one
            # image carrying several local tags) and fail on genuine
            # collisions.
            image_id=$(docker image inspect \
              --format '{{.Id}}' "${local_tag}")
            if [ -n "${seen_names[${name}]:-}" ]; then
              if [ "${seen_names[${name}]}" = "${image_id}" ]; then
                echo "::notice::Skipping ${local_tag}: the image" \
                  "already published as '${name}'"
                continue
              fi
              echo "::error::Multiple distinct images map to the" \
                "publish name '${name}'; rename the images or" \
                "declare them via the images input"
              exit 1
            fi
            seen_names[${name}]="${image_id}"
            target="${SNAPSHOT_REGISTRY}/${name}"
            if [ -n "${IMAGE_NAMESPACE}" ]; then
              target="${SNAPSHOT_REGISTRY}/${IMAGE_NAMESPACE}/${name}"
            fi
            for tag in \
              "${VERSION}-SNAPSHOT-latest" \
              "${major_minor}-STAGING-latest" \
              "${VERSION}-${timestamp}"; do
              docker tag "${local_tag}" "${target}:${tag}"
              if [ "${DRY_RUN}" = 'true' ]; then
                echo "Dry run: would push ${target}:${tag}"
              else
                echo "::group::Push ${target}:${tag}"
                docker push "${target}:${tag}"
                echo "::endgroup::"
              fi
              pushed+=("${target}:${tag}")
            done
          done < <(jq -r '.[]' <<< "${IMAGES}")
          {
            echo "## Snapshot Publish"
            echo ""
            if [ "${DRY_RUN}" = 'true' ]; then
              echo "Dry run: **${#pushed[@]}** tag(s) computed," \
                "nothing pushed"
            else
              echo "Pushed **${#pushed[@]}** tag(s):"
            fi
            echo ""
            printf -- "- \`%s\`\n" "${pushed[@]}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  check-release:
    name: 'Check for Release File'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    outputs:
      has_release: ${{ steps.detect.outputs.has_release }}
      version: ${{ steps.detect.outputs.version }}
      containers_json: ${{ steps.detect.outputs.containers_json }}
      pull_registry: ${{ steps.detect.outputs.pull_registry }}
      push_registry: ${{ steps.detect.outputs.push_registry }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@2a70c3284392b8d6ee85a509dd4e9818801a7e82  # v0.11.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # On Gerrit change-merged dispatches GERRIT_REFSPEC is the branch
      # ref (refs/heads/<branch>), so both checkout paths land on the
      # merged commit. Both checkouts fetch depth 2 so diff-tree can
      # compare HEAD against its parent (a depth-1 shallow HEAD looks
      # like a root commit and diff-tree would silently emit nothing).
      # A supplied gerrit_revision pins the checkout to the immutable
      # merged commit on the GitHub mirror (standard checkout below);
      # the Gerrit checkout path resolves the moving branch ref and
      # only serves callers that cannot supply the revision
      - name: 'Checkout Gerrit change'
        # yamllint disable-line rule:line-length
        if: inputs.gerrit_refspec != '' && inputs.gerrit_revision == ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          fetch-depth: '2'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        if: inputs.gerrit_refspec == '' || inputs.gerrit_revision != ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.gerrit_revision || inputs.ref }}
          fetch-depth: 2
          persist-credentials: false

      # Container release detection: the merged commit adds a release
      # file under releases/ with distribution_type: container, naming
      # previously staged name:version pairs and the release tag they
      # promote to (the LF self-release container schema). Release
      # files with other distribution types (e.g. maven) belong to
      # other pipelines and are ignored here.
      - name: 'Detect container release file in merged commit'
        id: detect
        shell: bash
        env:
          SNAPSHOT_REGISTRY: ${{ inputs.snapshot_registry }}
          RELEASE_REGISTRY: ${{ inputs.release_registry }}
        run: |
          # Detect a release file added/changed by the merged commit.
          # -m --first-parent makes merge commits diff against their
          # first parent (plain diff-tree emits nothing for merges,
          # which would silently suppress release detection). A
          # diff-tree failure (e.g. insufficient history) fails loudly
          # rather than silently skipping an intended release.
          if ! files=$(git diff-tree -m --first-parent \
            --no-commit-id -r HEAD --name-only -- "releases/"); then
            echo "::error::git diff-tree failed; cannot detect" \
              "release files (insufficient checkout history?)"
            exit 1
          fi
          no_release() {
            echo "$1"
            {
              echo "has_release=false"
              echo "version="
              echo "containers_json="
              echo "pull_registry="
              echo "push_registry="
            } >> "$GITHUB_OUTPUT"
            exit 0
          }
          declare -a container_files=()
          while IFS= read -r file; do
            [ -n "${file}" ] || continue
            # Removed by the merged commit; not a release trigger
            [ -f "${file}" ] || continue
            dist_type=$(yq -r '.distribution_type // ""' "${file}")
            if [ "${dist_type}" = 'container' ]; then
              container_files+=("${file}")
            else
              echo "::notice::Ignoring non-container release file:" \
                "${file} (distribution_type: ${dist_type:-unset})"
            fi
          done <<< "${files}"
          if [ "${#container_files[@]}" -eq 0 ]; then
            no_release "No container release file in merged commit"
          fi
          # Enforce exactly one container release descriptor per
          # merged commit; multiple would make promotion arbitrary
          if [ "${#container_files[@]}" -gt 1 ]; then
            echo "::error::Multiple container release files in" \
              "merged commit:"
            printf -- '%s\n' "${container_files[@]}"
            exit 1
          fi
          release_file="${container_files[0]}"
          echo "Container release file detected: ${release_file}"
          version=$(yq -r '.container_release_tag // ""' \
            "${release_file}")
          # Guard against malformed/hostile content before values
          # reach $GITHUB_OUTPUT and downstream jobs: the value
          # becomes a docker tag, so enforce the docker tag grammar
          # (leading alphanumeric/underscore, 128 characters max)
          if [[ ! "${version}" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]
          then
            echo "::error::Invalid or missing" \
              "container_release_tag in ${release_file}"
            exit 1
          fi
          containers=$(yq -o=json -I=0 '.containers // []' \
            "${release_file}")
          # Names become registry repository paths (validate each
          # slash-separated component, and require uniqueness —
          # duplicate names would map to the same promotion
          # destination and silently leave only the last source
          # promoted) and versions become docker tags (apply the tag
          # grammar), so crane receives well-formed references
          if ! jq -e 'type == "array" and length > 0 and
              ([.[].name] | length == (unique | length)) and
              all(.[]; (.name | type == "string" and
                (split("/") |
                 all(.[];
                   test("^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$")))) and
                ((.version | type) as $t |
                 ($t == "string" or $t == "number")) and
                ((.version | tostring) |
                test("^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$")))' \
              >/dev/null 2>&1 <<< "${containers}"; then
            echo "::error::Invalid containers list in" \
              "${release_file}: expected a non-empty array of" \
              "{name, version} entries with registry-safe values"
            exit 1
          fi
          # Normalise versions to strings (yq may emit numbers) and
          # compact to a single line for $GITHUB_OUTPUT
          containers=$(jq -c \
            '[.[] | {name: .name, version: (.version | tostring)}]' \
            <<< "${containers}")
          # Optional per-file registry overrides (the LF self-release
          # container schema carries these). The overrides may vary
          # the port only: the promotion job logs in to these
          # endpoints with the loaded Nexus credential, so an
          # arbitrary host in a merged release file could exfiltrate
          # it. Constrain each override to the host of the
          # corresponding workflow input.
          pull_registry=$(yq -r '.container_pull_registry // ""' \
            "${release_file}")
          push_registry=$(yq -r '.container_push_registry // ""' \
            "${release_file}")
          check_registry() {
            local override="$1" allowed="$2" field="$3"
            [ -n "${override}" ] || return 0
            if [[ ! "${override}" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]]
            then
              echo "::error::Invalid ${field} in ${release_file}:" \
                "${override} (expected host or host:port)"
              exit 1
            fi
            if [ "${override%%:*}" != "${allowed%%:*}" ]; then
              echo "::error::${field} in ${release_file}" \
                "(${override}) must stay on the configured" \
                "registry host (${allowed%%:*}); the promotion" \
                "credential only ever authenticates there"
              exit 1
            fi
          }
          check_registry "${pull_registry}" "${SNAPSHOT_REGISTRY}" \
            'container_pull_registry'
          check_registry "${push_registry}" "${RELEASE_REGISTRY}" \
            'container_push_registry'
          echo "Release tag: ${version}"
          echo "Containers: ${containers}"
          {
            echo "has_release=true"
            echo "version=${version}"
            echo "containers_json=${containers}"
            echo "pull_registry=${pull_registry}"
            echo "push_registry=${push_registry}"
          } >> "$GITHUB_OUTPUT"

  # Registry-side promotion: crane copies the staged name:version
  # images named by the release file to the release registry at the
  # release tag, preserving multi-architecture manifests. No rebuild
  # occurs — the staged images were built and published by the merge
  # that staged them — so this job deliberately does not depend on
  # this run's build.
  release-publish:
    name: 'Promote Release'
    runs-on: ubuntu-latest
    needs:
      - 'check-release'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.check-release.outputs.has_release == 'true' }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@2a70c3284392b8d6ee85a509dd4e9818801a7e82  # v0.11.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # The credential secrets stay optional so PR/self-test contexts
      # can exercise the pipeline; when absent the promotion steps
      # skip with a warning rather than failing. A dry run skips
      # credential loading and login entirely.
      - name: 'Check publish credentials'
        id: creds
        shell: bash
        env:
          # yamllint disable-line rule:line-length
          HAS_CREDENTIALS: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' && secrets.VAULT_MAPPING_JSON != '' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Gate promotion on credential availability
          if [ "${DRY_RUN}" = 'true' ]; then
            echo "Dry run: skipping credential loading and login"
            echo "available=false" >> "$GITHUB_OUTPUT"
          elif [ "${HAS_CREDENTIALS}" = 'true' ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::OP_SERVICE_ACCOUNT_TOKEN and/or" \
              "VAULT_MAPPING_JSON unavailable; skipping promotion"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Resolve registry username'
        id: publish-params
        if: steps.creds.outputs.available == 'true'
        shell: bash
        env:
          NEXUS_USER_INPUT: ${{ inputs.nexus_user }}
          # The repository actually checked out/published, which can
          # differ from GITHUB_REPOSITORY for cross-repository calls
          TARGET_REPOSITORY: ${{ inputs.repository || github.repository }}
        run: |
          # 1Password credential naming contract: the credential (and
          # username) take the name of the repository being published
          # (the checked-out repository, not necessarily the caller)
          nexus_user="${NEXUS_USER_INPUT}"
          if [ -z "${nexus_user}" ]; then
            nexus_user="${TARGET_REPOSITORY##*/}"
          fi
          # The credential item always keys on the published
          # repository's name (nexus_user overrides the login
          # username only), so cross-repository calls load the
          # target's item rather than the caller's
          credential_name="${TARGET_REPOSITORY##*/}"
          # Constrain to a safe single-line character set before the
          # values reach $GITHUB_OUTPUT (output-file injection)
          for value in "${nexus_user}" "${credential_name}"; do
            if [[ ! "${value}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Invalid registry username or" \
                "credential name: ${value}"
              exit 1
            fi
          done
          echo "nexus_user=${nexus_user}" >> "$GITHUB_OUTPUT"
          echo "credential_name=${credential_name}" >> "$GITHUB_OUTPUT"

      - name: 'Load registry credential'
        id: load-credential
        if: steps.creds.outputs.available == 'true'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/credential-load-action@560620cbe18a05ace2104a8997176c094cd0a940  # v2.0.3
        with:
          # yamllint disable-line rule:line-length
          op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          vault_mapping_json: ${{ secrets.VAULT_MAPPING_JSON }}
          # yamllint disable-line rule:line-length
          credential_name: ${{ steps.publish-params.outputs.credential_name }}
          credential_grants_json: ${{ vars.CREDENTIAL_LOAD_GRANTS }}
          export_env: 'false'

      # The same per-repository Nexus credential authenticates both
      # registries (the LF Nexus 3 snapshot/release registries share
      # a credential realm); crane reads the docker config both
      # logins write. Release-file registry overrides must stay
      # within that credential realm — promotion to registries with
      # separate credentials (e.g. docker.io) remains with the LF
      # release-engineering tooling for now.
      - name: 'Login to pull registry'
        if: steps.creds.outputs.available == 'true'
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          # yamllint disable-line rule:line-length
          registry: ${{ needs.check-release.outputs.pull_registry || inputs.snapshot_registry }}
          username: ${{ steps.publish-params.outputs.nexus_user }}
          password: ${{ steps.load-credential.outputs.credential }}
      - name: 'Login to push registry'
        if: steps.creds.outputs.available == 'true'
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          # yamllint disable-line rule:line-length
          registry: ${{ needs.check-release.outputs.push_registry || inputs.release_registry }}
          username: ${{ steps.publish-params.outputs.nexus_user }}
          password: ${{ steps.load-credential.outputs.credential }}

      - name: 'Set up crane'
        if: steps.creds.outputs.available == 'true'
        # yamllint disable-line rule:line-length
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b  # v0.7

      - name: 'Promote staged images'
        # yamllint disable-line rule:line-length
        if: steps.creds.outputs.available == 'true' || inputs.dry_run
        shell: bash
        env:
          CONTAINERS: ${{ needs.check-release.outputs.containers_json }}
          RELEASE_TAG: ${{ needs.check-release.outputs.version }}
          # yamllint disable-line rule:line-length
          PULL_REGISTRY: ${{ needs.check-release.outputs.pull_registry || inputs.snapshot_registry }}
          # yamllint disable-line rule:line-length
          PUSH_REGISTRY: ${{ needs.check-release.outputs.push_registry || inputs.release_registry }}
          PUSH_LATEST: ${{ inputs.push_latest }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Registry-side promotion of every container named by the
          # release file: staged name:version on the pull registry
          # copies to name:release-tag on the push registry. The
          # descriptor's name is the full repository path below the
          # registry (the LF self-release schema, e.g.
          # onap/ccsdk-odlsli-alpine-image), so no namespace applies
          # here — re-adding image_namespace would double-prefix
          # paths the snapshot publish already namespaced. crane
          # copies manifests as-is, so multi-architecture manifest
          # lists survive the promotion. Two phases: every copy
          # completes before any mutable latest tag moves, so a
          # failing copy never leaves a partially-latest release.
          declare -a promoted=()
          while IFS= read -r container; do
            name=$(jq -r '.name' <<< "${container}")
            version=$(jq -r '.version' <<< "${container}")
            src="${PULL_REGISTRY}/${name}:${version}"
            dst="${PUSH_REGISTRY}/${name}:${RELEASE_TAG}"
            if [ "${DRY_RUN}" = 'true' ]; then
              echo "Dry run: would copy ${src} -> ${dst}"
            else
              echo "::group::Promote ${src} -> ${dst}"
              crane copy "${src}" "${dst}"
              echo "::endgroup::"
            fi
            promoted+=("${dst}")
          done < <(jq -c '.[]' <<< "${CONTAINERS}")
          if [ "${PUSH_LATEST}" = 'true' ]; then
            while IFS= read -r name; do
              dst="${PUSH_REGISTRY}/${name}:${RELEASE_TAG}"
              if [ "${DRY_RUN}" = 'true' ]; then
                echo "Dry run: would tag ${dst} as latest"
              else
                crane tag "${dst}" latest
              fi
              promoted+=("${PUSH_REGISTRY}/${name}:latest")
            done < <(jq -r '.[] | .name' <<< "${CONTAINERS}")
          fi
          {
            echo "## Release Promotion"
            echo ""
            if [ "${DRY_RUN}" = 'true' ]; then
              echo "Dry run: **${#promoted[@]}** tag(s) computed," \
                "nothing promoted"
            else
              echo "Promoted **${#promoted[@]}** tag(s):"
            fi
            echo ""
            printf -- "- \`%s\`\n" "${promoted[@]}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
