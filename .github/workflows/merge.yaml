---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Reusable Docker merge/publish pipeline (Model B: merge-driven).
#
# Implements the Jenkins-heritage LF/Gerrit container release model:
# every merge builds the repository's images and publishes the
# snapshot/staging tag set to the snapshot registry (version derived
# from version.properties), and a release promotion triggers when the
# merged commit adds a container release file under releases/:
#   gerrit-validate -> { repository-metadata | docker-metadata
#     | resolve-version | check-release }
#   docker-metadata -> { dockerfile-lint | build }
#   build -> { tests | sbom -> grype }
#   { resolve-version | dockerfile-lint | tests | sbom | grype }
#     -> snapshot-publish
#   check-release -> release-publish (registry-side crane promotion)
#
# Gate, then stage: the lint, test, SBOM and Grype jobs mirror
# build-test.yaml's. hadolint lints the Dockerfiles the build
# consumed; tests and SBOM generation read the image archives the
# build job uploads, the bits snapshot-publish pushes; Grype scans
# the SBOMs generated from them. Every snapshot tag is a promotable
# candidate, so snapshot-publish runs only once each enabled gate
# has passed; a gate disabled by its input does not hold it back,
# and the *_permit_fail inputs let staging proceed past findings.
#
# Snapshot tag set (one shared timestamp per run), matching the
# Jenkins include-docker-push.sh / fabric8 idiom the LF project
# estate consumes:
#   X.Y.Z-SNAPSHOT-latest    (rolling snapshot)
#   X.Y-STAGING-latest       (rolling staging)
#   X.Y.Z-<ts>Z              (immutable, promotable tag; the tag
#                             container release files reference)
#
# Release promotion is registry-side: the merged
# releases/<version>-container.yaml names previously staged
# name:version pairs, which crane copies from the snapshot registry
# to the release registry at container_release_tag — no rebuild, and
# multi-architecture manifests survive intact.
#
# The build job builds single-platform images (the runner's native
# platform) and hands the exact built bits to snapshot-publish as
# docker archives. Multi-architecture merge builds remain a
# follow-up (docs/BRIEF.md section 8).
#
# Call this from a thin caller workflow dispatched on Gerrit
# change-merged events (or push-to-main for GitHub-native projects);
# see examples/merge/ for both caller forms.
name: '[R] Docker Merge/Publish'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      # --- Checkout target (defaults to the calling repository) ---
      repository:
        description: 'Repository to check out (owner/name)'
        required: false
        type: string
        default: ''
      ref:
        description: 'Branch/tag/SHA to check out (empty = default branch)'
        required: false
        type: string
        default: ''

      # --- Project layout ---
      path_prefix:
        description: 'Path to the project root directory'
        required: false
        type: string
        default: '.'

      # --- Image selection/build ---
      images:
        description: >-
          JSON array describing the images to build; an empty string
          (the default) auto-discovers Dockerfiles under path_prefix.
          When provided, the array must be non-empty; each entry takes
          name and context (required), dockerfile (default
          context/Dockerfile), target and build_args (optional list of
          KEY=VALUE strings). Array order is the build order.
        required: false
        type: string
        default: ''
      namespace_mode:
        description: >-
          How the namespace prefixed to every image name on the
          registries resolves: 'none' (no namespace), 'auto' (the
          lowercased owner of the repository built) or 'manual' (the
          namespace input). With 'onap', snapshots publish as
          <registry>/onap/<name> and release promotion copies
          <registry>/onap/<release-file name>.
        required: false
        type: string
        default: 'none'
      namespace:
        description: >-
          Image namespace for namespace_mode 'manual' (e.g. 'onap' or
          'onap/so'); an error with any other mode.
        required: false
        type: string
        default: ''
      build_command:
        description: >-
          Escape hatch: a shell command run from path_prefix that
          builds the container images (e.g. 'make images' or
          'mvn -P docker package'). The workflow then enumerates the
          images the command created, feeds them to the test, SBOM
          and scan jobs, and publishes them. Empty (default) builds
          the discovered/declared Dockerfiles natively with docker
          buildx.
        required: false
        type: string
        default: ''
      build_command_images:
        description: >-
          Space or comma separated image references that
          build_command produces, e.g. 'onap/cps:latest'. Declaring
          them replaces the inference the workflow otherwise performs
          to work out which images the command built, and is the only
          reliable account where that inference cannot reach: a
          builder stamping a reproducible creation timestamp (jib
          pins it to the Unix epoch) is indistinguishable from a
          pulled base on daemons using the containerd image store.
          Empty (the default) infers.
        required: false
        type: string
        default: ''
      build_timeout_minutes:
        description: 'Timeout for the build job in whole minutes'
        required: false
        type: number
        default: 30

      # --- Tests ---
      # The test, lint, SBOM and Grype inputs match build-test.yaml's
      # in name, default and meaning. Here a failing gate also holds
      # back snapshot-publish. The lint, test and Grype gates take a
      # *_permit_fail input (with the NO_BLOCK_AUDIT_FAIL repository
      # variable as fallback) that permits their findings; SBOM
      # generation has none, so its failure always blocks.
      test_command:
        description: >-
          Shell command run from path_prefix after the built images
          load into the Docker daemon (a smoke/integration hook, e.g.
          'make test'). The IMAGES environment variable carries a JSON
          array of the built image tags. Empty runs no command: the
          tests job passes with a notice, which satisfies the
          snapshot-publish gate.
        required: false
        type: string
        default: ''
      test_permit_fail:
        description: 'Permit test failures without failing the workflow'
        required: false
        type: boolean
        default: false

      # --- Dockerfile lint (hadolint) ---
      lint_enabled:
        description: 'Run the Dockerfile lint job (set false to skip)'
        required: false
        type: boolean
        default: true
      lint_permit_fail:
        description: 'Permit hadolint findings (the NO_BLOCK pattern)'
        required: false
        type: boolean
        default: false
      audit_permit_fail:
        description: >-
          DEPRECATED alias for lint_permit_fail, retained so existing
          callers keep working. This job lints Dockerfiles; it does not
          audit dependencies. Elsewhere in the estate audit_* governs a
          dependency audit, so the name is being retired here. Prefer
          lint_permit_fail; this input is removed at the next major.
        required: false
        type: boolean
        default: false

      # --- SBOM ---
      sbom_enabled:
        description: >-
          Generate an image SBOM (set false to skip). The Grype scan
          reads the SBOM, so skipping generation leaves it nothing to
          scan. To keep the SBOM but drop the scan, use grype_enabled.
        required: false
        type: boolean
        default: true

      # --- Grype scan ---
      grype_enabled:
        description: >-
          Run the Grype vulnerability scan over the generated SBOMs (set
          false to skip). Decoupling is one-way: disabling the scan
          keeps the SBOMs, but disabling the SBOM job also stops the
          scan, which has nothing to read.
        required: false
        type: boolean
        default: true
      grype_fail_on:
        description: 'Minimum severity that fails the Grype scan'
        required: false
        type: string
        default: 'medium'
      grype_permit_fail:
        description: >-
          Permit Grype findings without failing the job. When false, falls
          back to the NO_BLOCK_AUDIT_FAIL repository variable at runtime.
        required: false
        type: boolean
        default: false
      grype_cache_db:
        description: >-
          How the Grype scan uses the Actions cache for the
          vulnerability database: 'true' restores and saves,
          'restore-only' restores but never saves, 'false' disables
          caching. Cache entries rotate on the database build time, so
          exactly one job may write a given prefix; where a caller
          invokes this workflow several times in parallel, give one
          call 'true' and the rest 'restore-only'. With several
          writers, creation order and build order can disagree, and a
          restore then returns an older database than the newest
          saved.
        required: false
        type: string
        default: 'true'

      # --- Registry publishing ---
      snapshot_registry:
        description: >-
          Registry that receives snapshot/staging publishes, as
          host[:port] with an optional repository path. Nexus 3
          distinguishes repositories by port
          (nexus3.onap.org:10003); JFrog Artifactory's
          repository-path method puts them in the path
          (acme.jfrog.io/docker-snapshot), and its subdomain method
          in the host (docker-snapshot.acme.jfrog.io). Also the
          default registry release promotion pulls staged images
          from (a container_pull_registry field in the release file
          wins).
        required: true
        type: string
      release_registry:
        description: >-
          Registry that receives release promotions, as host[:port]
          with an optional repository path, e.g.
          nexus3.onap.org:10002 or acme.jfrog.io/docker-release. A
          container_push_registry field in the release file wins.
        required: true
        type: string
      registry_user:
        description: >-
          Registry username override; empty derives the username from
          the repository name (the 1Password credential naming
          contract)
        required: false
        type: string
        default: ''
      nexus_user:
        description: >-
          Deprecated alias for registry_user, kept working for
          callers written when this lane only spoke to Nexus. Set
          registry_user instead; supplying both uses registry_user.
        required: false
        type: string
        default: ''
      push_latest:
        description: >-
          Additionally tag promoted release images as 'latest' on the
          release registry
        required: false
        type: boolean
        default: false
      dry_run:
        description: >-
          Run the publish/promotion steps without pushing. Dry runs
          skip credential loading and registry logins entirely, so
          they also exercise the lane where no credentials exist.
        required: false
        type: boolean
        default: false

      # --- Runner hardening ---
      harden_runner_egress:
        description: "Harden-runner egress policy: 'block' or 'audit'"
        required: false
        type: string
        default: 'block'
      harden_runner_allowlist:
        description: 'Out-of-band harden-runner allow-list configuration'
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@e0e35011ee145321a51d3226f044ec88dfe645b1'  # v0.16.4
      build_permit_egress_traffic:
        description: >-
          Run harden-runner in audit mode for the build job only,
          permitting unrestricted egress. Use when base images or
          build-time dependencies come from registries/CDNs that are
          impractical to enumerate in the allow-list. Other jobs stay
          governed by harden_runner_egress; left unset, the build job
          follows it too.
        required: false
        type: boolean
        default: false

      # --- Gerrit-aware checkout (empty unless dispatched via Gerrit) ---
      gerrit_refspec:
        description: 'Gerrit refspec of the merged change'
        required: false
        type: string
        default: ''
      gerrit_project:
        description: 'Gerrit project name'
        required: false
        type: string
        default: ''
      gerrit_branch:
        description: 'Gerrit target branch'
        required: false
        type: string
        default: ''
      gerrit_revision:
        description: >-
          Immutable revision SHA of the merged change (the
          dispatcher's GERRIT_PATCHSET_REVISION). When set, content
          checkouts pin to this commit on the GitHub mirror instead
          of resolving the moving branch ref, so a queued run still
          examines the merge that dispatched it.
        required: false
        type: string
        default: ''
      gerrit_url:
        description: >-
          Gerrit server URL. Empty falls back to the GERRIT_URL repository
          variable at runtime.
        required: false
        type: string
        default: ''

    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        description: >-
          1Password service-account token used by credential-load-action
          to fetch the per-repository registry credential from the common
          per-org CI/CD vault (op://<vault>/<repository-name>/password).
          The publish jobs skip credential loading and publishing with a
          warning when unset, so PR/self-test contexts still work.
        required: false
      VAULT_MAPPING_JSON:
        description: >-
          Base64-encoded JSON mapping of organisation name to 1Password
          vault ID, keyed on github.repository_owner; consumed by
          credential-load-action to resolve the correct vault. The
          publish jobs skip credential loading and publishing with a
          warning when unset, so PR/self-test contexts still work.
        required: false

permissions: {}

jobs:
  gerrit-validate:
    name: 'Validate Gerrit Inputs'
    # Fails fast with a clear message when gerrit_refspec is set without
    # the project/branch the Gerrit checkout path also requires. The
    # build-chain root job depends on this, so invalid Gerrit inputs stop
    # the pipeline early and cleanly. This job always runs (only the
    # Gerrit validation step is conditional), so gating dependents on it
    # does not trip GitHub's "skipped need skips dependents" behaviour.
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    outputs:
      # The effective image namespace; empty for namespace_mode none
      namespace: ${{ steps.namespace.outputs.namespace }}
    steps:
      - name: 'Validate registry inputs'
        shell: bash
        env:
          SNAPSHOT_REGISTRY: ${{ inputs.snapshot_registry }}
          RELEASE_REGISTRY: ${{ inputs.release_registry }}
        run: |
          # Require host[:port] with an optional repository path: the
          # values compose image references and reach docker login,
          # docker push and crane, so schemes, credentials, query
          # strings or hostile content must stop here. The path
          # serves Artifactory's repository-path method, where the
          # repository key sits below the host rather than on a port
          # of its own as in Nexus 3.
          #
          # Path components take Docker's reference grammar: runs of
          # lowercase alphanumerics joined by a single '.' or '_',
          # exactly '__', or one or more '-'. Docker and crane reject
          # anything else when they parse the reference, so a looser
          # rule would accept a value here only to fail every publish
          # later, which is what this fail-fast check exists to
          # prevent. Verified against docker itself: 'a..b', 'a___b'
          # and 'a-_b' are refused, 'a__b' and 'a---b' are not. The
          # rule also excludes '.', '..' and trailing separators
          # without needing checks of their own.
          pattern='^[A-Za-z0-9.-]+(:[0-9]+)?'
          pattern+='(/[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*)*$'
          for registry in "${SNAPSHOT_REGISTRY}" "${RELEASE_REGISTRY}"
          do
            if [[ ! "${registry}" =~ ${pattern} ]]
            then
              echo "::error::Invalid registry input: ${registry}" \
                "(expected host[:port] with an optional repository" \
                "path of lowercase components)"
              exit 1
            fi
          done
          echo "Registry inputs validated ✅"

      - name: 'Require Gerrit project, branch and URL'
        if: inputs.gerrit_refspec != ''
        shell: bash
        env:
          GERRIT_PROJECT: ${{ inputs.gerrit_project }}
          GERRIT_BRANCH: ${{ inputs.gerrit_branch }}
          GERRIT_REVISION: ${{ inputs.gerrit_revision }}
          # yamllint disable-line rule:line-length
          GERRIT_URL: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
        run: |
          # gerrit_refspec is set, so the Gerrit checkout path runs and
          # also requires gerrit_project, gerrit_branch and a resolvable
          # Gerrit URL (the gerrit_url input or the GERRIT_URL variable).
          missing=''
          if [ -z "${GERRIT_PROJECT}" ]; then
            missing="${missing} gerrit_project"
          fi
          if [ -z "${GERRIT_BRANCH}" ]; then
            missing="${missing} gerrit_branch"
          fi
          if [ -z "${GERRIT_URL}" ]; then
            missing="${missing} gerrit_url/GERRIT_URL"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::gerrit_refspec is set but missing:${missing}"
            exit 1
          fi
          if [ -n "${GERRIT_REVISION}" ] &&
            [[ ! "${GERRIT_REVISION}" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::Invalid gerrit_revision:" \
              "${GERRIT_REVISION} (expected a commit SHA)"
            exit 1
          fi
          echo "Gerrit inputs validated ✅"

      # Resolved once here, the root every job descends from; each
      # job that names an image reads this job's namespace output
      - name: 'Resolve image namespace'
        id: namespace
        shell: bash
        env:
          NAMESPACE_MODE: ${{ inputs.namespace_mode }}
          NAMESPACE: ${{ inputs.namespace }}
          REPOSITORY: ${{ inputs.repository || github.repository }}
        run: |
          # none: no prefix; auto: the lowercased repository owner;
          # manual: the namespace input
          case "${NAMESPACE_MODE}" in
            none) namespace='' ;;
            auto) namespace="${REPOSITORY%%/*}"; namespace="${namespace,,}" ;;
            manual) namespace="${NAMESPACE}" ;;
            *)
              echo "::error::Invalid namespace_mode '${NAMESPACE_MODE}'" \
                "(expected none, auto or manual)"
              exit 1
              ;;
          esac
          if [ "${NAMESPACE_MODE}" != 'manual' ] && [ -n "${NAMESPACE}" ]
          then
            echo "::error::namespace '${NAMESPACE}' is set but" \
              "namespace_mode is '${NAMESPACE_MODE}'; set namespace_mode" \
              "to 'manual' or clear namespace"
            exit 1
          fi
          if [ "${NAMESPACE_MODE}" = 'manual' ] && [ -z "${NAMESPACE}" ]; then
            echo "::error::namespace_mode 'manual' requires the namespace input"
            exit 1
          fi
          # Docker's repository path grammar: '/'-separated components,
          # each runs of lowercase alphanumerics joined by a single '.'
          # or '_', exactly '__', or one or more '-'
          component='[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*'
          if [ -n "${namespace}" ] &&
            [[ ! "${namespace}" =~ ^${component}(/${component})*$ ]]; then
            echo "::error::Invalid namespace '${namespace}'" \
              "(namespace_mode ${NAMESPACE_MODE}): expected '/'-separated" \
              "components of lowercase alphanumerics joined by a single" \
              "'.' or '_', exactly '__', or one or more '-'"
            exit 1
          fi
          echo "namespace=${namespace}" >> "${GITHUB_OUTPUT}"
          echo "Image namespace (${NAMESPACE_MODE}): ${namespace:-<none>} ✅"

  repository-metadata:
    name: 'Repository Metadata'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 'Gather repository metadata'
        id: repo-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/repository-metadata-action@847400e0d0b34cc88a572fa9575accd80401b796  # v0.3.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: 'true'
          gerrit_summary: ${{ inputs.gerrit_refspec != '' }}
          artifact_upload: 'true'
          artifact_formats: 'json'

  docker-metadata:
    name: 'Docker Metadata'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    outputs:
      images_json: ${{ steps.discover.outputs.images_json }}
      image_count: ${{ steps.discover.outputs.image_count }}
      build_id: ${{ steps.discover.outputs.build_id }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # A supplied gerrit_revision pins the checkout to the immutable
      # merged commit on the GitHub mirror (standard checkout below);
      # the Gerrit checkout path resolves the moving branch ref and
      # only serves callers that cannot supply the revision
      - name: 'Checkout Gerrit change'
        # yamllint disable-line rule:line-length
        if: inputs.gerrit_refspec != '' && inputs.gerrit_revision == ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        if: inputs.gerrit_refspec == '' || inputs.gerrit_revision != ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.gerrit_revision || inputs.ref }}
          persist-credentials: false

      # An explicit 'images' input wins; otherwise the action walks
      # the estate-observed Dockerfile locations, keeping discovery
      # order as build order. It also draws the per-invocation
      # build_id that names this run's artifacts.
      - name: 'Discover images'
        id: discover
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/docker-build-matrix-action@2c0b0496c460cd9d1405352476e77c913964507e  # v0.0.1
        with:
          path_prefix: ${{ inputs.path_prefix }}
          images: ${{ inputs.images }}
          repository: ${{ inputs.repository || github.repository }}
          # Bind ref to this job's effective checkout ref, so the
          # build id discriminates on the tree actually discovered.
          # This lane prefers the immutable Gerrit patchset revision
          # when a caller supplies one, matching its checkout step.
          ref: ${{ inputs.gerrit_revision || inputs.ref }}
          gerrit_refspec: ${{ inputs.gerrit_refspec }}
          image_namespace: ${{ needs.gerrit-validate.outputs.namespace }}
          # With build_command set, an empty discovery is not an
          # error: the build job enumerates what the command created
          build_command: ${{ inputs.build_command }}
          build_command_images: ${{ inputs.build_command_images }}

  resolve-version:
    name: 'Resolve Version'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    outputs:
      # yamllint disable-line rule:line-length
      version: ${{ steps.build-metadata.outputs.version_properties_version }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # A supplied gerrit_revision pins the checkout to the immutable
      # merged commit on the GitHub mirror (standard checkout below);
      # the Gerrit checkout path resolves the moving branch ref and
      # only serves callers that cannot supply the revision
      - name: 'Checkout Gerrit change'
        # yamllint disable-line rule:line-length
        if: inputs.gerrit_refspec != '' && inputs.gerrit_revision == ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        if: inputs.gerrit_refspec == '' || inputs.gerrit_revision != ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.gerrit_revision || inputs.ref }}
          persist-credentials: false

      # version.properties (the Jenkins/global-jjb heritage version
      # source, present at the root of 110 LF project repositories)
      # remains mandatory for the merge workflow. The
      # build-metadata-action parses it (never sourcing it, and
      # skipping Jenkins-era ${...} interpolated values), so no
      # version extraction logic lives in workflow shell code.
      - name: 'Gather version metadata'
        id: build-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/build-metadata-action@ef53139abdf48a63b097efc740202c140571b0d4  # v0.8.3
        with:
          path_prefix: ${{ inputs.path_prefix }}
          artifact_upload: 'false'

      - name: 'Require version.properties version'
        env:
          # yamllint disable-line rule:line-length
          PROPS_VERSION: ${{ steps.build-metadata.outputs.version_properties_version }}
        shell: bash
        run: |
          # Fail fast unless version.properties supplied a full X.Y.Z
          # numeric version: the merge workflow requires one, and the
          # guard keeps malformed content out of downstream jobs
          if [ -z "${PROPS_VERSION}" ]; then
            echo "::error::No version resolved from" \
              "version.properties; the merge workflow requires one"
            exit 1
          fi
          if [[ ! "${PROPS_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version resolved: ${PROPS_VERSION}"
            exit 1
          fi
          echo "Resolved version: ${PROPS_VERSION}"

  build:
    name: 'Docker Build'
    needs: ['gerrit-validate', 'docker-metadata']
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.build.outputs.images }}
      image_count: ${{ steps.build.outputs.image_count }}
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    steps:
      # The build job can opt into audit egress independently of the
      # other jobs via build_permit_egress_traffic, for base images and
      # build-time dependencies from registries/CDNs impractical to
      # enumerate in the allow-list. Left unset it follows
      # harden_runner_egress like every other job.
      #
      # One harden-runner step with the policy computed, rather than
      # two selected by condition: harden-runner declares a 'pre'
      # entry point and no 'pre-if', so its pre-phase runs whatever a
      # step-level 'if:' says. Both would engage the agent, the first
      # would win, and audit mode would be unreachable.
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ (inputs.build_permit_egress_traffic || inputs.harden_runner_egress == 'audit') && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # A supplied gerrit_revision pins the checkout to the immutable
      # merged commit on the GitHub mirror (standard checkout below);
      # the Gerrit checkout path resolves the moving branch ref and
      # only serves callers that cannot supply the revision
      - name: 'Checkout Gerrit change'
        # yamllint disable-line rule:line-length
        if: inputs.gerrit_refspec != '' && inputs.gerrit_revision == ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        if: inputs.gerrit_refspec == '' || inputs.gerrit_revision != ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.gerrit_revision || inputs.ref }}
          persist-credentials: false

      # Builds each image, in order, into the daemon as
      # [<namespace>/]<name>:verify (plus the plain <name>:verify
      # alias), so a same-repository FROM chain resolves against the
      # image built just before it; local tags never publish, as
      # snapshot-publish retags from the archives. The action sets up
      # buildx with the docker driver for that reason: the default
      # docker-container driver cannot see an image --load'ed by the
      # previous build. build_command replaces the Dockerfile builds
      # with the project's own tooling, and the action works out
      # which images it produced, or takes build_command_images as
      # the answer. build_permit_fail stays unset: a publish lane must
      # never publish a partial image set, so any failure fails here.
      - name: 'Build images'
        id: build
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/docker-build-images-action@805ce3551121c2e57f62d472fe225a0976bf5801  # v0.0.1
        with:
          images: ${{ needs.docker-metadata.outputs.images_json }}
          path_prefix: ${{ inputs.path_prefix }}
          image_namespace: ${{ needs.gerrit-validate.outputs.namespace }}
          build_command: ${{ inputs.build_command }}
          build_command_images: ${{ inputs.build_command_images }}

      - name: 'Save image archives'
        shell: bash
        env:
          IMAGES: ${{ steps.build.outputs.images }}
        run: |
          # Export each built image to a docker archive so
          # snapshot-publish pushes the exact bits built here.
          # Collision-safe archive names: the character mapping
          # alone is not injective (team/api:v1 and team_api:v1
          # both map to team_api_v1), so a short hash of the full
          # tag disambiguates and no docker save overwrites another
          mkdir -p /tmp/docker-archives
          while IFS= read -r tag; do
            safe=$(tr '/:' '__' <<< "${tag}")
            suffix=$(sha256sum <<< "${tag}" | cut -c1-8)
            docker save "${tag}" \
              -o "/tmp/docker-archives/${safe}-${suffix}.tar"
          done < <(jq -r '.[]' <<< "${IMAGES}")

      - name: 'Upload image archives'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: docker-archives-${{ needs.docker-metadata.outputs.build_id }}
          path: /tmp/docker-archives/
          retention-days: 1
          if-no-files-found: error

  tests:
    name: 'Tests'
    runs-on: ubuntu-latest
    needs: ['build', 'docker-metadata']
    # No image_count guard, unlike build-test.yaml: this lane has no
    # build_permit_fail, and its build job fails when it saves no
    # archive, so a successful build always leaves images to test.
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # Same checkout as the build job, so the test hook runs against
      # the tree that produced the images
      - name: 'Checkout Gerrit change'
        # yamllint disable-line rule:line-length
        if: inputs.gerrit_refspec != '' && inputs.gerrit_revision == ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        if: inputs.gerrit_refspec == '' || inputs.gerrit_revision != ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.gerrit_revision || inputs.ref }}
          persist-credentials: false

      - name: 'Download image archives'
        if: inputs.test_command != ''
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: docker-archives-${{ needs.docker-metadata.outputs.build_id }}
          path: /tmp/docker-archives

      - name: 'Run tests'
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
          TEST_COMMAND: ${{ inputs.test_command }}
          IMAGES: ${{ needs.build.outputs.images }}
          # The NO_BLOCK/soft-fail pattern: the test_permit_fail input
          # (or, when unset, the NO_BLOCK_AUDIT_FAIL repository
          # variable) disables failure propagation.
          # yamllint disable-line rule:line-length
          NO_BLOCK: ${{ inputs.test_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
        run: |
          # Load the built images and run the caller's test hook; the
          # IMAGES environment variable carries the built tag list.
          if [ -z "${TEST_COMMAND}" ]; then
            echo "::notice::No test_command provided; nothing to run"
            exit 0
          fi
          # nullglob: a missing/empty artifact must fail with a clear
          # message, not a literal-glob docker load error.
          shopt -s nullglob
          archives=(/tmp/docker-archives/*.tar)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::No image archives found to load"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            docker load -i "${archive}"
          done
          cd "${PATH_PREFIX}"
          status=0
          bash -e -c "${TEST_COMMAND}" || status=$?
          if [ "${status}" != "0" ]; then
            if [ "${NO_BLOCK}" = "true" ]; then
              echo "::warning::Tests failed, but failures are" \
                "permitted so the job will not fail."
              exit 0
            fi
            exit "${status}"
          fi

  dockerfile-lint:
    name: 'Dockerfile Lint'
    runs-on: ubuntu-latest
    needs: 'docker-metadata'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.docker-metadata.result == 'success' && inputs.lint_enabled }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # Same checkout as the build job, so lint covers the
      # Dockerfiles that produced the images
      - name: 'Checkout Gerrit change'
        # yamllint disable-line rule:line-length
        if: inputs.gerrit_refspec != '' && inputs.gerrit_revision == ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        if: inputs.gerrit_refspec == '' || inputs.gerrit_revision != ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.gerrit_revision || inputs.ref }}
          persist-credentials: false

      - name: 'Lint Dockerfiles (hadolint)'
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
          IMAGES_JSON: ${{ needs.docker-metadata.outputs.images_json }}
          # Digest-pinned hadolint container; docker.io serves it and
          # sits in the egress allow-list.
          # yamllint disable-line rule:line-length
          HADOLINT_IMAGE: 'hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d'
          # The NO_BLOCK/soft-fail pattern: the lint_permit_fail input
          # (or its deprecated audit_permit_fail alias)
          # (or, when unset, the NO_BLOCK_AUDIT_FAIL repository
          # variable) disables failure propagation.
          # yamllint disable-line rule:line-length
          NO_BLOCK: ${{ inputs.lint_permit_fail || inputs.audit_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
        run: |
          # Lint exactly the Dockerfiles the build consumes (from the
          # resolved image list), so per-image dockerfile overrides
          # and non-standard filenames stay covered. The resolved
          # paths are relative to path_prefix (discovery runs there).
          cd "${PATH_PREFIX}"
          status=0
          while IFS= read -r dockerfile; do
            echo "::group::hadolint ${dockerfile}"
            docker run --rm \
              -v "${PWD}:/mnt:ro" -w /mnt \
              "${HADOLINT_IMAGE}" \
              hadolint "${dockerfile}" || status=1
            echo "::endgroup::"
          done < <(jq -r '.[] | .dockerfile //
            (.context + "/Dockerfile")' <<< "${IMAGES_JSON}")
          if [ "${status}" = "0" ]; then
            echo "Dockerfile lint passed ✅"
            exit 0
          fi
          if [ "${NO_BLOCK}" = "true" ]; then
            echo "::warning::hadolint reported findings, but failures" \
              "are permitted so the job will not fail."
            exit 0
          fi
          echo "::error::hadolint reported findings"
          exit 1

  sbom:
    name: 'Image SBOM'
    runs-on: ubuntu-latest
    needs: ['build', 'docker-metadata']
    # As for the tests job: a successful build always leaves archives.
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.sbom_enabled }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download image archives'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: docker-archives-${{ needs.docker-metadata.outputs.build_id }}
          # Image mode only reads archives inside the workspace or
          # RUNNER_TEMP, so they land under runner.temp, not /tmp
          path: ${{ runner.temp }}/docker-archives

      # One CycloneDX SBOM per image archive, named
      # sbom-cyclonedx-<archive-basename>.json; the Grype job scans
      # every one. An empty archive directory fails the step.
      # sbom_spec_version 1.7 keeps the spec the inline syft call
      # wrote by default.
      - name: 'Generate image SBOMs'
        id: sbom
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/sbom-action@398aec0a5f332a0414246a6d9d45678ef4a95e98  # v0.3.0
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/docker-archives
          sbom_format: json
          sbom_spec_version: '1.7'

      # Kept as a run artefact for the 45 days the scan results
      # stay, so the SBOMs of the staged bits outlive the run's
      # short-lived image archives.
      - name: 'Upload SBOM artifacts'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-files-${{ needs.docker-metadata.outputs.build_id }}
          path: sbom-cyclonedx-*.json
          retention-days: 45
          # Fail fast: the downstream Grype job requires this artifact,
          # so a missing/misnamed SBOM must surface here, not later
          if-no-files-found: error

  grype:
    name: 'Grype Audit SBOM'
    runs-on: ubuntu-latest
    needs: ['sbom', 'docker-metadata']
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.sbom.result == 'success' && inputs.grype_enabled }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download SBOM artefact'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom-files-${{ needs.docker-metadata.outputs.build_id }}

      # The grype_permit_fail input (or, when unset, the NO_BLOCK_AUDIT_FAIL
      # repository variable) disables failure propagation so staging
      # can proceed when blocked by newly discovered CVEs in base images
      # or transitive dependencies.
      - name: 'Grype audit SBOMs'
        id: grype-audit
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@ee8d637c2324bbb84ae583abc95b56c9c4d078ee  # v0.1.0
        with:
          sbom: 'sbom-cyclonedx-*.json'
          fail-on: ${{ inputs.grype_fail_on }}
          # yamllint disable-line rule:line-length
          permit-fail: ${{ inputs.grype_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
          # yamllint disable-line rule:line-length
          artifact-name: grype-scan-results-${{ needs.docker-metadata.outputs.build_id }}
          retention-days: '45'
          cache-db: ${{ inputs.grype_cache_db }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  snapshot-publish:
    name: 'Publish Snapshot'
    runs-on: ubuntu-latest
    # Gate, then stage: a snapshot tag is a promotable candidate, so
    # every gate must pass before anything publishes.
    #
    # A skipped gate is accepted ONLY when an input explains it, as
    # in build-test-release.yaml's tests job. A bare 'skipped' is
    # ambiguous: grype also skips when the sbom job FAILS, and
    # accepting that would stage images no scan examined. sbom is a
    # direct dependency for the same reason: with grype_enabled
    # false, an SBOM failure would otherwise pass unseen.
    #
    # tests carries no toggle: it runs whenever build succeeds and
    # passes with a notice when test_command is empty, so only its
    # success admits a publish.
    #
    # The explicit !cancelled() matters as well: a skipped job taints
    # every job downstream of it unless that job sets its own
    # status check, which is how disabled audits once stranded
    # build-test-release.yaml's promotion (#90).
    needs:
      - 'gerrit-validate'
      - 'resolve-version'
      - 'docker-metadata'
      - 'build'
      - 'tests'
      - 'dockerfile-lint'
      - 'sbom'
      - 'grype'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.resolve-version.result == 'success' && needs.build.result == 'success' && needs.tests.result == 'success' && (needs.dockerfile-lint.result == 'success' || (needs.dockerfile-lint.result == 'skipped' && !inputs.lint_enabled)) && (needs.sbom.result == 'success' || (needs.sbom.result == 'skipped' && !inputs.sbom_enabled)) && (needs.grype.result == 'success' || (needs.grype.result == 'skipped' && (!inputs.grype_enabled || !inputs.sbom_enabled))) }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # Publishing pushes the build job's archives — the exact bits
      # the build produced — rather than rebuilding, so what publishes
      # is what built.
      - name: 'Download image archives'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: docker-archives-${{ needs.docker-metadata.outputs.build_id }}
          path: /tmp/docker-archives

      # The credential secrets stay optional so PR/self-test contexts
      # can exercise the pipeline; when absent the publish steps skip
      # with a warning rather than failing. A dry run skips credential
      # loading and login entirely and still exercises the tagging.
      - name: 'Check publish credentials'
        id: creds
        shell: bash
        env:
          # yamllint disable-line rule:line-length
          HAS_CREDENTIALS: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' && secrets.VAULT_MAPPING_JSON != '' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Gate publishing on credential availability
          if [ "${DRY_RUN}" = 'true' ]; then
            echo "Dry run: skipping credential loading and login"
            echo "available=false" >> "$GITHUB_OUTPUT"
          elif [ "${HAS_CREDENTIALS}" = 'true' ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::OP_SERVICE_ACCOUNT_TOKEN and/or" \
              "VAULT_MAPPING_JSON unavailable; skipping publish"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Resolve registry username and login endpoint'
        id: publish-params
        if: steps.creds.outputs.available == 'true'
        shell: bash
        env:
          REGISTRY_USER_INPUT: ${{ inputs.registry_user }}
          NEXUS_USER_INPUT: ${{ inputs.nexus_user }}
          # The repository actually checked out/published, which can
          # differ from GITHUB_REPOSITORY for cross-repository calls
          TARGET_REPOSITORY: ${{ inputs.repository || github.repository }}
          SNAPSHOT_REGISTRY: ${{ inputs.snapshot_registry }}
        run: |
          # 1Password credential naming contract: the credential (and
          # username) take the name of the repository being published
          # (the checked-out repository, not necessarily the caller)
          registry_user="${REGISTRY_USER_INPUT}"
          if [ -z "${registry_user}" ] &&
            [ -n "${NEXUS_USER_INPUT}" ]; then
            echo "::warning::The nexus_user input is deprecated;" \
              "use registry_user instead"
            registry_user="${NEXUS_USER_INPUT}"
          fi
          if [ -z "${registry_user}" ]; then
            registry_user="${TARGET_REPOSITORY##*/}"
          fi
          # The credential item always keys on the published
          # repository's name (registry_user overrides the login
          # username only), so cross-repository calls load the
          # target's item rather than the caller's
          credential_name="${TARGET_REPOSITORY##*/}"
          # Both values reach $GITHUB_OUTPUT, where a line break
          # would append a record of its own, so each is constrained
          # rather than merely escaped. The username admits '@' and
          # '+' as well: registry accounts genuinely use them, since
          # Artifactory SaaS identities are commonly email addresses,
          # and the value only travels to docker login. The
          # credential name keys a 1Password item and derives from a
          # repository name, so it keeps the tighter set.
          if [[ ! "${registry_user}" =~ ^[A-Za-z0-9._@+-]+$ ]]; then
            echo "::error::Invalid registry username:" \
              "${registry_user}"
            exit 1
          fi
          if [[ ! "${credential_name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid credential name:" \
              "${credential_name}"
            exit 1
          fi
          # docker login takes an endpoint, not an image reference. A
          # repository path belongs to the reference and authenticates
          # against the host serving it, which is how Artifactory's
          # repository-path method works; Nexus 3 encodes the
          # repository in the port, so there the whole value stays.
          login_endpoint="${SNAPSHOT_REGISTRY%%/*}"
          echo "Registry login endpoint: ${login_endpoint}"
          {
            echo "registry_user=${registry_user}"
            echo "credential_name=${credential_name}"
            echo "login_endpoint=${login_endpoint}"
          } >> "$GITHUB_OUTPUT"

      # credential_grants_json wires the admin-managed
      # CREDENTIAL_LOAD_GRANTS repository/organisation variable in at
      # the workflow layer: composite actions cannot read vars, and the
      # grants list must never become a caller-facing input.
      - name: 'Load registry credential'
        id: load-credential
        if: steps.creds.outputs.available == 'true'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/credential-load-action@025002b47f4302fb7252175c470da69435060176  # v2.0.4
        with:
          # yamllint disable-line rule:line-length
          op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          vault_mapping_json: ${{ secrets.VAULT_MAPPING_JSON }}
          # yamllint disable-line rule:line-length
          credential_name: ${{ steps.publish-params.outputs.credential_name }}
          credential_grants_json: ${{ vars.CREDENTIAL_LOAD_GRANTS }}
          export_env: 'false'

      - name: 'Login to snapshot registry'
        if: steps.creds.outputs.available == 'true'
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ steps.publish-params.outputs.login_endpoint }}
          username: ${{ steps.publish-params.outputs.registry_user }}
          password: ${{ steps.load-credential.outputs.credential }}

      # Snapshot publishes skip release-grade signing/provenance by
      # design: the LF Nexus 3 registries lack dependable OCI
      # referrer/attestation support (docs/BRIEF.md section 5.4), and
      # snapshot tags are transient.
      - name: 'Publish snapshot/staging tags'
        # yamllint disable-line rule:line-length
        if: steps.creds.outputs.available == 'true' || inputs.dry_run
        shell: bash
        env:
          IMAGES: ${{ needs.build.outputs.images }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          SNAPSHOT_REGISTRY: ${{ inputs.snapshot_registry }}
          IMAGE_NAMESPACE: ${{ needs.gerrit-validate.outputs.namespace }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Retag the built images with the LF snapshot/staging tag
          # set and push each to the snapshot registry. One timestamp
          # per run: every image in a merge shares the promotable tag,
          # which is what container release files reference.
          shopt -s nullglob
          archives=(/tmp/docker-archives/*.tar)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::No image archives found to publish"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            docker load -i "${archive}"
          done
          timestamp=$(date -u '+%Y%m%dT%H%M%SZ')
          major_minor="${VERSION%.*}"
          declare -a pushed=() sources=() names=()
          declare -A seen_names=()
          # A registry's own path counts towards the 255-character
          # repository limit; its host does not.
          prefix=""
          if [[ "${SNAPSHOT_REGISTRY}" == */* ]]; then
            prefix="${SNAPSHOT_REGISTRY#*/}/"
          fi
          # Two phases, as in promotion: every publish path is resolved
          # and checked before anything is tagged or pushed, so a
          # collision or overlong path pushes nothing.
          while IFS= read -r local_tag; do
            # Strip the tag (the last colon-suffix) rather than the
            # first colon match: build_command-produced tags can
            # carry a registry:port prefix. A first component is a
            # registry host, and dropped, by Docker's rule: it holds
            # '.', ':' or an uppercase letter, or is localhost.
            repo="${local_tag%:*}"
            first="${repo%%/*}"
            if [[ "${repo}" == */* && ( "${first}" == *[.:]* ||
              "${first}" == *[[:upper:]]* ||
              "${first}" == localhost ) ]]; then
              repo="${repo#*/}"
            fi
            # The publish path keeps sub-paths and takes the namespace
            # exactly as promotion resolves a release-file name, so
            # so/sdnc-adapter stages at <ns>/so/sdnc-adapter, where
            # promotion pulls it. The build action's load-mode tags
            # already carry the namespace and stay as they are.
            name="${repo}"
            if [[ -n "${IMAGE_NAMESPACE}" &&
              "${repo}" != "${IMAGE_NAMESPACE}/"* ]]; then
              name="${IMAGE_NAMESPACE}/${repo}"
            fi
            # Deduplicate identical images (one image carrying several
            # local tags) and fail on distinct images that resolve
            # to the same publish path.
            image_id=$(docker image inspect \
              --format '{{.Id}}' "${local_tag}")
            if [ -n "${seen_names[${name}]:-}" ]; then
              if [ "${seen_names[${name}]}" = "${image_id}" ]; then
                echo "::notice::Skipping ${local_tag}: the image" \
                  "already published as '${name}'"
                continue
              fi
              echo "::error::Multiple distinct images map to the" \
                "publish name '${name}'; rename the images or" \
                "declare them via the images input"
              exit 1
            fi
            seen_names[${name}]="${image_id}"
            if [ $((${#prefix} + ${#name})) -gt 255 ]; then
              echo "::error::Repository path '${prefix}${name}'" \
                "exceeds 255 characters"
              exit 1
            fi
            sources+=("${local_tag}")
            names+=("${name}")
          done < <(jq -r '.[]' <<< "${IMAGES}")
          for i in "${!names[@]}"; do
            target="${SNAPSHOT_REGISTRY}/${names[i]}"
            for tag in \
              "${VERSION}-SNAPSHOT-latest" \
              "${major_minor}-STAGING-latest" \
              "${VERSION}-${timestamp}"; do
              docker tag "${sources[i]}" "${target}:${tag}"
              if [ "${DRY_RUN}" = 'true' ]; then
                echo "Dry run: would push ${target}:${tag}"
              else
                echo "::group::Push ${target}:${tag}"
                docker push "${target}:${tag}"
                echo "::endgroup::"
              fi
              pushed+=("${target}:${tag}")
            done
          done
          {
            echo "## Snapshot Publish"
            echo ""
            if [ "${DRY_RUN}" = 'true' ]; then
              echo "Dry run: **${#pushed[@]}** tag(s) computed," \
                "nothing pushed"
            else
              echo "Pushed **${#pushed[@]}** tag(s):"
            fi
            echo ""
            printf -- "- \`%s\`\n" "${pushed[@]}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  check-release:
    name: 'Check for Release File'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    outputs:
      has_release: ${{ steps.detect.outputs.has_release }}
      version: ${{ steps.detect.outputs.version }}
      containers_json: ${{ steps.detect.outputs.containers_json }}
      pull_registry: ${{ steps.detect.outputs.pull_registry }}
      push_registry: ${{ steps.detect.outputs.push_registry }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # On Gerrit change-merged dispatches GERRIT_REFSPEC is the branch
      # ref (refs/heads/<branch>), so both checkout paths land on the
      # merged commit. Both checkouts fetch depth 2: the detect action
      # compares HEAD with its first parent and fails on a checkout
      # too shallow to hold it.
      # A supplied gerrit_revision pins the checkout to the immutable
      # merged commit on the GitHub mirror (standard checkout below);
      # the Gerrit checkout path resolves the moving branch ref and
      # only serves callers that cannot supply the revision
      - name: 'Checkout Gerrit change'
        # yamllint disable-line rule:line-length
        if: inputs.gerrit_refspec != '' && inputs.gerrit_revision == ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          fetch-depth: '2'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        if: inputs.gerrit_refspec == '' || inputs.gerrit_revision != ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.gerrit_revision || inputs.ref }}
          fetch-depth: 2
          persist-credentials: false

      # Container release detection: the merged commit adds a release
      # file under releases/ with distribution_type: container, naming
      # previously staged name:version pairs and the release tag they
      # promote to (the LF self-release container schema). Release
      # files with other distribution types (e.g. maven) belong to
      # other pipelines and are ignored. Unquoted numeric versions
      # are read literally (numeric_versions: literal, the default).
      - name: 'Detect container release file in merged commit'
        id: detect
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/docker-release-detect-action@bd5ea8d531f49d5eabbaa9e7a58447654c07fd34  # v0.0.1
        with:
          snapshot_registry: ${{ inputs.snapshot_registry }}
          release_registry: ${{ inputs.release_registry }}

  # Registry-side promotion: crane copies the staged name:version
  # images named by the release file to the release registry at the
  # release tag, preserving multi-architecture manifests. No rebuild
  # occurs — the staged images were built and published by the merge
  # that staged them — so this job deliberately does not depend on
  # this run's build.
  release-publish:
    name: 'Promote Release'
    runs-on: ubuntu-latest
    needs:
      - 'gerrit-validate'
      - 'check-release'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.check-release.outputs.has_release == 'true' }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # The credential secrets stay optional so PR/self-test contexts
      # can exercise the pipeline; when absent the promotion steps
      # skip with a warning rather than failing. A dry run skips
      # credential loading and login entirely.
      - name: 'Check publish credentials'
        id: creds
        shell: bash
        env:
          # yamllint disable-line rule:line-length
          HAS_CREDENTIALS: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' && secrets.VAULT_MAPPING_JSON != '' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Gate promotion on credential availability
          if [ "${DRY_RUN}" = 'true' ]; then
            echo "Dry run: skipping credential loading and login"
            echo "available=false" >> "$GITHUB_OUTPUT"
          elif [ "${HAS_CREDENTIALS}" = 'true' ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::OP_SERVICE_ACCOUNT_TOKEN and/or" \
              "VAULT_MAPPING_JSON unavailable; skipping promotion"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Resolve registry username and login endpoints'
        id: publish-params
        if: steps.creds.outputs.available == 'true'
        shell: bash
        env:
          REGISTRY_USER_INPUT: ${{ inputs.registry_user }}
          NEXUS_USER_INPUT: ${{ inputs.nexus_user }}
          # The repository actually checked out/published, which can
          # differ from GITHUB_REPOSITORY for cross-repository calls
          TARGET_REPOSITORY: ${{ inputs.repository || github.repository }}
          # yamllint disable-line rule:line-length
          PULL_REGISTRY: ${{ needs.check-release.outputs.pull_registry || inputs.snapshot_registry }}
          # yamllint disable-line rule:line-length
          PUSH_REGISTRY: ${{ needs.check-release.outputs.push_registry || inputs.release_registry }}
        run: |
          # 1Password credential naming contract: the credential (and
          # username) take the name of the repository being published
          # (the checked-out repository, not necessarily the caller)
          registry_user="${REGISTRY_USER_INPUT}"
          if [ -z "${registry_user}" ] &&
            [ -n "${NEXUS_USER_INPUT}" ]; then
            echo "::warning::The nexus_user input is deprecated;" \
              "use registry_user instead"
            registry_user="${NEXUS_USER_INPUT}"
          fi
          if [ -z "${registry_user}" ]; then
            registry_user="${TARGET_REPOSITORY##*/}"
          fi
          # The credential item always keys on the published
          # repository's name (registry_user overrides the login
          # username only), so cross-repository calls load the
          # target's item rather than the caller's
          credential_name="${TARGET_REPOSITORY##*/}"
          # Both values reach $GITHUB_OUTPUT, where a line break
          # would append a record of its own, so each is constrained
          # rather than merely escaped. The username admits '@' and
          # '+' as well: registry accounts genuinely use them, since
          # Artifactory SaaS identities are commonly email addresses,
          # and the value only travels to docker login. The
          # credential name keys a 1Password item and derives from a
          # repository name, so it keeps the tighter set.
          if [[ ! "${registry_user}" =~ ^[A-Za-z0-9._@+-]+$ ]]; then
            echo "::error::Invalid registry username:" \
              "${registry_user}"
            exit 1
          fi
          if [[ ! "${credential_name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid credential name:" \
              "${credential_name}"
            exit 1
          fi
          # docker login takes an endpoint, not an image reference. A
          # repository path belongs to the reference and authenticates
          # against the host serving it, which is how Artifactory's
          # repository-path method works; Nexus 3 encodes the
          # repository in the port, so there the whole value stays.
          # crane reads the docker config these logins write.
          pull_endpoint="${PULL_REGISTRY%%/*}"
          push_endpoint="${PUSH_REGISTRY%%/*}"
          echo "Pull login endpoint: ${pull_endpoint}"
          echo "Push login endpoint: ${push_endpoint}"
          {
            echo "registry_user=${registry_user}"
            echo "credential_name=${credential_name}"
            echo "pull_endpoint=${pull_endpoint}"
            echo "push_endpoint=${push_endpoint}"
          } >> "$GITHUB_OUTPUT"

      - name: 'Load registry credential'
        id: load-credential
        if: steps.creds.outputs.available == 'true'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/credential-load-action@025002b47f4302fb7252175c470da69435060176  # v2.0.4
        with:
          # yamllint disable-line rule:line-length
          op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          vault_mapping_json: ${{ secrets.VAULT_MAPPING_JSON }}
          # yamllint disable-line rule:line-length
          credential_name: ${{ steps.publish-params.outputs.credential_name }}
          credential_grants_json: ${{ vars.CREDENTIAL_LOAD_GRANTS }}
          export_env: 'false'

      # The same per-repository credential authenticates both
      # registries (the LF Nexus 3 snapshot/release registries share
      # a credential realm, as do the repositories of one Artifactory
      # instance); crane reads the docker config both logins write.
      # Release-file registry overrides must stay within that realm —
      # promotion to registries with separate credentials (e.g.
      # docker.io) remains with the LF release-engineering tooling
      # for now.
      - name: 'Login to pull registry'
        if: steps.creds.outputs.available == 'true'
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ steps.publish-params.outputs.pull_endpoint }}
          username: ${{ steps.publish-params.outputs.registry_user }}
          password: ${{ steps.load-credential.outputs.credential }}
      - name: 'Login to push registry'
        if: steps.creds.outputs.available == 'true'
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ steps.publish-params.outputs.push_endpoint }}
          username: ${{ steps.publish-params.outputs.registry_user }}
          password: ${{ steps.load-credential.outputs.credential }}

      - name: 'Set up crane'
        if: steps.creds.outputs.available == 'true'
        # yamllint disable-line rule:line-length
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b  # v0.7

      - name: 'Promote staged images'
        # yamllint disable-line rule:line-length
        if: steps.creds.outputs.available == 'true' || inputs.dry_run
        shell: bash
        env:
          CONTAINERS: ${{ needs.check-release.outputs.containers_json }}
          RELEASE_TAG: ${{ needs.check-release.outputs.version }}
          # yamllint disable-line rule:line-length
          PULL_REGISTRY: ${{ needs.check-release.outputs.pull_registry || inputs.snapshot_registry }}
          # yamllint disable-line rule:line-length
          PUSH_REGISTRY: ${{ needs.check-release.outputs.push_registry || inputs.release_registry }}
          IMAGE_NAMESPACE: ${{ needs.gerrit-validate.outputs.namespace }}
          PUSH_LATEST: ${{ inputs.push_latest }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Registry-side promotion of every container named by the
          # release file: staged <ns>/name:version on the pull
          # registry copies to <ns>/name:release-tag on the push
          # registry, whichever registries the release file chose.
          # Release-file names are relative to the namespace (ONAP's
          # carry no onap/ prefix, some carry sub-paths such as
          # so/sdnc-adapter), matching global-jjb's release-job.sh
          # <registry>/<umbrella>/<name>, and the snapshot publish
          # above namespaces the same way. crane copies manifests
          # as-is, so multi-architecture manifest lists survive the
          # promotion. Three phases: every final path is resolved and
          # checked before anything copies, every copy completes
          # before any mutable latest tag moves, so a failing copy
          # never leaves a partially-latest release.
          declare -a promoted=() paths=() versions=()
          declare -A seen=()
          # A registry's own path counts towards the 255-character
          # repository limit; its host does not.
          repo_prefix() {
            if [[ "$1" == */* ]]; then echo "${1#*/}/"; fi
          }
          pull_prefix=$(repo_prefix "${PULL_REGISTRY}")
          push_prefix=$(repo_prefix "${PUSH_REGISTRY}")
          longest=$((${#pull_prefix} > ${#push_prefix} \
            ? ${#pull_prefix} : ${#push_prefix}))
          while IFS= read -r container; do
            name=$(jq -r '.name' <<< "${container}")
            version=$(jq -r '.version' <<< "${container}")
            path="${name}"
            if [[ -n "${IMAGE_NAMESPACE}" &&
              "${name}" == "${IMAGE_NAMESPACE}/"* ]]; then
              echo "::notice::Release-file name '${name}' already" \
                "starts with '${IMAGE_NAMESPACE}/' and is kept as-is;" \
                "names are relative to the namespace, so it is" \
                "probably double-prefixed"
            elif [ -n "${IMAGE_NAMESPACE}" ]; then
              path="${IMAGE_NAMESPACE}/${name}"
            fi
            # Names unique in the release file can still collide once
            # namespaced ('foo' and '<ns>/foo'): the second copy would
            # overwrite the first at the same release tag.
            if [ -n "${seen[${path}]:-}" ]; then
              echo "::error::Release-file names '${seen[${path}]}'" \
                "and '${name}' both promote to '${path}'"
              exit 1
            fi
            seen[${path}]="${name}"
            if [ $((longest + ${#path})) -gt 255 ]; then
              echo "::error::Repository path '${path}' exceeds 255" \
                "characters with the registry path"
              exit 1
            fi
            paths+=("${path}")
            versions+=("${version}")
          done < <(jq -c '.[]' <<< "${CONTAINERS}")
          for i in "${!paths[@]}"; do
            src="${PULL_REGISTRY}/${paths[i]}:${versions[i]}"
            dst="${PUSH_REGISTRY}/${paths[i]}:${RELEASE_TAG}"
            if [ "${DRY_RUN}" = 'true' ]; then
              echo "Dry run: would copy ${src} -> ${dst}"
            else
              echo "::group::Promote ${src} -> ${dst}"
              crane copy "${src}" "${dst}"
              echo "::endgroup::"
            fi
            promoted+=("${dst}")
          done
          if [ "${PUSH_LATEST}" = 'true' ]; then
            for path in "${paths[@]}"; do
              dst="${PUSH_REGISTRY}/${path}:${RELEASE_TAG}"
              if [ "${DRY_RUN}" = 'true' ]; then
                echo "Dry run: would tag ${dst} as latest"
              else
                crane tag "${dst}" latest
              fi
              promoted+=("${PUSH_REGISTRY}/${path}:latest")
            done
          fi
          {
            echo "## Release Promotion"
            echo ""
            if [ "${DRY_RUN}" = 'true' ]; then
              echo "Dry run: **${#promoted[@]}** tag(s) computed," \
                "nothing promoted"
            else
              echo "Promoted **${#promoted[@]}** tag(s):"
            fi
            echo ""
            printf -- "- \`%s\`\n" "${promoted[@]}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
