---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Exercises the reusable workflows in this repository against
# downstream fixture repositories, in parallel, to prove the pipeline
# (job graph, image discovery, harden-runner wiring, dual checkout,
# artifact plumbing, SBOM/Grype chain) functions end-to-end.
#
# The reusable workflows are referenced by LOCAL path so this always
# validates the current branch's workflows.
#
# The build-test-release and merge publish lanes are NOT self-tested
# here: build-test-release requires a signed semver tag-push context
# (and creates/promotes GitHub releases and pushes registry images),
# and merge requires a merged-commit context plus a version.properties
# file the fixtures lack (its dry_run input covers the no-credential
# case once a fixture provides one). Instantiating repos validate
# those lanes through their own release/merge cycles.
name: 'Testing 🧪'

# yamllint disable-line rule:truthy
on:
  # No workflow_dispatch: a manual run happens on the default branch,
  # which would hand this job a cache token with write access to the
  # default-branch scope while it builds and tests third-party
  # fixture repositories. Untrusted code from those repositories
  # could then poison caches that later runs restore (CWE-349).
  # Pull request runs write only to their own cache scope.
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
      - master

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  # Fixture legs exercising every image-selection mode against the two
  # deterministic fixtures:
  #   - leg 1: test-docker-project (single image, Dockerfile under
  #     docker/) — auto-discovery under full block-mode egress
  #   - leg 2: test-docker-monorepo — auto-discovery of three per-image
  #     directories, building the same-repository FROM chain in
  #     directory-sort order, plus the test_command hook (the smoke
  #     script verifies the chain markers)
  #   - leg 3: test-docker-monorepo — explicit 'images' input with
  #     per-image build_args (BASE_IMAGE override for the namespaced
  #     chain), image_namespace, and the build_permit_egress_traffic
  #     hatch plumbing
  #   - leg 4: test-docker-monorepo — the build_command escape hatch
  #     ('make images' builds via project tooling; the workflow
  #     enumerates what it created), plus the test_command hook
  #   - leg 5: test-docker-monorepo — build_permit_fail, with one
  #     buildable image and one declaring a stage the Dockerfile does
  #     not define. The build job reports the failure and succeeds,
  #     and the image that did build carries on to SBOM/Grype.
  #   - leg 6: test-docker-monorepo — the leg 3 namespaced chain,
  #     but referencing its base by the plain <name>:verify alias
  #     rather than <namespace>/<name>:verify. The daemon-backed
  #     build paths apply both aliases, so one images input travels
  #     between them; a release build on a non-amd64 platform uses
  #     the isolated driver and resolves neither. Without the plain
  #     alias this leg fails to build.
  #   - leg 7: test-docker-monorepo — build_command where discovery
  #     finds nothing (the jib/Gradle shape); see the leg itself.
  # Lint and Grype findings in fixture CONTENT soft-fail: the
  # self-test validates that the machinery executes, not the hygiene
  # of fixture Dockerfiles.
  build-test:
    name: 'Build/Test'
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: 'lfreleng-actions/test-docker-project'
            ref: 'v0.1.0'
            images: ''
            image_namespace: ''
            build_command: ''
            test_command: ''
            build_permit_egress_traffic: false
            build_permit_fail: false
          - repository: 'lfreleng-actions/test-docker-monorepo'
            ref: 'v0.0.1'
            images: ''
            image_namespace: ''
            build_command: ''
            test_command: 'TAG=verify tests/scripts/test_images.sh'
            build_permit_egress_traffic: false
            build_permit_fail: false
          - repository: 'lfreleng-actions/test-docker-monorepo'
            ref: 'v0.0.1'
            # yamllint disable-line rule:line-length
            images: '[{"name": "base-alpine", "context": "base-alpine"}, {"name": "chain-child", "context": "chain-child", "build_args": ["BASE_IMAGE=lfreleng/base-alpine:verify"]}, {"name": "util-echo", "context": "util-echo"}]'
            image_namespace: 'lfreleng'
            build_command: ''
            # yamllint disable-line rule:line-length
            test_command: 'NAMESPACE=lfreleng TAG=verify tests/scripts/test_images.sh'
            build_permit_egress_traffic: true
            build_permit_fail: false
          - repository: 'lfreleng-actions/test-docker-monorepo'
            ref: 'v0.0.1'
            images: ''
            image_namespace: ''
            build_command: 'make images TAG=verify'
            test_command: 'TAG=verify tests/scripts/test_images.sh'
            build_permit_egress_traffic: false
            build_permit_fail: false
          - repository: 'lfreleng-actions/test-docker-monorepo'
            ref: 'v0.0.1'
            # yamllint disable-line rule:line-length
            images: '[{"name": "util-echo", "context": "util-echo"}, {"name": "absent-stage", "context": "base-alpine", "target": "no-such-stage"}]'
            image_namespace: ''
            build_command: ''
            test_command: ''
            build_permit_egress_traffic: false
            build_permit_fail: true
          - repository: 'lfreleng-actions/test-docker-monorepo'
            ref: 'v0.0.1'
            # yamllint disable-line rule:line-length
            images: '[{"name": "base-alpine", "context": "base-alpine"}, {"name": "chain-child", "context": "chain-child", "build_args": ["BASE_IMAGE=base-alpine:verify"]}, {"name": "util-echo", "context": "util-echo"}]'
            image_namespace: 'lfreleng'
            build_command: ''
            # yamllint disable-line rule:line-length
            test_command: 'NAMESPACE=lfreleng TAG=verify tests/scripts/test_images.sh'
            build_permit_egress_traffic: false
            build_permit_fail: false
          - repository: 'lfreleng-actions/test-docker-monorepo'
            ref: 'v0.0.1'
            # The jib/Gradle shape: tests/ holds only scripts/, so
            # discovery finds no Dockerfile and must report zero
            # images without failing, leaving the build job to
            # enumerate what the command created. The Dockerfile
            # reaches docker build on stdin, so nothing is
            # discoverable, and the pulled base exercises the
            # RepoDigests filter that keeps pulled images out of the
            # downstream jobs.
            path_prefix: 'tests'
            images: ''
            image_namespace: ''
            # yamllint disable-line rule:line-length
            build_command: 'printf "FROM alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce\nCOPY scripts /scripts\n" | docker build -t jibless-demo:verify -f - .'
            test_command: ''
            build_permit_egress_traffic: false
            build_permit_fail: false
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: $/.github/workflows/build-test.yaml
    with:
      repository: ${{ matrix.repository }}
      ref: ${{ matrix.ref }}
      # Legs that do not set path_prefix keep the workflow default
      path_prefix: ${{ matrix.path_prefix || '.' }}
      images: ${{ matrix.images }}
      image_namespace: ${{ matrix.image_namespace }}
      build_command: ${{ matrix.build_command }}
      test_command: ${{ matrix.test_command }}
      build_permit_egress_traffic: ${{ matrix.build_permit_egress_traffic }}
      build_permit_fail: ${{ matrix.build_permit_fail }}
      audit_permit_fail: true
      grype_permit_fail: true
