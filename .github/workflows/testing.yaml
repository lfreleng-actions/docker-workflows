---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Exercises the reusable workflows in this repository against
# downstream fixture repositories, in parallel, to prove the pipeline
# (job graph, image discovery, harden-runner wiring, Gerrit and plain
# checkout, artifact plumbing, SBOM/Grype chain) functions end-to-end.
#
# The reusable workflows are referenced with the self-repository form
# ('$/'), which resolves this repository at the commit already
# running. The lanes under test are therefore always the ones this
# branch defines, independently of what any checkout puts in the
# workspace.
#
# Both publish lanes ARE self-tested here, under dry_run, by the
# merge-dry-run and release-dry-run jobs. Neither publishes: they
# build, audit and test the fixture images, then report the tags,
# assets and promotion a real run would produce. The
# release-dry-run-nexus job plans the release lane's registry input
# the same way.
#
# What the dry runs cannot reach is the part that only exists once
# images push: cosign signing, SLSA provenance and per-registry
# digest capture. Multi-platform assembly is out of reach for the
# same reason, since a manifest list needs a registry to hold it.
# Instantiating repositories still prove those through their own
# release cycles. The single-platform digest capture is also tested
# in isolation, against a fake docker, by the last job in this file.
name: 'Testing 🧪'

# yamllint disable-line rule:truthy
on:
  # No workflow_dispatch: a manual run happens on the default branch,
  # which would hand this job a cache token with write access to the
  # default-branch scope while it builds and tests third-party
  # fixture repositories. Untrusted code from those repositories
  # could then poison caches that later runs restore (CWE-349).
  # Pull request runs write only to their own cache scope.
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
      - master

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  # Fixture legs exercising every image-selection mode against the two
  # deterministic fixtures. Detail for the subtler cases sits with the
  # leg itself:
  #   - leg 1: test-docker-project — auto-discovery of a single
  #     Dockerfile under docker/, under full block-mode egress, with
  #     namespace_mode auto (the lfreleng-actions owner)
  #   - leg 2: test-docker-monorepo — auto-discovery of three
  #     per-image directories, building the same-repository FROM
  #     chain in directory-sort order, plus the test_command hook
  #   - leg 3: explicit 'images' input with per-image build_args,
  #     namespace_mode manual, and build_permit_egress_traffic plumbing
  #   - leg 4: the build_command escape hatch ('make images'), with
  #     the workflow inferring which images it created
  #   - leg 5: build_permit_fail; one image builds, one names a
  #     stage its Dockerfile lacks, and the survivor reaches Grype
  #   - leg 6: the leg 3 namespaced chain by its plain alias
  #   - leg 7: build_command where discovery finds nothing
  #   - leg 8: the leg 4 command with its output declared
  #   - leg 9: select of chain-child, which brings in its base
  #   - leg 10: select of util-echo without its dependencies
  # Lint and Grype findings in fixture CONTENT soft-fail: the
  # self-test validates that the machinery executes, not the hygiene
  # of fixture Dockerfiles.
  build-test:
    name: 'Build/Test'
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: 'lfreleng-actions/test-docker-project'
            ref: 'v0.1.0'
            images: ''
            namespace_mode: 'auto'
            build_command: ''
            test_command: ''
            build_permit_egress_traffic: false
            build_permit_fail: false
            # The single writer of the Grype database cache; every
            # other leg restores without saving. See grype_cache_db
            # below.
            grype_cache_db: 'true'
          - repository: 'lfreleng-actions/test-docker-monorepo'
            ref: 'v0.0.1'
            images: ''
            namespace_mode: 'none'
            build_command: ''
            test_command: 'TAG=verify tests/scripts/test_images.sh'
            build_permit_egress_traffic: false
            build_permit_fail: false
          - repository: 'lfreleng-actions/test-docker-monorepo'
            ref: 'v0.0.1'
            # yamllint disable-line rule:line-length
            images: '[{"name": "base-alpine", "context": "base-alpine"}, {"name": "chain-child", "context": "chain-child", "build_args": ["BASE_IMAGE=lfreleng/base-alpine:verify"]}, {"name": "util-echo", "context": "util-echo"}]'
            namespace_mode: 'manual'
            namespace: 'lfreleng'
            build_command: ''
            # yamllint disable-line rule:line-length
            test_command: 'NAMESPACE=lfreleng TAG=verify tests/scripts/test_images.sh'
            build_permit_egress_traffic: true
            build_permit_fail: false
          - repository: 'lfreleng-actions/test-docker-monorepo'
            ref: 'v0.0.1'
            images: ''
            namespace_mode: 'none'
            build_command: 'make images TAG=verify'
            test_command: 'TAG=verify tests/scripts/test_images.sh'
            build_permit_egress_traffic: false
            build_permit_fail: false
          - repository: 'lfreleng-actions/test-docker-monorepo'
            ref: 'v0.0.1'
            # yamllint disable-line rule:line-length
            images: '[{"name": "util-echo", "context": "util-echo"}, {"name": "absent-stage", "context": "base-alpine", "target": "no-such-stage"}]'
            namespace_mode: 'none'
            build_command: ''
            test_command: ''
            build_permit_egress_traffic: false
            build_permit_fail: true
          - repository: 'lfreleng-actions/test-docker-monorepo'
            ref: 'v0.0.1'
            # The leg 3 chain, but referencing its base by the plain
            # <name>:verify alias rather than the namespaced form.
            # The daemon-backed build paths apply both aliases, so
            # one images input travels between the lanes; a release
            # build on a non-amd64 platform uses the isolated driver
            # and resolves neither. Without the plain alias this leg
            # cannot build.
            # yamllint disable-line rule:line-length
            images: '[{"name": "base-alpine", "context": "base-alpine"}, {"name": "chain-child", "context": "chain-child", "build_args": ["BASE_IMAGE=base-alpine:verify"]}, {"name": "util-echo", "context": "util-echo"}]'
            namespace_mode: 'manual'
            namespace: 'lfreleng'
            build_command: ''
            # yamllint disable-line rule:line-length
            test_command: 'NAMESPACE=lfreleng TAG=verify tests/scripts/test_images.sh'
            build_permit_egress_traffic: false
            build_permit_fail: false
          - repository: 'lfreleng-actions/test-docker-monorepo'
            ref: 'v0.0.1'
            # The jib/Gradle shape: tests/ holds only scripts/, so
            # discovery finds no Dockerfile and must report zero
            # images without failing, leaving the build job to
            # enumerate what the command created. The Dockerfile
            # reaches docker build on stdin, so nothing is
            # discoverable, and the pulled base exercises the
            # RepoDigests filter that keeps pulled images out of the
            # downstream jobs.
            path_prefix: 'tests'
            images: ''
            namespace_mode: 'none'
            # yamllint disable-line rule:line-length
            build_command: 'printf "FROM alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce\nCOPY scripts /scripts\n" | docker build -t jibless-demo:verify -f - .'
            test_command: ''
            build_permit_egress_traffic: false
            build_permit_fail: false
          - repository: 'lfreleng-actions/test-docker-monorepo'
            ref: 'v0.0.1'
            images: ''
            namespace_mode: 'none'
            build_command: 'make images TAG=verify'
            # The three images leg 4 leaves the workflow to infer,
            # named explicitly instead, so the declared branch runs
            # in CI: parsing, validation, and checking each
            # reference exists once the command has run. Its result
            # must agree with what leg 4 infers. The clearing this
            # branch also guards cannot be reached here, since a
            # hosted runner starts with no images to clear.
            # yamllint disable-line rule:line-length
            build_command_images: 'base-alpine:verify chain-child:verify util-echo:verify'
            test_command: 'TAG=verify tests/scripts/test_images.sh'
            build_permit_egress_traffic: false
            build_permit_fail: false
          - repository: 'lfreleng-actions/test-docker-monorepo'
            ref: 'v0.0.1'
            images: ''
            namespace_mode: 'none'
            build_command: ''
            # chain-child builds FROM base-alpine, so the default
            # select_dependencies builds both, and util-echo not at all.
            # IMAGES carries the built tags; compare the names, exactly.
            select: 'chain-child'
            test_command: >-
              built=$(jq -r '.[] | sub(":[^:]*$"; "")' <<< "${IMAGES}"
              | sort -u | paste -sd ' ');
              echo "Built: ${built}";
              [ "${built}" = 'base-alpine chain-child' ] ||
              { echo "::error::expected base-alpine chain-child"; exit 1; }
            build_permit_egress_traffic: false
            build_permit_fail: false
          - repository: 'lfreleng-actions/test-docker-monorepo'
            ref: 'v0.0.1'
            images: ''
            namespace_mode: 'none'
            build_command: ''
            # util-echo alone, with select_dependencies off
            select: 'util-echo'
            select_dependencies: false
            test_command: >-
              built=$(jq -r '.[] | sub(":[^:]*$"; "")' <<< "${IMAGES}"
              | sort -u | paste -sd ' ');
              echo "Built: ${built}";
              [ "${built}" = 'util-echo' ] ||
              { echo "::error::expected util-echo alone"; exit 1; }
            build_permit_egress_traffic: false
            build_permit_fail: false
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: $/.github/workflows/build-test.yaml
    with:
      repository: ${{ matrix.repository }}
      ref: ${{ matrix.ref }}
      # Every fixture call caps its build job at five minutes. In
      # Testing run #262, a clean run, the slowest build job took
      # 44 s and the three release-lane builds, the emulated
      # linux/arm64 one included, at most 43 s. The default of 30
      # exists for consumers' real builds; here it only holds a
      # hung run open for 35 minutes (timeout-minutes plus GitHub's
      # five-minute grace) before anyone can re-run it. Five minutes
      # leaves the fixtures a sevenfold margin and reports a hung
      # build in ten.
      build_timeout_minutes: 5
      # Legs that do not set path_prefix keep the workflow default
      path_prefix: ${{ matrix.path_prefix || '.' }}
      images: ${{ matrix.images }}
      # Legs that do not select build every image
      select: ${{ matrix.select || '' }}
      # format() renders an unset key as '', which a comparison with
      # false would equate to it, so only an explicit false disables
      # yamllint disable-line rule:line-length
      select_dependencies: ${{ format('{0}', matrix.select_dependencies) != 'false' }}
      namespace_mode: ${{ matrix.namespace_mode }}
      # Only the manual legs set a namespace
      namespace: ${{ matrix.namespace || '' }}
      build_command: ${{ matrix.build_command }}
      # Legs that do not declare their output leave it to inference
      build_command_images: ${{ matrix.build_command_images || '' }}
      test_command: ${{ matrix.test_command }}
      build_permit_egress_traffic: ${{ matrix.build_permit_egress_traffic }}
      build_permit_fail: ${{ matrix.build_permit_fail }}
      audit_permit_fail: true
      grype_permit_fail: true
      # The Grype database cache rotates its key on the database build
      # time, so exactly one job may write a given prefix. These legs
      # run in parallel, so leg 1 keeps the entry current and the rest
      # restore without saving. With all ten writing, creation order
      # and build order can disagree, and a later run then restores a
      # staler database than the newest saved. That is not a cosmetic
      # problem: Grype refuses a database built more than five days
      # ago.
      # yamllint disable-line rule:line-length
      grype_cache_db: ${{ matrix.grype_cache_db || 'restore-only' }}

  # build_artifacts end to end. An earlier job uploads target/hello.txt
  # and the verify lane places it in this repository's fixture before
  # the build; the fixture Dockerfile copies a file the repository does
  # not hold, so the image only builds once placement worked, and
  # test_command reads the file back out of the image. Lint, SBOM and
  # Grype are off: the build-test legs cover them.
  build-artifacts-upload:
    name: 'Build artefact upload'
    permissions: {}
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}
      - name: 'Create the build artefact'
        shell: bash
        run: |
          mkdir -p build-artifacts/target
          echo 'hello from build_artifacts' \
            > build-artifacts/target/hello.txt
      - name: 'Upload the build artefact'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: 'build-artifacts-hello'
          path: 'build-artifacts'
          retention-days: 1
          if-no-files-found: 'error'

  build-artifacts:
    name: 'Build/Test (build artefacts)'
    needs: 'build-artifacts-upload'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: $/.github/workflows/build-test.yaml
    with:
      path_prefix: 'tests/fixtures/build-artifacts'
      images: '[{"name": "build-artifacts-hello", "context": "."}]'
      build_artifacts: '[{"name": "build-artifacts-hello"}]'
      build_timeout_minutes: 5
      test_command: >-
        test "$(docker run --rm build-artifacts-hello:verify
        cat /hello.txt)" = 'hello from build_artifacts'
      lint_enabled: false
      sbom_enabled: false
      grype_enabled: false
      # Exercise the allow-list inputs without granting anything new.
      # A same-organisation list may follow its default branch, and
      # 'lfreleng-actions//' resolves to the organisation list itself,
      # which de-duplication absorbs. The organisation list already
      # carries github.com:443, so the action reports it as redundant.
      # yamllint disable-line rule:line-length
      # gha-workflow-linter: allow-list-pin-ok -- deliberately unpinned fixture; exercises harden_runner_supplemental_unpinned
      harden_runner_supplemental_allowlist: 'lfreleng-actions//'
      harden_runner_supplemental_unpinned: true
      harden_runner_extra_endpoints: 'github.com:443'

  # The Java-to-Docker hand-off end to end, through both families'
  # real contract. The Java lane runs a real Maven build of
  # test-maven-project and uploads the reactor artefact, which keeps
  # each packaged jar at its module-relative path
  # (app/target/test-maven-app-<version>.jar). The verify lane places
  # that artefact in the same fixture's checkout and builds
  # app/Dockerfile, which copies the jar into a Java runtime image.
  # The artefact carries no POM, so placing it also proves it does
  # not collide with a checkout file, which the lane refuses.
  #
  # Not exercised here: the fixture's 'docker' Maven profile and its
  # app-fabric8 module. Those need the Java job to run 'mvn -P
  # docker' (#214). The build-artifacts legs above stay: they test
  # the placement rules without a Java build.
  maven-docker-build:
    name: 'Maven Build/Test (Docker hand-off)'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/java-workflows/.github/workflows/maven-build-test.yaml@1e5aae1c31ef26070fce3e8917be6c2b2a26fbb8  # v0.8.0
    with:
      repository: 'lfreleng-actions/test-maven-project'
      ref: 'cf3ca4f682ba398497538f5b22d7b9b86d6f7d64'  # v0.3.0
      upload_build_artifacts: true
      # The artefact namespace is shared across the whole run, so a
      # suffix keeps a later second call of the Java lane from
      # colliding; build_artifact_name already includes it
      artifact_suffix: '-e2e'
      # The fixture's tests read a pinned submodule
      checkout_submodules: true
      # The Docker job covers its own gates; these only slow the leg
      sbom_enabled: false
      grype_enabled: false
      cbom_enabled: false

  # Skips, rather than passes, if the Java lane stops publishing the
  # reactor shape; maven-docker-checks turns that skip into a failure
  maven-docker-image:
    name: 'Build/Test (Maven artefacts)'
    needs: 'maven-docker-build'
    if: needs.maven-docker-build.outputs.build_artifact_shape == 'reactor'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: $/.github/workflows/build-test.yaml
    with:
      repository: 'lfreleng-actions/test-maven-project'
      ref: 'cf3ca4f682ba398497538f5b22d7b9b86d6f7d64'  # v0.3.0
      # Named explicitly: discovery would also find
      # app-fabric8/src/main/docker/Dockerfile, which needs a
      # directory only the Maven 'docker' profile generates
      images: '[{"name": "maven-fixture-app", "context": "app"}]'
      # yamllint disable-line rule:line-length
      build_artifacts: '[{"name": "${{ needs.maven-docker-build.outputs.build_artifact_name }}"}]'
      # The image's default command runs 'ls -l /app/app.jar'; a
      # missing jar prints only to stderr, so grep finds nothing
      test_command: >-
        docker run --rm maven-fixture-app:verify | grep -F '/app/app.jar'
      # A Java toolchain base image pull
      build_timeout_minutes: 10
      # lint_enabled stays at its default, so hadolint also runs on
      # the fixture's Dockerfile
      sbom_enabled: false
      grype_enabled: false

  # A job whose condition was false reports 'skipped', which reads as
  # green. Fail instead whenever the Docker job did not succeed, so a
  # missing build_artifact_shape output cannot hide as a pass.
  maven-docker-checks:
    name: 'Maven artefacts reached the image'
    needs: ['maven-docker-build', 'maven-docker-image']
    if: ${{ !cancelled() }}
    permissions: {}
    runs-on: 'ubuntu-latest'
    timeout-minutes: 2
    steps:
      - name: 'Require the Docker job to have run and passed'
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.maven-docker-build.result }}
          IMAGE_RESULT: ${{ needs.maven-docker-image.result }}
          # yamllint disable-line rule:line-length
          SHAPE: ${{ needs.maven-docker-build.outputs.build_artifact_shape }}
          # yamllint disable-line rule:line-length
          NAME: ${{ needs.maven-docker-build.outputs.build_artifact_name }}
        run: |
          if [ "${BUILD_RESULT}" != 'success' ]; then
            echo "::error::maven-docker-build ended '${BUILD_RESULT}'"
            exit 1
          fi
          if [ "${IMAGE_RESULT}" != 'success' ]; then
            echo "::error::maven-docker-image ended '${IMAGE_RESULT}'" \
              "(build_artifact_shape '${SHAPE:-absent}'," \
              "build_artifact_name '${NAME:-absent}')"
            exit 1
          fi
          echo "Artefact '${NAME}' (${SHAPE}) reached the image ✅"

  # The merge lane, end to end, without publishing anything.
  #
  # dry_run skips credential loading and registry login entirely, so
  # the lane still discovers and builds the images, resolves the
  # version from version.properties, computes the snapshot/staging tag
  # set, detects the container release file and plans the promotion —
  # while pushing nothing and needing no secrets. That makes the
  # publish path observable in CI, which it has never been.
  #
  # The ref pins the fixture commit that ADDED the release descriptor,
  # and pins it deliberately: detection compares a merged commit
  # against its parent, so a moving branch would stop detecting the
  # file the moment anything else merged there. The commit adds
  # releases/1.2.4-container.yaml alone, a descriptor carrying the
  # ref the release container schema requires, where v0.1.0's 1.2.3
  # descriptor has none. A commit SHA, not a release tag, names
  # exactly that commit.
  #
  # The registries are real Linux Foundation hostnames because the
  # release descriptor overrides the pull registry and the workflow
  # requires an override to stay on its input's host. Nothing
  # connects to them under dry_run.
  #
  # namespace_mode auto namespaces both halves under the fixture's
  # owner, lfreleng-actions: the snapshot tags and both sides of the
  # promotion plan, whose release-file names are relative to it.
  #
  # The gates (hadolint, tests, image SBOM and Grype) run as they
  # would on a real merge, and snapshot-publish waits for them.
  merge-dry-run:
    name: 'Merge (dry run)'
    permissions:
      contents: read
    uses: $/.github/workflows/merge.yaml
    with:
      repository: 'lfreleng-actions/test-docker-monorepo'
      # yamllint disable-line rule:line-length
      ref: 'f7d28467c46c2a5da25cd9db39db4dfd70f7e838'  # adds releases/1.2.4-container.yaml
      build_timeout_minutes: 5
      snapshot_registry: 'nexus3.onap.org:10003'
      release_registry: 'nexus3.onap.org:10002'
      namespace_mode: 'auto'
      dry_run: true
      # Carry the latest inputs through validation to the promotion
      # step; 'always' takes the non-default branch of both
      push_latest: true
      latest_policy: 'always'
      # namespace_mode auto archives the images as
      # lfreleng-actions/<name>:verify only, so the test script needs
      # the namespace to find them
      # yamllint disable-line rule:line-length
      test_command: 'NAMESPACE=lfreleng-actions TAG=verify tests/scripts/test_images.sh'
      # Lint and Grype findings in fixture CONTENT soft-fail, as in
      # the build-test legs above: this job validates that the
      # machinery executes, not the hygiene of fixture Dockerfiles.
      lint_permit_fail: true
      grype_permit_fail: true
      # Leg 1 of build-test is the single writer of the Grype
      # database cache; this job restores without saving. See the
      # grype_cache_db note there.
      grype_cache_db: 'restore-only'

  # The merge lane with every optional gate switched off. A gate
  # disabled by its input must not hold back the snapshot publish:
  # the release lane once skipped its promotion that way, with every
  # job green (#90). merge-gating below asserts the publish ran;
  # merge-gating-condition covers the failing-gate cases a passing
  # run cannot reach.
  merge-dry-run-gates-off:
    name: 'Merge (dry run, gates off)'
    permissions:
      contents: read
    uses: $/.github/workflows/merge.yaml
    with:
      repository: 'lfreleng-actions/test-docker-monorepo'
      # yamllint disable-line rule:line-length
      ref: 'f7d28467c46c2a5da25cd9db39db4dfd70f7e838'  # adds releases/1.2.4-container.yaml
      build_timeout_minutes: 5
      snapshot_registry: 'nexus3.onap.org:10003'
      release_registry: 'nexus3.onap.org:10002'
      namespace_mode: 'auto'
      dry_run: true
      lint_enabled: false
      sbom_enabled: false
      grype_enabled: false

  # A skipped job renders green, so the two merge legs passing proves
  # nothing about whether snapshot-publish ran. This job reads the
  # gate and publish results the merge lane reports as workflow
  # outputs, and checks that the gates ran or skipped as configured
  # and that both publish jobs ran in both legs. Listing the run's
  # jobs through the REST API instead fails with HTTP 502 on re-run
  # attempts of a run this size (#178).
  merge-gating:
    name: 'Merge gating'
    needs: ['merge-dry-run', 'merge-dry-run-gates-off']
    permissions: {}
    runs-on: 'ubuntu-latest'
    timeout-minutes: 2
    steps:
      - name: 'Check merge job results'
        shell: bash
        env:
          ON_LINT: ${{ needs.merge-dry-run.outputs.lint_result }}
          ON_TESTS: ${{ needs.merge-dry-run.outputs.tests_result }}
          ON_SBOM: ${{ needs.merge-dry-run.outputs.sbom_result }}
          ON_GRYPE: ${{ needs.merge-dry-run.outputs.grype_result }}
          # yamllint disable-line rule:line-length
          ON_SNAPSHOT: ${{ needs.merge-dry-run.outputs.snapshot_publish_result }}
          ON_RELEASE: ${{ needs.merge-dry-run.outputs.release_publish_result }}
          OFF_LINT: ${{ needs.merge-dry-run-gates-off.outputs.lint_result }}
          OFF_TESTS: ${{ needs.merge-dry-run-gates-off.outputs.tests_result }}
          OFF_SBOM: ${{ needs.merge-dry-run-gates-off.outputs.sbom_result }}
          OFF_GRYPE: ${{ needs.merge-dry-run-gates-off.outputs.grype_result }}
          # yamllint disable-line rule:line-length
          OFF_SNAPSHOT: ${{ needs.merge-dry-run-gates-off.outputs.snapshot_publish_result }}
          # yamllint disable-line rule:line-length
          OFF_RELEASE: ${{ needs.merge-dry-run-gates-off.outputs.release_publish_result }}
        run: |
          # An empty output reads as 'absent' and fails the check
          failures=0
          expect() {
            local name="$1 / $2" actual="$3"
            if [ "${actual}" = "$4" ]; then
              echo "ok: ${name}: ${actual}"
            else
              echo "::error::${name}: expected '$4'" \
                "but got '${actual:-absent}'"
              failures=$((failures + 1))
            fi
          }
          on='merge-dry-run'
          expect "${on}" lint_result "${ON_LINT}" success
          expect "${on}" tests_result "${ON_TESTS}" success
          expect "${on}" sbom_result "${ON_SBOM}" success
          expect "${on}" grype_result "${ON_GRYPE}" success
          expect "${on}" snapshot_publish_result "${ON_SNAPSHOT}" success
          expect "${on}" release_publish_result "${ON_RELEASE}" success
          off='merge-dry-run-gates-off'
          expect "${off}" lint_result "${OFF_LINT}" skipped
          expect "${off}" tests_result "${OFF_TESTS}" success
          expect "${off}" sbom_result "${OFF_SBOM}" skipped
          expect "${off}" grype_result "${OFF_GRYPE}" skipped
          expect "${off}" snapshot_publish_result "${OFF_SNAPSHOT}" success
          expect "${off}" release_publish_result "${OFF_RELEASE}" success
          [ "${failures}" -eq 0 ]

  # The verify lane's release-file checks, end to end, on the fixture
  # commit that adds a valid release descriptor: the same commit and
  # registries as merge-dry-run above, so verify reads the file
  # exactly as that merge does. No secrets reach the call, so
  # release-verify warns and keeps the offline check alone, which is
  # the path every fork pull request takes. The malformed files that
  # must fail, and the registry checks themselves, run in
  # verify-release-checks below. Lint, SBOM and Grype are off: the
  # build-test legs cover them.
  verify-release:
    name: 'Build/Test (release file)'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: $/.github/workflows/build-test.yaml
    with:
      repository: 'lfreleng-actions/test-docker-monorepo'
      # yamllint disable-line rule:line-length
      ref: 'f7d28467c46c2a5da25cd9db39db4dfd70f7e838'  # adds releases/1.2.4-container.yaml
      build_timeout_minutes: 5
      snapshot_registry: 'nexus3.onap.org:10003'
      release_registry: 'nexus3.onap.org:10002'
      namespace_mode: 'auto'
      lint_enabled: false
      sbom_enabled: false
      grype_enabled: false

  # A leg that passes proves nothing if detection quietly found no
  # file; the release descriptor must have been detected and passed
  verify-release-detected:
    name: 'Release file detected'
    needs: verify-release
    permissions: {}
    runs-on: 'ubuntu-latest'
    timeout-minutes: 2
    steps:
      - name: 'Require a detected release'
        shell: bash
        env:
          HAS_RELEASE: ${{ needs.verify-release.outputs.has_release }}
        run: |
          # The fixture commit adds releases/1.2.4-container.yaml
          if [ "${HAS_RELEASE}" != 'true' ]; then
            echo "::error::The verify lane did not detect the fixture's" \
              "release file (has_release '${HAS_RELEASE}')"
            exit 1
          fi
          echo "Release file detected and validated ✅"

  # The Grype dependency-change gate (#200) end to end, on the
  # unresolved path. The lane asks to gate only when the change
  # touched the dependency chain, so repository-metadata runs the
  # detection and the grype job reads its dependencies_changed
  # output. Against a fixture checked out at a tag, the detection
  # finds no base to compare with (the checkout's HEAD is not this
  # run's commit), so the verdict is empty and the scan fails closed:
  # the gate stays active and names that reason. The job below
  # asserts both. The SBOM stays on: the grype job runs only after
  # the sbom job, and without it the outputs asserted below are
  # empty. The resolved path, where a verdict travels, is the next
  # call.
  build-test-dependency-gate:
    name: 'Build/Test (dependency gate)'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: $/.github/workflows/build-test.yaml
    with:
      repository: 'lfreleng-actions/test-docker-project'
      ref: 'v0.1.0'
      build_timeout_minutes: 5
      lint_enabled: false
      grype_gate_when: 'dependencies-changed'
      grype_permit_fail: true
      grype_cache_db: 'restore-only'

  build-test-dependency-gate-checks:
    name: 'Dependency gate fails closed'
    needs: build-test-dependency-gate
    permissions: {}
    runs-on: 'ubuntu-latest'
    timeout-minutes: 2
    steps:
      - name: 'Require an active gate with the unresolved reason'
        shell: bash
        env:
          # yamllint disable-line rule:line-length
          GATE_ACTIVE: ${{ needs.build-test-dependency-gate.outputs.grype_gate_active }}
          # yamllint disable-line rule:line-length
          GATE_REASON: ${{ needs.build-test-dependency-gate.outputs.grype_gate_reason }}
        run: |
          status=0
          if [ "${GATE_ACTIVE}" != 'true' ]; then
            echo "::error::The dependency gate did not stay active on an" \
              "unresolved result (grype_gate_active '${GATE_ACTIVE}')"
            status=1
          fi
          expected='the dependency-change signal was unavailable'
          if [ "${GATE_REASON}" != "${expected}" ]; then
            echo "::error::The dependency gate gave reason" \
              "'${GATE_REASON}', expected '${expected}'"
            status=1
          fi
          if [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi
          echo "Dependency gate failed closed as designed ✅"

  # The same gate with a resolved result. An unresolved result leaves
  # the verdict empty, so the call above passes whether or not a
  # verdict could travel: this call proves the transport. It builds a
  # fixture in this repository at the run's own commit, so the
  # checkout's HEAD is GITHUB_SHA and the detection compares it with
  # the base branch, the first parent of the pull request's merge
  # commit. The docker preset matches the fixture Dockerfile, any
  # recipe added under the fixture, and one directly in an ancestor
  # directory (tests/fixtures, tests, the root), so the verdict reads
  # 'false' unless the pull request edits one of those, and the scan
  # withholds the gate only once that verdict has reached it from
  # repository-metadata's job output; one that failed to travel
  # leaves the gate active with the unresolved reason, which the job
  # below rejects. That job diffs the same two commits under the same
  # names to know which verdict to require, so a pull request that
  # edits such a recipe passes by expecting an armed gate, and
  # nothing else passes.
  build-test-dependency-gate-resolved:
    name: 'Build/Test (dependency gate, resolved)'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: $/.github/workflows/build-test.yaml
    with:
      path_prefix: 'tests/fixtures/dependency-gate'
      images: '[{"name": "dependency-gate", "context": "."}]'
      build_timeout_minutes: 5
      lint_enabled: false
      grype_gate_when: 'dependencies-changed'
      grype_permit_fail: true
      grype_cache_db: 'restore-only'

  build-test-dependency-gate-resolved-checks:
    name: 'Dependency gate reads the verdict'
    needs: build-test-dependency-gate-resolved
    permissions:
      contents: read
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The same two commits the lane's repository-metadata compared
          fetch-depth: 2
          persist-credentials: false
      - name: 'Require the verdict the diff predicts'
        shell: bash
        env:
          # yamllint disable-line rule:line-length
          GATE_ACTIVE: ${{ needs.build-test-dependency-gate-resolved.outputs.grype_gate_active }}
          # yamllint disable-line rule:line-length
          GATE_REASON: ${{ needs.build-test-dependency-gate-resolved.outputs.grype_gate_reason }}
        run: |
          # The docker preset's file names between the base branch and
          # this commit decide the verdict the action must have
          # reached: the action matches them at any depth under the
          # fixture directory and directly in each of its ancestors,
          # the repository root included, so the diff covers both.
          # tests/test_dependency_change.sh checks the prefix against
          # the call's path_prefix and this oracle against the action.
          prefix='tests/fixtures/dependency-gate'
          names=(Dockerfile 'Dockerfile.*' '*.Dockerfile' '*.dockerfile'
            Containerfile 'Containerfile.*')
          specs=()
          for name in "${names[@]}"; do
            specs+=(":(glob)${prefix}/**/${name}")
          done
          ancestor="${prefix}"
          while [[ "${ancestor}" == */* ]]; do
            ancestor="${ancestor%/*}"
            for name in "${names[@]}"; do
              specs+=(":(glob)${ancestor}/${name}")
            done
          done
          for name in "${names[@]}"; do
            specs+=(":(glob)${name}")
          done
          touched=$(git diff --name-only HEAD^1 HEAD -- "${specs[@]}")
          if [ -n "${touched}" ]; then
            expected_active='true'
            expected_reason='this change touched the dependency chain'
            echo "This change edits a recipe the fixture's detection" \
              "sees, so the gate must be armed:"
            while IFS= read -r file; do
              echo "  ${file}"
            done <<< "${touched}"
          else
            expected_active='false'
            expected_reason='this change did not touch the dependency chain'
            echo "This change leaves every recipe the fixture's" \
              "detection sees alone, so the gate must be withheld"
          fi
          status=0
          if [ "${GATE_ACTIVE}" != "${expected_active}" ]; then
            echo "::error::The dependency gate reported grype_gate_active" \
              "'${GATE_ACTIVE}', expected '${expected_active}'; the" \
              "verdict did not reach the scan or said something else"
            status=1
          fi
          if [ "${GATE_REASON}" != "${expected_reason}" ]; then
            echo "::error::The dependency gate gave reason" \
              "'${GATE_REASON}', expected '${expected_reason}'"
            status=1
          fi
          if [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi
          echo "Dependency gate read the verdict ✅"

  # The release lane, end to end, without publishing anything.
  #
  # dry_run resolves no target registry, so the lane discovers and
  # builds the fixture images, lints them, generates the image SBOMs,
  # runs the Grype audit and the tests, then reports the release
  # assets and the promotion plan -- while creating no draft release,
  # pushing no image and moving no tag.
  #
  # The ref names the tag to validate and release from, because a dry
  # run has no tag-push context to infer one from. v0.1.0 is not an
  # arbitrary choice: the lane demands a semver, non-development,
  # signed tag whose key is registered to a GitHub account, and the
  # fixture's v0.1.0 is an annotated tag carrying a GitHub-verified
  # SSH signature. Tag validation therefore runs at full strength
  # rather than being relaxed for the self-test.
  #
  # The sign job skips here by construction: nothing pushed, so there
  # is no digest to sign or attest. That leaves cosign and SLSA
  # provenance unproven by this job, which is inherent to a dry run
  # and noted in the header above.
  release-dry-run:
    name: 'Release (dry run)'
    # GitHub validates a called workflow's job permissions against the
    # caller's grant before any job starts, and rejects the entire run
    # when the callee declares more -- a startup failure with no job
    # and no annotation to explain it. build-test-release.yaml is the
    # only lane whose jobs declare writes, so this caller has to grant
    # their union even though a dry run exercises none of it.
    # 'permissions' accepts no expression, so those declarations
    # cannot vary with dry_run.
    #
    # Every scope below is therefore minted and left unused: the lane
    # resolves no registry, performs no write, and skips the sign job
    # for want of a pushed digest. The job does build fixture content
    # while holding them, which is why the fixture is an org-owned
    # repository pinned to a signed tag and egress stays in block
    # mode. Narrowing this needs the lane split into produce and
    # publish halves; see #28.
    permissions:
      # Each scope belongs to a step this dry run skips; see above.
      # yamllint disable-line rule:line-length
      contents: write  # tag-validate drafts, attach edits, promote publishes
      packages: write  # build pushes to GHCR; promote retags 'latest'
      id-token: write  # sign requests a Sigstore OIDC token
      attestations: write  # sign attaches SLSA build provenance
      artifact-metadata: write  # sign creates attestation storage records
    uses: $/.github/workflows/build-test-release.yaml
    with:
      repository: 'lfreleng-actions/test-docker-monorepo'
      ref: 'v0.1.0'
      build_timeout_minutes: 5
      dry_run: true
      # The dry-run plan reports both 'latest' decisions; the Latest
      # GitHub release one reads the fixture's published releases
      push_latest: true
      latest_policy: 'highest'
      # A manual namespace aliases the images as lfreleng/<name>;
      # the test command checks the plain aliases still resolve
      namespace_mode: 'manual'
      namespace: 'lfreleng'
      test_command: 'TAG=verify tests/scripts/test_images.sh'
      # Lint and Grype findings in fixture CONTENT soft-fail, as in
      # the build-test legs above: this job validates that the
      # machinery executes, not the hygiene of fixture Dockerfiles.
      audit_permit_fail: true
      grype_permit_fail: true
      # Leg 1 of build-test is the single writer of the Grype
      # database cache; this job restores without saving. See the
      # grype_cache_db note there.
      grype_cache_db: 'restore-only'

  # The same lane on a foreign architecture, to cover the build path
  # the job above cannot reach.
  #
  # The lane picks its buildx driver from the platform count AND from
  # whether anything publishes. A publishing multi-platform build
  # needs the docker-container driver to assemble a manifest list,
  # and its chains resolve through the registry each image just
  # pushed to. A dry run publishes nowhere, so it builds one platform
  # and uses the daemon-backed docker driver instead -- otherwise
  # containerised BuildKit could not see the --load'ed
  # base-alpine:verify that chain-child builds FROM, and the dry run
  # would fail for a reason a real release never hits.
  #
  # The leg above leaves platforms at the linux/amd64 default and so
  # never exercises that selection. This one sets linux/arm64: a
  # single foreign architecture, which takes the same branch a
  # multi-platform dry run does while costing one emulated build
  # rather than several.
  #
  # Deliberately narrow. Lint, SBOM, Grype and the test command are
  # off because the leg above already covers them and they are
  # architecture-independent; what needs proving here is that the
  # images build under emulation and the FROM chain resolves. The
  # fixture's chain is the assertion, so it must keep auto-discovery
  # rather than an explicit image list.
  release-dry-run-foreign-arch:
    name: 'Release (dry run, arm64)'
    permissions:
      # Matches the grant above; see the rationale on that job.
      # yamllint disable-line rule:line-length
      contents: write  # tag-validate drafts, attach edits, promote publishes
      packages: write  # build pushes to GHCR; promote retags 'latest'
      id-token: write  # sign requests a Sigstore OIDC token
      attestations: write  # sign attaches SLSA build provenance
      artifact-metadata: write  # sign creates attestation storage records
    uses: $/.github/workflows/build-test-release.yaml
    with:
      repository: 'lfreleng-actions/test-docker-monorepo'
      ref: 'v0.1.0'
      build_timeout_minutes: 5
      dry_run: true
      platforms: 'linux/arm64'
      lint_enabled: false
      sbom_enabled: false
      grype_enabled: false

  # The registry input, planned end to end without publishing.
  #
  # A Nexus 3 release registry, addressed by port as the LF registries
  # are, with GHCR off so the plan holds that registry alone. No
  # 1Password secrets reach this call, so the plan also has to name
  # them as missing: a real run here would skip the registry with a
  # warning rather than fail. Nothing connects to the registry under
  # dry_run. Lint, SBOM and Grype are off, as on the leg above: the
  # registry plan is what needs proving, and the job after this one
  # asserts it from the lane's registry_plan output.
  release-dry-run-nexus:
    name: 'Release (dry run, Nexus 3)'
    permissions:
      # Matches the grant on release-dry-run; see the rationale there.
      # yamllint disable-line rule:line-length
      contents: write  # tag-validate drafts, attach edits, promote publishes
      packages: write  # build pushes to GHCR; promote retags 'latest'
      id-token: write  # sign requests a Sigstore OIDC token
      attestations: write  # sign attaches SLSA build provenance
      artifact-metadata: write  # sign creates attestation storage records
    uses: $/.github/workflows/build-test-release.yaml
    with:
      repository: 'lfreleng-actions/test-docker-monorepo'
      ref: 'v0.1.0'
      build_timeout_minutes: 5
      dry_run: true
      registry: 'nexus3.onap.org:10002'
      ghcr_publish: false
      namespace_mode: 'auto'
      lint_enabled: false
      sbom_enabled: false
      grype_enabled: false

  release-dry-run-nexus-plan:
    name: 'Release (dry run, Nexus 3) plan'
    needs: 'release-dry-run-nexus'
    permissions: {}
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}
      - name: 'Assert the registry plan'
        shell: bash
        env:
          PLAN: ${{ needs.release-dry-run-nexus.outputs.registry_plan }}
        run: |
          # The plan logs in to the port-addressed endpoint as the
          # repository's name, pushes every image under the owner's
          # namespace at the tag's version, and names the missing
          # 1Password secrets; nothing goes to GHCR
          jq -r '.[]' <<< "${PLAN}"
          prefix='Dry run: would push nexus3.onap.org:10002/lfreleng-actions/'
          jq -e --arg prefix "${prefix}" '
            index("Dry run: would log in to nexus3.onap.org:10002 as"
              + " test-docker-monorepo") != null
            and any(.[]; startswith($prefix) and endswith(":0.1.0"))
            and any(.[]; test("OP_SERVICE_ACCOUNT_TOKEN"))
            and all(.[]; test("ghcr\\.io") | not)
          ' <<< "${PLAN}" > /dev/null
          echo "Registry plan as expected ✅"

  # The release lane's single-platform digest capture, which the dry
  # runs above cannot reach because nothing pushes. The test runs the
  # build job's version and registries step scripts, extracted from
  # the workflow, then docker-build-images-action at the commit the
  # workflow pins, against a fake docker, checking that each pushed
  # repository resolves its own digest from RepoDigests: Docker Hub in
  # the familiar form docker prints it (#96), other registries matched
  # exactly. It also runs the gerrit-validate job's registry input
  # check, and the registries step against the registry input's
  # login, credential and dry-run plan cases.
  release-digest:
    name: 'Release digest resolution'
    permissions:
      contents: read
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 'Test release digest resolution'
        run: bash tests/test_release_digest.sh

  # namespace_mode resolution in every lane: the gerrit-validate step
  # script that resolves the image namespace, extracted from each
  # workflow and run against valid and invalid mode/namespace pairs,
  # including the release lane's Docker Hub requirements. The merge
  # lane's promotion plan comes from docker-promote-action, fetched at
  # the commit merge.yaml pins and run under dry_run.
  namespace-mode:
    name: 'Namespace mode resolution'
    permissions:
      contents: read
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 'Test namespace_mode resolution'
        run: bash tests/test_namespace_mode.sh

  # Image selection in every lane (#160): select and
  # select_dependencies declared alike and passed to discovery, and
  # the gerrit-validate step refusing select with build_command,
  # extracted from each lane and run. The select legs of build-test
  # check which images a selection builds.
  image-select:
    name: 'Image selection'
    permissions:
      contents: read
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 'Test image selection inputs'
        run: bash tests/test_image_select.sh

  # latest_policy in both publishing lanes (#115): the input and its
  # gerrit-validate check, the wiring of docker-promote-action at its
  # pinned commit (run in mode latest under dry_run), and the release
  # lane's Latest GitHub release decision, extracted from the
  # workflow and run against a stub gh serving release lists.
  latest-policy:
    name: 'Latest policy'
    permissions:
      contents: read
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 'Test latest_policy validation and decisions'
        run: bash tests/test_latest_policy.sh

  # Registry host validation in every lane (#139): each lane hands its
  # registry inputs to docker-promote-action in mode validate, at the
  # commit its other docker-promote-action steps pin, before anything
  # writes, and keeps no host rule of its own in bash. The action's
  # own suite tests the rule.
  registry-wiring:
    name: 'Registry validation wiring'
    permissions:
      contents: read
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 'Test registry validation wiring'
        run: bash tests/test_registry_wiring.sh

  # The lanes' source checkout (#127): every job that checks out
  # source does so in one checkout-gerrit-change-action step at the
  # shared pin, serving Gerrit and plain runs alike, with no
  # persisted credential and checkout_submodules passed through.
  checkout-wiring:
    name: 'Checkout wiring'
    permissions:
      contents: read
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 'Test checkout wiring'
        run: bash tests/test_checkout_wiring.sh

  # A bad Grype input fails each lane's gerrit-validate job, through
  # grype-scan-action in validate-only mode, before any build job
  # starts. A call to a lane with one would fail this run, so this job
  # runs the validator as the lanes do: the action at the lanes' pin
  # with build-test's defaults and a gate-when it does not know. The
  # step must fail and the next step requires that it did. Validate-only
  # makes no network request, so the job needs no harden-runner, and
  # it reads nothing, so it needs no checkout and no permission.
  # tests/test_dependency_change.sh checks the step's inputs stay
  # build-test's defaults and that the verdict is read.
  grype-validate-rejects:
    name: 'Grype validation rejects a bad input'
    permissions: {}
    runs-on: 'ubuntu-latest'
    timeout-minutes: 2
    steps:
      - name: 'Validate Grype inputs'
        id: reject
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@f65dca2762823cfc8f376e32fee9baa6f3292696  # v0.6.2
        with:
          validate-only: 'true'
          fail-on: 'medium'
          only-fixed: 'true'
          dependency-policy: 'declared'
          transitive-fail-on: 'critical'
          gate-when: 'sometimes'
          remediation-window-days: ''
          remediation-window-start: ''
          cache-db: 'true'
          bypass-repository: ''
      - name: 'Require the rejection'
        shell: bash
        env:
          OUTCOME: ${{ steps.reject.outcome }}
        run: |
          # The action rejects the gate-when; anything else is a bug
          # in the action at this pin or in this job's inputs
          if [ "${OUTCOME}" != 'failure' ]; then
            echo "::error::Validate-only accepted gate-when 'sometimes'" \
              "(outcome '${OUTCOME}')"
            exit 1
          fi
          echo "Grype validation rejected the bad input ✅"

  # The Grype dependency-change gate: the policy inputs and their route
  # to grype-scan-action in every lane, the validator each lane runs in
  # validate-only mode checked against its scan, the ecosystems check
  # run against valid and invalid values, the verify lane's
  # detection in repository-metadata and its job output, the two
  # calls above that prove the verdict's round trip, the step that turns
  # custom Dockerfile names into the action's patterns, and the
  # action itself at its pin, run against a scratch repository to show
  # a Dockerfile with a custom name counts only once those patterns
  # reach it. Needs github.com to fetch the action at its pin.
  dependency-change:
    name: 'Dependency change gate'
    permissions:
      contents: read
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 'Test the dependency-change gate wiring and the action'
        run: bash tests/test_dependency_change.sh

  # build_artifacts in every lane: the input and its three build-job
  # steps compared across the lanes, then the validate and place step
  # scripts, extracted from each workflow, run against valid input,
  # every malformed entry, missing artefacts and artefacts that would
  # overwrite the checkout.
  build-artifacts-checks:
    name: 'Build artefact checks'
    permissions:
      contents: read
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 'Test build_artifacts validation and placement'
        run: bash tests/test_build_artifacts.sh

  # signature_format in the release lane: the installed cosign release
  # pin, the up-front validation step, and the sign step's arguments
  # for each format, run against a fake cosign. A real signature only
  # exists once images push, which no dry run reaches.
  signature-format:
    name: 'Signature format'
    permissions:
      contents: read
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 'Test signature_format argument construction'
        run: bash tests/test_signature_format.sh

  # The merge lane's gate-then-stage condition: snapshot-publish's
  # 'if:' extracted from merge.yaml and evaluated over every
  # combination of gate results and toggles. The dry-run legs above
  # cannot fail a gate without failing this run, so the failure cases
  # are proven here: no failed or cancelled gate admits a publish.
  merge-gating-condition:
    name: 'Merge gating condition'
    permissions:
      contents: read
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 'Test the snapshot-publish gate condition'
        run: bash tests/test_merge_gating.sh

  # The verify lane's release-file checks, case by case: the wiring
  # of check-release and release-verify, the registry input step
  # extracted from the workflow, docker-release-detect-action at its
  # pinned commit against valid and malformed release files (each
  # malformed one must fail), and docker-promote-action at its pinned
  # commit in verify mode against a fake crane.
  verify-release-checks:
    name: 'Release file checks'
    permissions:
      contents: read
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 'Test release-file checks'
        run: bash tests/test_verify_release.sh

  # The impostor-commit ignores in .github/zizmor.yml against the
  # examples' all-zero placeholder 'uses:' lines. The zizmor hook runs
  # offline, where impostor-commit never runs, so a shifted placeholder
  # line would otherwise go unnoticed. Every placeholder needs an
  # entry, every entry a placeholder, and no entry may land on a real
  # 'uses:' line in an example sharing its base name.
  zizmor-ignores:
    name: 'Zizmor placeholder ignores'
    permissions:
      contents: read
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 'Check zizmor placeholder ignores'
        run: bash tests/test_zizmor_ignores.sh

  # The merge and release caller examples' workflow-level concurrency
  # (#138): each must queue pending runs ('queue: max') and never
  # cancel one in progress, so a merge burst cannot drop a release
  # file and a re-pushed tag cannot cancel a release mid-publish.
  example-concurrency:
    name: 'Example concurrency settings'
    permissions:
      contents: read
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: '@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 'Check example concurrency settings'
        run: bash tests/test_example_concurrency.sh
