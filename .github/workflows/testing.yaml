---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Exercises the reusable workflow SKELETONS in this repository against
# downstream fixture repositories, in parallel, to prove the generic
# scaffolding (job graph, harden-runner wiring, dual checkout, artifact
# plumbing, SBOM/Grype chain) functions end-to-end. The placeholder
# build/test/audit/SBOM steps are language-agnostic, so the matrix runs
# against fixtures of different languages by design.
#
# The reusable workflows are referenced by LOCAL path so this always
# validates the current branch's workflows.
#
# The build-test-release and merge skeletons are NOT self-tested here:
# build-test-release requires a signed semver tag-push context (and
# creates/promotes GitHub releases), and merge requires a merged-commit
# context (and would exercise publish legs); neither is available or
# safe on a pull request. Instantiating repos validate those through
# their own release/merge cycles.
name: 'Testing 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
      - master

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  # Fixture legs exercising every image-selection mode against the two
  # deterministic fixtures:
  #   - leg 1: test-docker-project (single image, Dockerfile under
  #     docker/) — auto-discovery under full block-mode egress
  #   - leg 2: test-docker-monorepo — auto-discovery of three per-image
  #     directories, building the same-repository FROM chain in
  #     directory-sort order, plus the test_command hook (the smoke
  #     script verifies the chain markers)
  #   - leg 3: test-docker-monorepo — explicit 'images' input with
  #     per-image build_args (BASE_IMAGE override for the namespaced
  #     chain), image_namespace, and the build_permit_egress_traffic
  #     hatch plumbing
  #   - leg 4: test-docker-monorepo — the build_command escape hatch
  #     ('make images' builds via project tooling; the workflow
  #     enumerates what it created), plus the test_command hook
  # Lint and Grype findings in fixture CONTENT soft-fail: the
  # self-test validates that the machinery executes, not the hygiene
  # of fixture Dockerfiles.
  build-test:
    name: 'Build/Test'
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: 'lfreleng-actions/test-docker-project'
            ref: 'v0.1.0'
            images: ''
            image_namespace: ''
            build_command: ''
            test_command: ''
            build_permit_egress_traffic: false
          - repository: 'lfreleng-actions/test-docker-monorepo'
            ref: 'v0.0.1'
            images: ''
            image_namespace: ''
            build_command: ''
            test_command: 'TAG=verify tests/scripts/test_images.sh'
            build_permit_egress_traffic: false
          - repository: 'lfreleng-actions/test-docker-monorepo'
            ref: 'v0.0.1'
            # yamllint disable-line rule:line-length
            images: '[{"name": "base-alpine", "context": "base-alpine"}, {"name": "chain-child", "context": "chain-child", "build_args": ["BASE_IMAGE=lfreleng/base-alpine:verify"]}, {"name": "util-echo", "context": "util-echo"}]'
            image_namespace: 'lfreleng'
            build_command: ''
            # yamllint disable-line rule:line-length
            test_command: 'NAMESPACE=lfreleng TAG=verify tests/scripts/test_images.sh'
            build_permit_egress_traffic: true
          - repository: 'lfreleng-actions/test-docker-monorepo'
            ref: 'v0.0.1'
            images: ''
            image_namespace: ''
            build_command: 'make images TAG=verify'
            test_command: 'TAG=verify tests/scripts/test_images.sh'
            build_permit_egress_traffic: false
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: ./.github/workflows/build-test.yaml
    with:
      repository: ${{ matrix.repository }}
      ref: ${{ matrix.ref }}
      images: ${{ matrix.images }}
      image_namespace: ${{ matrix.image_namespace }}
      build_command: ${{ matrix.build_command }}
      test_command: ${{ matrix.test_command }}
      build_permit_egress_traffic: ${{ matrix.build_permit_egress_traffic }}
      audit_permit_fail: true
      grype_permit_fail: true
