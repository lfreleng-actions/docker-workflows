---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Reusable Docker build/test/release pipeline (Model A: tag-driven).
#
# Reproduces the canonical Linux Foundation release pipeline shape for
# container images: a validated, signed semver tag drives the version,
# the images build (multi-platform capable) and push to GHCR, Docker
# Hub and/or a Nexus 3 registry, each pushed image signs with Sigstore
# cosign (keyless)
# and gains SLSA build provenance, and the audits gate the release:
#   tag-validate -> build -> sign
#   docker-metadata -> { dockerfile-lint | build }
#   build -> { sbom -> grype } -> tests
#     -> attach-artefacts -> promote-release
#
# Registries:
#   * GHCR: ghcr.io/<owner>/<name>, authenticated with GITHUB_TOKEN
#     (callers grant packages: write)
#   * Docker Hub: docker.io/<namespace>/<name>, authenticated
#     with the optional DOCKERHUB_USERNAME/DOCKERHUB_PASSWORD secrets;
#     skips with a warning when unset
#   * The registry input: <registry>/<namespace>/<name>, for Nexus 3
#     (and, untested, Artifactory), authenticated to its host[:port]
#     with the credential credential-load-action loads from 1Password
#     through the optional OP_SERVICE_ACCOUNT_TOKEN/VAULT_MAPPING_JSON
#     secrets; skips with a warning when unset. The build, sign and
#     promote-release jobs each load it for themselves, and only when
#     they push or tag there.
#
# Platform strategy: the default single-platform build uses the
# buildx docker driver, so images build in array order against the
# daemon and same-repository FROM chains resolve exactly as in the
# verify lane. Passing more than one platform switches to the
# docker-container driver with QEMU emulation and pushes manifest
# lists directly; same-repository chains must then reference
# registry-resolvable images (or use build_args).
#
# The build_command escape hatch is deliberately absent from this
# lane: project-tooling builds cannot produce multi-platform
# manifests or per-registry digests reliably. Repositories needing it
# release through merge.yaml (Model B).
#
# The dry_run input runs the lane without publishing anything: it
# validates the tag for real, discovers, builds, lints, scans and
# tests the images, and reports the release assets and promotion it
# would produce -- while creating no release, pushing no image and
# moving no tag. See the input's description for what a dry run
# cannot prove.
#
# Call this from a thin caller workflow on a tag push; see
# examples/build-test-release/ for both a plain GitHub-native caller
# and a Gerrit-sourced caller.
name: '[R] Docker Build/Test/Release'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      # --- Checkout target (defaults to the calling repository) ---
      repository:
        description: 'Repository to check out (owner/name)'
        required: false
        type: string
        default: ''
      ref:
        description: >-
          Branch/tag/SHA to check out for the metadata/housekeeping
          jobs (empty = default branch). The jobs that discover,
          build, lint and test content always check out the validated
          release tag, so published images match the tag regardless
          of this input.
        required: false
        type: string
        default: ''

      # --- Project layout ---
      path_prefix:
        description: 'Path to the project root directory'
        required: false
        type: string
        default: '.'

      # --- Image selection/build ---
      images:
        description: >-
          JSON array describing the images to build; an empty string
          (the default) auto-discovers Dockerfiles under path_prefix.
          When provided, the array must be non-empty; each entry takes
          name and context (required), dockerfile (default
          context/Dockerfile), target and build_args (optional list of
          KEY=VALUE strings). Array order is the build order.
        required: false
        type: string
        default: ''
      namespace_mode:
        description: >-
          How the Docker Hub namespace (organisation/user) and the
          local image alias prefix resolve: 'none' (no namespace),
          'auto' (the lowercased owner of the repository built) or
          'manual' (the namespace input). dockerhub_publish requires
          'auto' or 'manual'. GHCR images always publish under the
          calling repository owner.
        required: false
        type: string
        default: 'none'
      namespace:
        description: >-
          Image namespace for namespace_mode 'manual' (e.g. 'onap');
          an error with any other mode. Docker Hub takes a single
          path component.
        required: false
        type: string
        default: ''
      platforms:
        description: >-
          Comma-separated target platforms (e.g.
          'linux/amd64,linux/arm64'). More than one platform engages
          QEMU emulation and pushes a manifest list per image.
        required: false
        type: string
        default: 'linux/amd64'
      build_timeout_minutes:
        description: 'Timeout for the build job in whole minutes'
        required: false
        type: number
        default: 30

      # --- Registry publishing ---
      ghcr_publish:
        description: 'Publish images to GHCR (ghcr.io/<owner>/<name>)'
        required: false
        type: boolean
        default: true
      dockerhub_publish:
        description: >-
          Publish images to Docker Hub
          (docker.io/<namespace>/<name>). Requires namespace_mode
          'auto' or 'manual' and the
          DOCKERHUB_USERNAME/DOCKERHUB_PASSWORD secrets; skips with a
          warning when the secrets are unavailable.
        required: false
        type: boolean
        default: false
      registry:
        description: >-
          A further registry to publish to, as host[:port] with an
          optional repository path; empty (the default) adds none.
          Images push as <registry>/<namespace>/<name>, or
          <registry>/<name> under namespace_mode 'none'. Nexus 3
          addresses a repository by port (nexus3.onap.org:10002);
          JFrog Artifactory's repository-path method puts it in the
          path (acme.jfrog.io/docker-release), which validates and
          resolves but is untested against a live instance. The lane
          logs in to host[:port] with the credential
          credential-load-action loads for the published repository,
          and skips this registry with a warning when the
          OP_SERVICE_ACCOUNT_TOKEN/VAULT_MAPPING_JSON secrets are
          unavailable. GHCR and Docker Hub hosts are refused: use
          ghcr_publish and dockerhub_publish.
        required: false
        type: string
        default: ''
      registry_user:
        description: >-
          Login username for the registry input; empty derives it from
          the published repository's name (the 1Password credential
          naming contract). The credential itself always keys on that
          name. An error without the registry input.
        required: false
        type: string
        default: ''
      push_latest:
        description: >-
          Additionally publish the 'latest' tag per image. The tag
          applies registry-side during release promotion, after every
          gate (lint, scan, tests, signing) has passed, so a failed
          release never moves 'latest'.
        required: false
        type: boolean
        default: false
      dry_run:
        description: >-
          Run the release lane without publishing. Dry runs skip
          credential loading and registry login and resolve no target
          registry, so the build loads images locally and pushes
          nothing; the build job's summary reports the references
          each requested registry would receive and the login it
          would use. They create no
          draft release, attach no release asset, promote no release
          and move no 'latest' tag. Everything else runs for real,
          including tag validation, discovery, the build, hadolint,
          the image SBOMs, the Grype audit and the tests. The tag
          comes from the ref input rather than a tag-push context, so
          a dry run needs ref to name a tag.

          What a dry run cannot prove: cosign signing and SLSA
          provenance (the sign job has no pushed digest to sign, so
          it skips), per-registry digest capture, and the release
          promotion itself. Those exist only when images actually
          push. A multi-platform dry run is also partial: with no
          registry to hold a manifest list, the build produces the
          scan platform alone and warns that the others were
          skipped, so it confirms the requested platform builds but
          never assembles or pushes a manifest list. Because that
          build targets one platform, it uses the docker driver and
          same-repository FROM chains resolve as they do in the
          verify lane.
        required: false
        type: boolean
        default: false

      # --- Tests ---
      test_command:
        description: >-
          Shell command run from path_prefix after the built images
          load into the Docker daemon (a smoke/integration hook, e.g.
          'make test'). The IMAGES environment variable carries a JSON
          array of the built image tags. Empty skips the test step
          with a notice.
        required: false
        type: string
        default: ''
      test_permit_fail:
        description: 'Permit test failures without failing the workflow'
        required: false
        type: boolean
        default: false

      # --- Dockerfile lint (hadolint) ---
      lint_enabled:
        description: 'Run the Dockerfile lint job (set false to skip)'
        required: false
        type: boolean
        default: true
      lint_permit_fail:
        description: 'Permit hadolint findings (the NO_BLOCK pattern)'
        required: false
        type: boolean
        default: false
      audit_permit_fail:
        description: >-
          DEPRECATED alias for lint_permit_fail, retained so existing
          callers keep working. This job lints Dockerfiles; it does not
          audit dependencies. Elsewhere in the estate audit_* governs a
          dependency audit, so the name is being retired here. Prefer
          lint_permit_fail; this input is removed at the next major.
        required: false
        type: boolean
        default: false

      # --- SBOM ---
      sbom_enabled:
        description: >-
          Generate an image SBOM (set false to skip). The Grype scan
          reads the SBOM, so skipping generation leaves it nothing to
          scan. To keep the SBOM but drop the scan, use grype_enabled.
        required: false
        type: boolean
        default: true

      # --- Grype scan ---
      grype_enabled:
        description: >-
          Run the Grype vulnerability scan over the generated SBOMs (set
          false to skip). Decoupling is one-way: disabling the scan
          keeps the SBOMs, but disabling the SBOM job also stops the
          scan, which has nothing to read.
        required: false
        type: boolean
        default: true
      grype_fail_on:
        description: 'Minimum severity that fails the Grype scan'
        required: false
        type: string
        default: 'medium'
      grype_permit_fail:
        description: >-
          Permit Grype findings without failing the job. When false, falls
          back to the NO_BLOCK_AUDIT_FAIL repository variable at runtime.
        required: false
        type: boolean
        default: false
      grype_cache_db:
        description: >-
          How the Grype scan uses the Actions cache for the
          vulnerability database: 'true' restores and saves,
          'restore-only' restores but never saves, 'false' disables
          caching. Cache entries rotate on the database build time, so
          exactly one job may write a given prefix; where a caller
          invokes this workflow several times in parallel, give one
          call 'true' and the rest 'restore-only'. With several
          writers, creation order and build order can disagree, and a
          restore then returns an older database than the newest
          saved.
        required: false
        type: string
        default: 'true'

      # --- Runner hardening ---
      harden_runner_egress:
        description: "Harden-runner egress policy: 'block' or 'audit'"
        required: false
        type: string
        default: 'block'
      harden_runner_allowlist:
        description: 'Out-of-band harden-runner allow-list configuration'
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@e0e35011ee145321a51d3226f044ec88dfe645b1'  # v0.16.4
      build_permit_egress_traffic:
        description: >-
          Run harden-runner in audit mode for the build job only,
          permitting unrestricted egress. Use when base images or
          build-time dependencies come from registries/CDNs that are
          impractical to enumerate in the allow-list. Other jobs stay
          governed by harden_runner_egress; left unset, the build job
          follows it too.
        required: false
        type: boolean
        default: false

      # --- Gerrit-aware checkout (empty unless dispatched via Gerrit) ---
      gerrit_refspec:
        description: 'Gerrit refspec of the change under test'
        required: false
        type: string
        default: ''
      gerrit_project:
        description: 'Gerrit project name'
        required: false
        type: string
        default: ''
      gerrit_branch:
        description: 'Gerrit target branch'
        required: false
        type: string
        default: ''
      gerrit_url:
        description: >-
          Gerrit server URL. Empty falls back to the GERRIT_URL repository
          variable at runtime.
        required: false
        type: string
        default: ''

      # --- Release-only inputs ---
      attestations:
        description: >-
          Generate SLSA build provenance attestations for every pushed
          image (by digest; pushed to the registry for GHCR images).
          Keep it toggleable for air-gapped or Gerrit-mirrored
          consumers that cannot reach Sigstore.
        required: false
        type: boolean
        default: true
      sigstore_sign:
        description: >-
          Sign every pushed image with Sigstore cosign (keyless/OIDC,
          by digest). Keep it toggleable for air-gapped or
          Gerrit-mirrored consumers that cannot reach Sigstore.
        required: false
        type: boolean
        default: true
      sigstore_sign_required_registries:
        description: >-
          Space or comma separated registry hostnames whose cosign
          signing failures must fail the release. Signing runs against
          every pushed image regardless; this states which registries
          are known to store cosign signature artefacts, because
          support varies and cannot always be inferred from the
          hostname (see the registry capability matrix in README.md).
          A failure against a registry outside this list degrades to a
          warning, so an unproven registry cannot take a release down.
          Use '*' to require every registry, or '' to make signing
          best-effort everywhere.
        required: false
        type: string
        default: 'ghcr.io docker.io'

    secrets:
      DOCKERHUB_USERNAME:
        description: >-
          Docker Hub username used when dockerhub_publish is true. The
          build job skips Docker Hub publishing with a warning when
          unset, so PR/self-test contexts still work.
        required: false
      DOCKERHUB_PASSWORD:
        description: >-
          Docker Hub password or access token used when
          dockerhub_publish is true. The build job skips Docker Hub
          publishing with a warning when unset, so PR/self-test
          contexts still work.
        required: false
      OP_SERVICE_ACCOUNT_TOKEN:
        description: >-
          1Password service-account token credential-load-action uses
          to fetch the registry input's credential from the common
          per-org CI/CD vault (op://<vault>/<repository-name>/password).
          The build job skips that registry with a warning when unset,
          so PR/self-test contexts still work.
        required: false
      VAULT_MAPPING_JSON:
        description: >-
          Base64-encoded JSON mapping of organisation name to
          1Password vault ID, keyed on github.repository_owner;
          consumed by credential-load-action to resolve the vault. The
          build job skips the registry input with a warning when
          unset, so PR/self-test contexts still work.
        required: false

    outputs:
      tag:
        description: 'Validated release tag/version string'
        value: ${{ jobs.tag-validate.outputs.tag }}
      pushed:
        description: >-
          JSON array of pushed images as {name, image, digest}
          objects, one entry per image per registry
        value: ${{ jobs.build.outputs.pushed }}
      registry_plan:
        description: >-
          Dry runs only: JSON array of the registry plan's lines, the
          login and the pushes each requested registry would receive
          and any credentials it lacks; empty when the run publishes
        value: ${{ jobs.build.outputs.registry_plan }}

permissions: {}

jobs:
  gerrit-validate:
    name: 'Validate Gerrit Inputs'
    # Fails fast with a clear message when gerrit_refspec is set without
    # the project/branch the Gerrit checkout path also requires. The
    # build-chain root job depends on this, so invalid Gerrit inputs stop
    # the pipeline early and cleanly. This job always runs (only the
    # Gerrit validation step is conditional), so gating dependents on it
    # does not trip GitHub's "skipped need skips dependents" behaviour.
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    outputs:
      # The effective image namespace; empty for namespace_mode none
      namespace: ${{ steps.namespace.outputs.namespace }}
    steps:
      - name: 'Validate platforms input'
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          # Require a comma-separated list of os/arch[/variant]
          # platform specifiers; the value reaches docker buildx
          # --platform and must not carry hostile content
          pattern='^[a-z0-9]+(/[a-z0-9]+){1,2}'
          pattern+='(,[a-z0-9]+(/[a-z0-9]+){1,2})*$'
          if [[ ! "${PLATFORMS}" =~ ${pattern} ]]; then
            echo "::error::Invalid platforms input: ${PLATFORMS}" \
              "(expected csv of os/arch[/variant] specifiers)"
            exit 1
          fi
          echo "Platforms input validated ✅"

      # Mirrors merge.yaml's check of its registry inputs, so the two
      # lanes accept the same values, save that the host must also be
      # one Docker reads as a host (see below). It runs whether or not
      # credentials exist, so dry runs and fork pull requests surface
      # a bad value too.
      - name: 'Validate registry inputs'
        shell: bash
        env:
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USER: ${{ inputs.registry_user }}
        run: |
          # Validate the registry input and its username override
          if [ -z "${REGISTRY}" ]; then
            if [ -n "${REGISTRY_USER}" ]; then
              echo "::error::registry_user is set but registry is" \
                "empty; set registry or clear registry_user"
              exit 1
            fi
            echo "No registry input; GHCR/Docker Hub only ✅"
            exit 0
          fi
          # Require host[:port] with an optional repository path: the
          # value composes image references and reaches docker login,
          # docker push, cosign and crane, so schemes, credentials,
          # query strings or hostile content must stop here. The path
          # serves Artifactory's repository-path method, where the
          # repository key sits below the host rather than on a port
          # of its own as in Nexus 3.
          #
          # Path components take Docker's reference grammar: runs of
          # lowercase alphanumerics joined by a single '.' or '_',
          # exactly '__', or one or more '-'. Docker and crane reject
          # anything else when they parse the reference, so a looser
          # rule would accept a value here only to fail the publish
          # later. The rule also excludes '.', '..' and trailing
          # separators without needing checks of their own.
          #
          # The host takes dot-separated DNS labels of up to 63
          # characters, so '.', 'a..b' or an over-long label stop here
          # rather than in Docker.
          label='[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?'
          pattern="^${label}([.]${label})*(:[0-9]+)?"
          pattern+='(/[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*)*$'
          if [[ ! "${REGISTRY}" =~ ${pattern} ]]; then
            echo "::error::Invalid registry input: ${REGISTRY}" \
              "(expected host[:port] with an optional repository" \
              "path of lowercase components)"
            exit 1
          fi
          # Docker reads a first component as a registry host only
          # when it holds a '.' or a port or is localhost; anything
          # else names a Docker Hub namespace, so the lane would log
          # in to one place and push to docker.io.
          case "${REGISTRY%%/*}" in
            *.* | *:* | localhost) ;;
            *)
              echo "::error::registry '${REGISTRY}' has no '.' or" \
                "port in its host, so Docker would push it to Docker" \
                "Hub; use a fully qualified host or add the port"
              exit 1
              ;;
          esac
          # GHCR and Docker Hub have inputs of their own, with their
          # own credentials. Logging in to either with the 1Password
          # credential would replace that login in the docker config
          # the later steps share.
          host="${REGISTRY%%/*}"
          host="${host%%:*}"
          case "${host,,}" in
            ghcr.io|docker.io|index.docker.io|registry-1.docker.io)
              echo "::error::registry '${REGISTRY}' names GHCR or" \
                "Docker Hub; use ghcr_publish or dockerhub_publish"
              exit 1
              ;;
          esac
          echo "Registry input validated: ${REGISTRY} ✅"

      # A dry run has no tag-push context to infer the release tag
      # from, so it validates the tag named by the ref input instead.
      # Catching an empty ref here, rather than in tag-validate,
      # keeps the failure at the input boundary where the caller can
      # see what to fix.
      - name: 'Validate dry-run inputs'
        if: ${{ inputs.dry_run }}
        shell: bash
        env:
          REF: ${{ inputs.ref }}
        run: |
          # A dry run resolves its tag from the ref input
          if [ -z "${REF}" ]; then
            echo "::error::dry_run requires the ref input to name" \
              "the tag to validate and release from; there is no" \
              "tag-push context to infer it from"
            exit 1
          fi
          echo "Dry run will validate and release tag: ${REF}"

      - name: 'Require Gerrit project, branch and URL'
        if: inputs.gerrit_refspec != ''
        shell: bash
        env:
          GERRIT_PROJECT: ${{ inputs.gerrit_project }}
          GERRIT_BRANCH: ${{ inputs.gerrit_branch }}
          # yamllint disable-line rule:line-length
          GERRIT_URL: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
        run: |
          # gerrit_refspec is set, so the Gerrit checkout path runs and
          # also requires gerrit_project, gerrit_branch and a resolvable
          # Gerrit URL (the gerrit_url input or the GERRIT_URL variable).
          missing=''
          if [ -z "${GERRIT_PROJECT}" ]; then
            missing="${missing} gerrit_project"
          fi
          if [ -z "${GERRIT_BRANCH}" ]; then
            missing="${missing} gerrit_branch"
          fi
          if [ -z "${GERRIT_URL}" ]; then
            missing="${missing} gerrit_url/GERRIT_URL"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::gerrit_refspec is set but missing:${missing}"
            exit 1
          fi
          echo "Gerrit inputs validated ✅"

      # Resolved once here, the root every job descends from; each
      # job that names an image reads this job's namespace output.
      # The Docker Hub checks run whether or not credentials exist,
      # so dry runs and fork pull requests surface them too.
      - name: 'Resolve image namespace'
        id: namespace
        shell: bash
        env:
          NAMESPACE_MODE: ${{ inputs.namespace_mode }}
          NAMESPACE: ${{ inputs.namespace }}
          REPOSITORY: ${{ inputs.repository || github.repository }}
          DOCKERHUB_PUBLISH: ${{ inputs.dockerhub_publish }}
        run: |
          # none: no prefix; auto: the lowercased repository owner;
          # manual: the namespace input
          case "${NAMESPACE_MODE}" in
            none) namespace='' ;;
            auto) namespace="${REPOSITORY%%/*}"; namespace="${namespace,,}" ;;
            manual) namespace="${NAMESPACE}" ;;
            *)
              echo "::error::Invalid namespace_mode '${NAMESPACE_MODE}'" \
                "(expected none, auto or manual)"
              exit 1
              ;;
          esac
          if [ "${NAMESPACE_MODE}" != 'manual' ] && [ -n "${NAMESPACE}" ]
          then
            echo "::error::namespace '${NAMESPACE}' is set but" \
              "namespace_mode is '${NAMESPACE_MODE}'; set namespace_mode" \
              "to 'manual' or clear namespace"
            exit 1
          fi
          if [ "${NAMESPACE_MODE}" = 'manual' ] && [ -z "${NAMESPACE}" ]; then
            echo "::error::namespace_mode 'manual' requires the namespace input"
            exit 1
          fi
          # Docker's repository path grammar: '/'-separated components,
          # each runs of lowercase alphanumerics joined by a single '.'
          # or '_', exactly '__', or one or more '-'
          component='[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*'
          if [ -n "${namespace}" ] &&
            [[ ! "${namespace}" =~ ^${component}(/${component})*$ ]]; then
            echo "::error::Invalid namespace '${namespace}'" \
              "(namespace_mode ${NAMESPACE_MODE}): expected '/'-separated" \
              "components of lowercase alphanumerics joined by a single" \
              "'.' or '_', exactly '__', or one or more '-'"
            exit 1
          fi
          # A Docker Hub namespace is one organisation or user
          if [ "${DOCKERHUB_PUBLISH}" = 'true' ] &&
            [[ -z "${namespace}" || "${namespace}" == */* ]]; then
            echo "::error::dockerhub_publish requires namespace_mode" \
              "'auto' or 'manual' resolving to a single path component" \
              "(the Docker Hub organisation or user); got" \
              "'${namespace}' from namespace_mode ${NAMESPACE_MODE}"
            exit 1
          fi
          echo "namespace=${namespace}" >> "${GITHUB_OUTPUT}"
          echo "Image namespace (${NAMESPACE_MODE}): ${namespace:-<none>} ✅"

  repository-metadata:
    name: 'Repository Metadata'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 'Gather repository metadata'
        id: repo-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/repository-metadata-action@847400e0d0b34cc88a572fa9575accd80401b796  # v0.3.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: 'true'
          gerrit_summary: ${{ inputs.gerrit_refspec != '' }}
          artifact_upload: 'true'
          artifact_formats: 'json'

  tag-validate:
    name: 'Validate Tag Push'
    needs: gerrit-validate
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write  # Needed to draft a release
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag-validate.outputs.tag_name }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 'Verify pushed tag'
        id: 'tag-validate'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/tag-validate-action@63470621b8ebc5c4fc86ebb616727dd0a7285dd9  # v1.1.7
        with:
          # A tag push leaves tag_location empty and the action infers
          # the tag from GITHUB_REF. A dry run has no such context, so
          # it names the tag explicitly in the action's remote
          # ORG/REPO/TAG form. Every validation below still applies:
          # a dry run against an unsigned or non-semver tag fails
          # exactly as a real release would.
          # yamllint disable-line rule:line-length
          tag_location: ${{ inputs.dry_run && format('{0}/{1}', inputs.repository || github.repository, inputs.ref) || '' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          require_type: 'semver'
          reject_development: 'true'
          require_github: 'true'
          # yamllint disable-line rule:line-length
          require_signed: 'ssh,gpg-unverifiable'  # Cannot verify GPG without key

      # Creating the draft is the lane's first write, so it is also
      # the first thing a dry run skips. The jobs below read the tag,
      # not the release, so they behave identically either way.
      - name: 'Ensure draft release exists'
        id: 'ensure-release'
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag-validate.outputs.tag_name }}
        run: |
          # Ensure draft release exists
          # Check if release exists and get its draft status
          if RELEASE_INFO=$(gh release view "$TAG" \
            --json isDraft 2>/dev/null); then
            IS_DRAFT=$(echo "$RELEASE_INFO" | jq -r '.isDraft')
            if [ "$IS_DRAFT" = "true" ]; then
              echo "Draft release for tag $TAG already exists"
            else
              echo "::error::A published release already exists for $TAG;" \
                "delete or recreate it as a draft, then re-run."
              exit 1
            fi
          else
            echo "Creating draft release for tag $TAG"
            gh release create "$TAG" \
              --draft \
              --title "Release $TAG" \
              --notes "Automated release for $TAG"
          fi

  docker-metadata:
    name: 'Docker Metadata'
    needs:
      - 'gerrit-validate'
      - 'tag-validate'
    runs-on: ubuntu-latest
    outputs:
      images_json: ${{ steps.discover.outputs.images_json }}
      image_count: ${{ steps.discover.outputs.image_count }}
      build_id: ${{ steps.discover.outputs.build_id }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          # Pin to the validated tag: the published/audited content
          # must match the release tag, not a caller-chosen ref
          ref: ${{ needs.tag-validate.outputs.tag }}
          persist-credentials: false

      # An explicit 'images' input wins; otherwise the action walks
      # the estate-observed Dockerfile locations, keeping discovery
      # order as build order. It also draws the per-invocation
      # build_id that names this run's artifacts.
      - name: 'Discover images'
        id: discover
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/docker-build-matrix-action@2c0b0496c460cd9d1405352476e77c913964507e  # v0.0.1
        with:
          path_prefix: ${{ inputs.path_prefix }}
          images: ${{ inputs.images }}
          repository: ${{ inputs.repository || github.repository }}
          # Bind ref to this job's effective checkout ref, so the
          # build id discriminates on the tree actually discovered.
          # This lane checks out the validated release tag, not
          # inputs.ref, which its own description limits to the
          # metadata and housekeeping jobs.
          ref: ${{ needs.tag-validate.outputs.tag }}
          gerrit_refspec: ${{ inputs.gerrit_refspec }}
          image_namespace: ${{ needs.gerrit-validate.outputs.namespace }}
          platforms: ${{ inputs.platforms }}
          # build_command stays unset: this lane deliberately omits
          # the escape hatch (see the workflow header), so an empty
          # discovery is an error here

  build:
    name: 'Docker Build/Push'
    needs:
      - 'gerrit-validate'
      - 'tag-validate'
      - 'docker-metadata'
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.build.outputs.images }}
      image_count: ${{ steps.build.outputs.image_count }}
      pushed: ${{ steps.build.outputs.pushed }}
      pushed_count: ${{ steps.build.outputs.pushed_count }}
      # Which registries published ('true'/'false'), and how the jobs
      # that push or tag after the build (sign, promote-release)
      # authenticate to the registry input: empty unless images
      # published there. promote-release reads these exact decisions,
      # never a substring of pushed, which a registry input such as
      # private-docker.io would match.
      ghcr: ${{ steps.registries.outputs.ghcr }}
      dockerhub: ${{ steps.registries.outputs.dockerhub }}
      registry_login: ${{ steps.registries.outputs.registry_login }}
      registry_user: ${{ steps.registries.outputs.registry_user }}
      credential_name: ${{ steps.registries.outputs.credential_name }}
      # A dry run's registry plan, as a JSON array of its lines
      registry_plan: ${{ steps.registries.outputs.plan }}
    permissions:
      contents: read
      packages: write  # Push images to GHCR
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    steps:
      # The build job can opt into audit egress independently of the
      # other jobs via build_permit_egress_traffic, for base images and
      # build-time dependencies from registries/CDNs impractical to
      # enumerate in the allow-list. Left unset it follows
      # harden_runner_egress like every other job.
      #
      # One harden-runner step with the policy computed, rather than
      # two selected by condition: harden-runner declares a 'pre'
      # entry point and no 'pre-if', so its pre-phase runs whatever a
      # step-level 'if:' says. Both would engage the agent, the first
      # would win, and audit mode would be unreachable.
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ (inputs.build_permit_egress_traffic || inputs.harden_runner_egress == 'audit') && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          # Pin to the validated tag: the published/audited content
          # must match the release tag, not a caller-chosen ref
          ref: ${{ needs.tag-validate.outputs.tag }}
          persist-credentials: false

      - name: 'Resolve release version'
        id: version
        shell: bash
        env:
          TAG: ${{ needs.tag-validate.outputs.tag }}
        run: |
          # Map the release tag to the registry tag
          #
          # Require the v prefix (the LF release convention): the
          # semver gate accepts both v1.2.3 and 1.2.3, and stripping
          # an optional v would let two distinct git tags publish the
          # same supposedly immutable registry tag
          if [[ ! "${TAG}" =~ ^v ]]; then
            echo "::error::Release tags must carry the 'v' prefix" \
              "(got '${TAG}'); accepting both v1.2.3 and 1.2.3" \
              "would alias the same registry tag"
            exit 1
          fi
          version="${TAG#v}"
          # Docker tags cannot carry SemVer build metadata ('+');
          # normalise it to '_' — collision-safe because SemVer
          # forbids '_' — so a valid signed tag such as
          # v1.2.3+build.5 still releases
          version="${version//+/_}"
          if [[ ! "${version}" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Invalid release version: ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The Docker Hub and 1Password secrets stay optional so
      # PR/self-test contexts can exercise the pipeline; when absent
      # the registry they serve skips with a warning rather than
      # failing. GHCR authenticates with GITHUB_TOKEN, which always
      # exists.
      #
      # Every registry decision the lane makes is taken here, once:
      # which registries publish, the repository prefix each pushes
      # to, and the registry input's login endpoint, username and
      # credential name, which the sign and promote-release jobs
      # read from this job's outputs.
      #
      # A dry run resolves no target registry. That is the single
      # point where publishing turns off: with no repository resolved
      # the build action tags nothing for a remote, pushes nothing and
      # reports pushed_count 0, which in turn skips signing,
      # attestation and the 'latest' retag downstream. It reports the
      # plan instead. The gerrit-validate job has already rejected a
      # registry value or a namespace that publishing cannot use, dry
      # run or not.
      - name: 'Resolve target registries'
        id: registries
        shell: bash
        env:
          GHCR_PUBLISH: ${{ inputs.ghcr_publish }}
          DOCKERHUB_PUBLISH: ${{ inputs.dockerhub_publish }}
          # yamllint disable-line rule:line-length
          HAS_DOCKERHUB_CREDS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_PASSWORD != '' }}
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USER_INPUT: ${{ inputs.registry_user }}
          # yamllint disable-line rule:line-length
          HAS_REGISTRY_CREDS: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' && secrets.VAULT_MAPPING_JSON != '' }}
          # The repository actually checked out/published, which can
          # differ from GITHUB_REPOSITORY for cross-repository calls
          TARGET_REPOSITORY: ${{ inputs.repository || github.repository }}
          IMAGE_NAMESPACE: ${{ needs.gerrit-validate.outputs.namespace }}
          IMAGES_JSON: ${{ needs.docker-metadata.outputs.images_json }}
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Resolve each requested registry to the repository prefix
          # the build action pushes to and the login it needs, then
          # gate it on this run's credentials. GHCR comes first: its
          # digest is the one a multi-platform build pulls back for
          # scanning. The parallel arrays hold one entry per requested
          # registry: its kind, its prefix, its login and the secrets
          # it lacks in this run ('' when it has them all).
          declare -a kinds=() targets=() logins=() missing=()
          declare -A publish=(
            [ghcr]='false' [dockerhub]='false' [registry]='false'
          )
          if [ "${GHCR_PUBLISH}" = 'true' ]; then
            owner=$(tr '[:upper:]' '[:lower:]' <<< "${OWNER}")
            kinds+=('ghcr')
            targets+=("ghcr.io/${owner}")
            logins+=('ghcr.io with GITHUB_TOKEN')
            missing+=('')
          fi
          if [ "${DOCKERHUB_PUBLISH}" = 'true' ]; then
            kinds+=('dockerhub')
            targets+=("docker.io/${IMAGE_NAMESPACE}")
            logins+=('docker.io as DOCKERHUB_USERNAME')
            if [ "${HAS_DOCKERHUB_CREDS}" = 'true' ]; then
              missing+=('')
            else
              missing+=('DOCKERHUB_USERNAME/DOCKERHUB_PASSWORD')
            fi
          fi
          registry_user=''
          credential_name=''
          login_endpoint=''
          if [ -n "${REGISTRY}" ]; then
            # 1Password credential naming contract: the credential
            # (and by default the username) take the name of the
            # repository being published. registry_user overrides
            # the login username only, so a cross-repository call
            # still loads the target's item rather than the caller's.
            registry_user="${REGISTRY_USER_INPUT:-${TARGET_REPOSITORY##*/}}"
            credential_name="${TARGET_REPOSITORY##*/}"
            # Both values reach $GITHUB_OUTPUT, where a line break
            # would append a record of its own, so each is
            # constrained rather than merely escaped. The username
            # admits '@' and '+' as well: registry accounts genuinely
            # use them, since Artifactory SaaS identities are commonly
            # email addresses, and the value only travels to docker
            # login. The credential name keys a 1Password item and
            # derives from a repository name, so it keeps the tighter
            # set.
            if [[ ! "${registry_user}" =~ ^[A-Za-z0-9._@+-]+$ ]]; then
              echo "::error::Invalid registry username: ${registry_user}"
              exit 1
            fi
            if [[ ! "${credential_name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Invalid credential name: ${credential_name}"
              exit 1
            fi
            # docker login takes an endpoint, not an image reference.
            # A repository path belongs to the reference and
            # authenticates against the host serving it, which is how
            # Artifactory's repository-path method works; Nexus 3
            # encodes the repository in the port, so there the whole
            # value stays.
            login_endpoint="${REGISTRY%%/*}"
            kinds+=('registry')
            targets+=("${REGISTRY}${IMAGE_NAMESPACE:+/${IMAGE_NAMESPACE}}")
            logins+=("${login_endpoint} as ${registry_user}")
            if [ "${HAS_REGISTRY_CREDS}" = 'true' ]; then
              missing+=('')
            else
              missing+=('OP_SERVICE_ACCOUNT_TOKEN/VAULT_MAPPING_JSON')
            fi
          fi

          repositories=''
          plan_json=''
          if [ "${DRY_RUN}" = 'true' ]; then
            # Report what a real run would log in to and push, then
            # resolve nothing, so nothing logs in or pushes
            echo "::notice::Dry run: images build and archive, and" \
              "nothing publishes"
            mapfile -t names < <(jq -r '.[].name' <<< "${IMAGES_JSON}")
            plan=()
            if [ "${#kinds[@]}" -eq 0 ]; then
              plan+=('Dry run: no target registry requested')
            fi
            for i in "${!kinds[@]}"; do
              plan+=("Dry run: would log in to ${logins[i]}")
              for name in "${names[@]}"; do
                plan+=("Dry run: would push ${targets[i]}/${name}:${VERSION}")
              done
              if [ -n "${missing[i]}" ]; then
                note="Dry run: ${missing[i]} unavailable; a real run"
                plan+=("${note} would skip ${targets[i]%%/*} with a warning")
              fi
            done
            printf '%s\n' "${plan[@]}"
            plan_json=$(printf '%s\n' "${plan[@]}" | jq -Rnc '[inputs]')
            {
              echo '## Registry plan (dry run)'
              echo ''
              printf -- '- %s\n' "${plan[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            for i in "${!kinds[@]}"; do
              if [ -n "${missing[i]}" ]; then
                echo "::warning::${missing[i]} unavailable; skipping" \
                  "the ${targets[i]%%/*} publish"
                continue
              fi
              publish["${kinds[i]}"]='true'
              repositories+="${repositories:+,}${targets[i]}"
              echo "Publishing to ${targets[i]} (login: ${logins[i]})"
            done
            if [ -z "${repositories}" ]; then
              echo "::warning::No target registries resolved; images" \
                "will build and archive but nothing will publish"
            fi
          fi
          # Only a registry input that publishes hands its login on
          if [ "${publish[registry]}" != 'true' ]; then
            registry_user=''
            credential_name=''
            login_endpoint=''
          fi
          {
            echo "ghcr=${publish[ghcr]}"
            echo "dockerhub=${publish[dockerhub]}"
            echo "registry=${publish[registry]}"
            echo "repositories=${repositories}"
            echo "registry_login=${login_endpoint}"
            echo "registry_user=${registry_user}"
            echo "credential_name=${credential_name}"
            echo "plan=${plan_json}"
          } >> "$GITHUB_OUTPUT"

      - name: 'Login to GHCR'
        if: steps.registries.outputs.ghcr == 'true'
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Login to Docker Hub'
        if: steps.registries.outputs.dockerhub == 'true'
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      # The registry input's credential loads only in the jobs that
      # push or tag there: this one, sign and promote-release.
      # credential_grants_json wires the admin-managed
      # CREDENTIAL_LOAD_GRANTS repository/organisation variable in at
      # the workflow layer: composite actions cannot read vars, and
      # the grants list must never become a caller-facing input.
      - name: 'Load registry credential'
        id: load-credential
        if: steps.registries.outputs.registry == 'true'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/credential-load-action@025002b47f4302fb7252175c470da69435060176  # v2.0.4
        with:
          # yamllint disable-line rule:line-length
          op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          vault_mapping_json: ${{ secrets.VAULT_MAPPING_JSON }}
          credential_name: ${{ steps.registries.outputs.credential_name }}
          credential_grants_json: ${{ vars.CREDENTIAL_LOAD_GRANTS }}
          export_env: 'false'
      - name: 'Login to release registry'
        if: steps.registries.outputs.registry == 'true'
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ steps.registries.outputs.registry_login }}
          username: ${{ steps.registries.outputs.registry_user }}
          password: ${{ steps.load-credential.outputs.credential }}

      # Builds every image, pushes it to each resolved repository under
      # the release version, and captures the digest of each push from
      # the push itself (buildx metadata, or the daemon's record of its
      # own push), never re-read through the mutable tag: that digest
      # is the subject the sign job signs and attests. The local
      # working tag is the lane-neutral <name>:verify, aliased under
      # the resolved namespace when there is one, so one images
      # input travels between the lanes unchanged; local tags never
      # publish. A multi-platform build pushes a manifest list and
      # pulls one platform back by digest for the test, SBOM and scan
      # jobs: the runner's own when requested, otherwise the first.
      #
      # The action sets up QEMU for a non-native platform list and
      # picks the buildx driver: docker, whose daemon same-repository
      # FROM chains resolve against, unless a multi-platform build
      # pushes, which needs docker-container for the manifest list;
      # later images then reach earlier ones by digest through
      # --build-context. A dry run of a multi-platform project builds
      # the scan platform alone, with a warning, as there is no
      # registry to hold a manifest list. Any failure fails the job,
      # after reporting what did push: a release must never publish a
      # partial image set.
      - name: 'Build and push images'
        id: build
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/docker-build-images-action@805ce3551121c2e57f62d472fe225a0976bf5801  # v0.0.1
        with:
          images: ${{ needs.docker-metadata.outputs.images_json }}
          path_prefix: ${{ inputs.path_prefix }}
          image_namespace: ${{ needs.gerrit-validate.outputs.namespace }}
          mode: 'push'
          repositories: ${{ steps.registries.outputs.repositories }}
          tags: ${{ steps.version.outputs.version }}
          platforms: ${{ inputs.platforms }}

      - name: 'Save and upload image archives'
        # One archive per image, because the SBOM job runs syft per
        # image and Grype scans the per-image SBOMs. The artifact
        # name carries build_id so parallel workflow_call legs cannot
        # overwrite each other, and overwrite stays false so a
        # collision fails loudly. fail-on-empty keeps its default of
        # true: this lane has no permit-fail hatch, so a release that
        # built nothing must stop here.
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/docker-save-images-action@fd148182fc22be846b343f92404f4104d8d049f1  # v0.2.0
        with:
          docker-artifacts-to-save: ${{ steps.build.outputs.images_list }}
          mode: 'per-image'
          # yamllint disable-line rule:line-length
          artifact-name: docker-archives-${{ needs.docker-metadata.outputs.build_id }}
          output-directory: 'docker-archives'
          overwrite: 'false'
          retention-days: '1'

  # Signs and attests every pushed image by digest: cosign keyless
  # (Sigstore) plus SLSA build provenance via GitHub attestations,
  # matching the verification story of the other workflow families.
  # Provenance pushes to the registry for GHCR images; Docker Hub
  # and Nexus 3 lack dependable OCI referrers support, so their
  # attestations live in the GitHub attestation store (gh attestation
  # verify).
  # Signing follows the same registry-aware principle from the other
  # end: it runs everywhere, but only failures against the registries
  # named in sigstore_sign_required_registries fail the release.
  sign:
    name: 'Sign & Attest'
    runs-on: ubuntu-latest
    needs:
      - 'tag-validate'
      - 'build'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.pushed_count != '0' && (inputs.sigstore_sign || inputs.attestations) }}
    permissions:
      contents: read
      id-token: write       # Sigstore OIDC + provenance signing
      attestations: write   # GitHub attestation store
      artifact-metadata: write  # Attestation storage records
      packages: write       # Push signatures/attestations to GHCR
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.pushed) }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Login to GHCR'
        if: startsWith(matrix.image, 'ghcr.io/')
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Login to Docker Hub'
        if: startsWith(matrix.image, 'docker.io/')
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # cosign stores the signature beside the image, so signing an
      # image on the registry input needs its login too; attestation
      # never pushes there (provenance stays in the GitHub store).
      # The build job resolved the login; only the credential loads
      # again here, as job outputs must never carry a secret. Both
      # steps continue on error: a failure here surfaces as the sign
      # step's authentication failure, which that step then fails or
      # warns on per sigstore_sign_required_registries, so a
      # best-effort registry cannot block promotion.
      - name: 'Load registry credential'
        id: load-credential
        # yamllint disable-line rule:line-length
        if: inputs.sigstore_sign && needs.build.outputs.registry_login != '' && startsWith(matrix.image, format('{0}/', inputs.registry))
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/credential-load-action@025002b47f4302fb7252175c470da69435060176  # v2.0.4
        with:
          # yamllint disable-line rule:line-length
          op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          vault_mapping_json: ${{ secrets.VAULT_MAPPING_JSON }}
          credential_name: ${{ needs.build.outputs.credential_name }}
          credential_grants_json: ${{ vars.CREDENTIAL_LOAD_GRANTS }}
          export_env: 'false'
      - name: 'Login to release registry'
        # yamllint disable-line rule:line-length
        if: inputs.sigstore_sign && needs.build.outputs.registry_login != '' && startsWith(matrix.image, format('{0}/', inputs.registry))
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ needs.build.outputs.registry_login }}
          username: ${{ needs.build.outputs.registry_user }}
          password: ${{ steps.load-credential.outputs.credential }}

      - name: 'Install cosign'
        if: inputs.sigstore_sign
        # yamllint disable-line rule:line-length
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: 'Sign image with cosign (keyless)'
        if: inputs.sigstore_sign
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ matrix.digest }}
          # yamllint disable-line rule:line-length
          REQUIRED_REGISTRIES: ${{ inputs.sigstore_sign_required_registries }}
        run: |
          # Keyless signature over the immutable digest; verification:
          #   cosign verify <image>@<digest> \
          #     --certificate-identity-regexp <workflow ref> \
          #     --certificate-oidc-issuer \
          #       https://token.actions.githubusercontent.com
          #
          # cosign-installer v4.1.2 brings cosign v3.0.6, which
          # stores the signature under the legacy tag scheme, as
          # sha256-<hex>.sig beside the image. OCI 1.1 referrer
          # storage needs --registry-referrers-mode oci-1-1, which
          # this step deliberately does not pass.
          #
          # Registries differ in what they accept, so a signature
          # is only load-bearing where the caller says it is:
          # anywhere else a failure warns and the release carries on
          # unsigned for that image rather than failing outright.
          # A non-zero exit does not name a culprit — the registry,
          # Sigstore OIDC, Fulcio and Rekor can each fail this step —
          # so the messages below point at the log rather than guess.
          registry="${IMAGE%%/*}"
          read -ra required_registries <<< "${REQUIRED_REGISTRIES//,/ }"
          required='false'
          for entry in "${required_registries[@]}"; do
            if [ "${entry}" = '*' ] || [ "${entry}" = "${registry}" ]; then
              required='true'
              break
            fi
          done

          if cosign sign --yes "${IMAGE}@${DIGEST}"; then
            echo "Signed ${IMAGE}@${DIGEST}"
            exit 0
          fi

          if [ "${required}" = 'true' ]; then
            echo "::error::cosign sign failed for" \
              "${IMAGE}@${DIGEST};" \
              "sigstore_sign_required_registries lists ${registry}," \
              "so this failure fails the release"
            exit 1
          fi

          echo "::warning::cosign sign failed for" \
            "${IMAGE}@${DIGEST}; ${registry} is absent from" \
            "sigstore_sign_required_registries, so the release" \
            "continues with this image unsigned. See the step log" \
            "above for the cause"
          {
            echo "## Docker Signing"
            echo ""
            echo "⚠️ \`${IMAGE}@${DIGEST}\` published **unsigned**:" \
              "\`cosign sign\` failed and \`${registry}\` is not a" \
              "required registry. The step log names the cause," \
              "which may be the registry, Sigstore OIDC, Fulcio or" \
              "Rekor."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 'Attest build provenance'
        if: inputs.attestations
        env:
          # Carried over from actions/attest-build-provenance, which
          # set this on its way through to actions/attest: node's
          # default 16KB response header limit overflows against some
          # OCI registries on the push-to-registry path. Removing it
          # reintroduces actions/attest-build-provenance#687.
          NODE_OPTIONS: '--max-http-header-size=32768'
        # yamllint disable-line rule:line-length
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ matrix.digest }}
          push-to-registry: ${{ startsWith(matrix.image, 'ghcr.io/') }}
          # Pushed attestations also create an artifact storage record
          # (create-storage-record defaults to true), which links the
          # image to the organisation's Linked Artifacts page; the
          # version labels it with the release tag.
          subject-version: ${{ needs.tag-validate.outputs.tag }}

  dockerfile-lint:
    name: 'Dockerfile Lint'
    runs-on: ubuntu-latest
    needs:
      - 'docker-metadata'
      - 'tag-validate'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.docker-metadata.result == 'success' && inputs.lint_enabled }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          # Pin to the validated tag: the published/audited content
          # must match the release tag, not a caller-chosen ref
          ref: ${{ needs.tag-validate.outputs.tag }}
          persist-credentials: false

      - name: 'Lint Dockerfiles (hadolint)'
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
          IMAGES_JSON: ${{ needs.docker-metadata.outputs.images_json }}
          # Digest-pinned hadolint container; docker.io serves it and
          # sits in the egress allow-list.
          # yamllint disable-line rule:line-length
          HADOLINT_IMAGE: 'hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d'
          # The NO_BLOCK/soft-fail pattern: the lint_permit_fail input
          # (or its deprecated audit_permit_fail alias)
          # (or, when unset, the NO_BLOCK_AUDIT_FAIL repository
          # variable) disables failure propagation.
          # yamllint disable-line rule:line-length
          NO_BLOCK: ${{ inputs.lint_permit_fail || inputs.audit_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
        run: |
          # Lint exactly the Dockerfiles the build consumes (from the
          # resolved image list), so per-image dockerfile overrides
          # and non-standard filenames stay covered. The resolved
          # paths are relative to path_prefix (discovery runs there).
          cd "${PATH_PREFIX}"
          status=0
          while IFS= read -r dockerfile; do
            echo "::group::hadolint ${dockerfile}"
            docker run --rm \
              -v "${PWD}:/mnt:ro" -w /mnt \
              "${HADOLINT_IMAGE}" \
              hadolint "${dockerfile}" || status=1
            echo "::endgroup::"
          done < <(jq -r '.[] | .dockerfile //
            (.context + "/Dockerfile")' <<< "${IMAGES_JSON}")
          if [ "${status}" = "0" ]; then
            echo "Dockerfile lint passed ✅"
            exit 0
          fi
          if [ "${NO_BLOCK}" = "true" ]; then
            echo "::warning::hadolint reported findings, but failures" \
              "are permitted so the job will not fail."
            exit 0
          fi
          echo "::error::hadolint reported findings"
          exit 1

  sbom:
    name: 'Image SBOM'
    runs-on: ubuntu-latest
    needs: ['build', 'docker-metadata']
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.sbom_enabled }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download image archives'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: docker-archives-${{ needs.docker-metadata.outputs.build_id }}
          # Image mode only reads archives inside the workspace or
          # RUNNER_TEMP, so they land under runner.temp, not /tmp
          path: ${{ runner.temp }}/docker-archives

      # One CycloneDX SBOM per image archive, named
      # sbom-cyclonedx-<archive-basename>.json; the Grype job scans
      # every one. An empty archive directory fails the step.
      # sbom_spec_version 1.7 keeps the spec the inline syft call
      # wrote by default.
      - name: 'Generate image SBOMs'
        id: sbom
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/sbom-action@398aec0a5f332a0414246a6d9d45678ef4a95e98  # v0.3.0
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/docker-archives
          sbom_format: json
          sbom_spec_version: '1.7'

      - name: 'Upload SBOM artifacts'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-files-${{ needs.docker-metadata.outputs.build_id }}
          path: sbom-cyclonedx-*.json
          retention-days: 45
          # Fail fast: the downstream Grype job requires this artifact,
          # so a missing/misnamed SBOM must surface here, not later
          if-no-files-found: error

  grype:
    name: 'Grype Audit SBOM'
    runs-on: ubuntu-latest
    needs: ['sbom', 'docker-metadata']
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.sbom.result == 'success' && inputs.grype_enabled }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download SBOM artefact'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom-files-${{ needs.docker-metadata.outputs.build_id }}

      # The grype_permit_fail input (or, when unset, the NO_BLOCK_AUDIT_FAIL
      # repository variable) disables failure propagation so releases
      # can proceed when blocked by newly discovered CVEs in base images
      # or transitive dependencies.
      - name: 'Grype audit SBOMs'
        id: grype-audit
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@ee8d637c2324bbb84ae583abc95b56c9c4d078ee  # v0.1.0
        with:
          sbom: 'sbom-cyclonedx-*.json'
          fail-on: ${{ inputs.grype_fail_on }}
          # yamllint disable-line rule:line-length
          permit-fail: ${{ inputs.grype_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
          # yamllint disable-line rule:line-length
          artifact-name: grype-scan-results-${{ needs.docker-metadata.outputs.build_id }}
          cache-db: ${{ inputs.grype_cache_db }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: 'Tests'
    runs-on: ubuntu-latest
    # Deferred until the audit operations (hadolint and Grype) pass,
    # so the expensive test hook is skipped when either audit fails
    # (gating inversion: audits gate tests on releases).
    #
    # A skipped result is accepted ONLY when a toggle explains it. A
    # bare 'skipped' is ambiguous: grype also skips when the sbom job
    # FAILS, and treating that as acceptable would let a release run
    # with no scan performed at all.
    #
    # sbom is a direct dependency for the same reason. With
    # grype_enabled false, a genuine SBOM failure would otherwise be
    # invisible here: grype skips either way, and the grype clause
    # would accept that skip on the toggle alone.
    needs:
      - 'build'
      - 'docker-metadata'
      - 'tag-validate'
      - 'dockerfile-lint'
      - 'sbom'
      - 'grype'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.dockerfile-lint.result == 'success' || (needs.dockerfile-lint.result == 'skipped' && !inputs.lint_enabled)) && (needs.sbom.result == 'success' || (needs.sbom.result == 'skipped' && !inputs.sbom_enabled)) && (needs.grype.result == 'success' || (needs.grype.result == 'skipped' && (!inputs.grype_enabled || !inputs.sbom_enabled))) }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          # Pin to the validated tag: the published/audited content
          # must match the release tag, not a caller-chosen ref
          ref: ${{ needs.tag-validate.outputs.tag }}
          persist-credentials: false

      # Foreign-architecture images (platform sets excluding the
      # runner-native linux/amd64) need binfmt emulation to run
      - name: 'Set up QEMU'
        # yamllint disable-line rule:line-length
        if: inputs.test_command != '' && inputs.platforms != 'linux/amd64'
        # yamllint disable-line rule:line-length
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: 'Download image archives'
        if: inputs.test_command != ''
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: docker-archives-${{ needs.docker-metadata.outputs.build_id }}
          path: /tmp/docker-archives

      - name: 'Run tests'
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
          TEST_COMMAND: ${{ inputs.test_command }}
          IMAGES: ${{ needs.build.outputs.images }}
          # The NO_BLOCK/soft-fail pattern: the test_permit_fail input
          # (or, when unset, the NO_BLOCK_AUDIT_FAIL repository
          # variable) disables failure propagation.
          # yamllint disable-line rule:line-length
          NO_BLOCK: ${{ inputs.test_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
        run: |
          # Load the built images and run the caller's test hook; the
          # IMAGES environment variable carries the built tag list.
          if [ -z "${TEST_COMMAND}" ]; then
            echo "::notice::No test_command provided; nothing to run"
            exit 0
          fi
          # nullglob: a missing/empty artifact must fail with a clear
          # message, not a literal-glob docker load error.
          shopt -s nullglob
          archives=(/tmp/docker-archives/*.tar)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::No image archives found to load"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            docker load -i "${archive}"
          done
          cd "${PATH_PREFIX}"
          status=0
          bash -e -c "${TEST_COMMAND}" || status=$?
          if [ "${status}" != "0" ]; then
            if [ "${NO_BLOCK}" = "true" ]; then
              echo "::warning::Tests failed, but failures are" \
                "permitted so the job will not fail."
              exit 0
            fi
            exit "${status}"
          fi

  attach-artefacts:
    name: 'Attach Artefacts to Release'
    runs-on: 'ubuntu-latest'
    needs:
      - 'tag-validate'
      - 'docker-metadata'
      - 'build'
      - 'tests'
    # A skipped job taints everything downstream of it, however far
    # away, and an intermediate job that rescues itself does not
    # clear the taint for its own dependents. So when lint_enabled,
    # sbom_enabled or grype_enabled is false, this job is skipped
    # even though all four jobs it needs have succeeded: tests
    # survives the skip with !cancelled() and passes, and this job
    # is skipped anyway.
    #
    # Without this guard a release with any audit disabled published
    # its images and then stopped: no artefacts attached, and
    # promote-release skipped in turn on its attach-artefacts
    # result, leaving the release a draft with every job green.
    #
    # Checking build and tests explicitly keeps the gating intact.
    # tests is skipped rather than failed when an audit it requires
    # fails, so requiring success here still blocks a release whose
    # audits did not pass, while allowing one whose audits were
    # never asked for. tag-validate and docker-metadata need no
    # check of their own: build cannot succeed unless both did.
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.tests.result == 'success' }}
    permissions:
      contents: write  # IMPORTANT: needed to edit release, attach artefacts
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Skipped along with the SBOM job when sbom_enabled is false;
      # there is no artefact to fetch and the release carries only the
      # digest manifest.
      - name: '⬇ Download SBOM artefacts'
        if: ${{ inputs.sbom_enabled }}
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom-files-${{ needs.docker-metadata.outputs.build_id }}

      # The digest manifest records exactly what pushed where, giving
      # consumers the immutable references to verify signatures and
      # provenance against.
      - name: 'Write image digest manifest'
        shell: bash
        env:
          PUSHED: ${{ needs.build.outputs.pushed }}
        run: |
          # Pretty-print the pushed-image manifest for the release
          jq '.' <<< "${PUSHED:-[]}" > docker-digests.json
          cat docker-digests.json

      - name: 'Attach artefacts to release'
        if: ${{ !inputs.dry_run }}
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/release-assets-action@51e2955cf9aeab3731efd7cc4605aa2847e7d8e2  # v0.1.3
        with:
          # Drop the SBOM glob when generation is disabled: the
          # action fails on a pattern that matches no file.
          # yamllint disable-line rule:line-length
          asset_paths: ${{ inputs.sbom_enabled && '["sbom-cyclonedx-*.json", "docker-digests.json"]' || '["docker-digests.json"]' }}
          release_tag: ${{ needs.tag-validate.outputs.tag }}
          # The assets are deterministic per tag, so replacing them
          # keeps this step rerunnable when a later job (signing,
          # promotion) fails and the workflow re-runs
          deny_overwrite: 'false'

      # The dry run stops short of uploading, so it reports the
      # assets instead. Listing the files that exist on disk (rather
      # than echoing the globs) proves the SBOM artefacts downloaded
      # and the manifest wrote, which is the part worth checking.
      # Every configured pattern must match at least one file:
      # docker-digests.json is written immediately above and so
      # always exists, and a single running total would let it mask
      # an SBOM glob that resolved to nothing.
      - name: 'Report release assets (dry run)'
        if: ${{ inputs.dry_run }}
        shell: bash
        env:
          TAG: ${{ needs.tag-validate.outputs.tag }}
          SBOM_ENABLED: ${{ inputs.sbom_enabled }}
        run: |
          # Report the assets a real release would attach
          declare -a patterns=('docker-digests.json')
          if [ "${SBOM_ENABLED}" = 'true' ]; then
            patterns+=('sbom-cyclonedx-*.json')
          fi
          {
            echo "## Release assets (dry run)"
            echo ""
            echo "Would attach to release \`${TAG}\`:"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          total=0
          unmatched=0
          for pattern in "${patterns[@]}"; do
            matched=0
            for file in ${pattern}; do
              if [ -f "${file}" ]; then
                size=$(wc -c < "${file}" | tr -d ' ')
                echo "${file} (${size} bytes)"
                echo "- \`${file}\` (${size} bytes)" \
                  >> "$GITHUB_STEP_SUMMARY"
                matched=$((matched + 1))
              fi
            done
            if [ "${matched}" -eq 0 ]; then
              echo "::error::No file matches the release asset" \
                "pattern '${pattern}'; a real release would attach" \
                "nothing for it"
              unmatched=$((unmatched + 1))
            fi
            total=$((total + matched))
          done
          if [ "${unmatched}" -gt 0 ]; then
            exit 1
          fi
          echo "Resolved ${total} release asset(s)"

  promote-release:
    name: 'Promote Draft Release'
    needs:
      - 'tag-validate'
      - 'build'
      - 'attach-artefacts'
      - 'sign'
    runs-on: 'ubuntu-latest'
    # The sign job legitimately skips (nothing pushed, or both signing
    # toggles off); only a failed/cancelled sign blocks promotion.
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.attach-artefacts.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    permissions:
      contents: write  # IMPORTANT: needed for draft release promotion
      packages: write  # Apply the latest tag to GHCR images
    timeout-minutes: 5
    outputs:
      # yamllint disable-line rule:line-length
      release_url: ${{ steps.promote-release.outputs.release_url || steps.set-promoted-url.outputs.release_url }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: 'Check if release is already promoted'
        id: 'check-promoted'
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag-validate.outputs.tag }}
        run: |
          # Check if release is already promoted
          if gh release view "$TAG" --json isDraft --jq '.isDraft' \
              2>/dev/null | grep -q "false"; then
            echo "Release $TAG is already promoted, skipping promotion"
            echo "already_promoted=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG is draft or doesn't exist, " \
                 "proceeding with promotion"
            echo "already_promoted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Promote draft release'
        id: 'promote-release'
        # yamllint disable-line rule:line-length
        if: ${{ !inputs.dry_run && steps.check-promoted.outputs.already_promoted == 'false' }}
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/draft-release-promote-action@e420b392557c9b1eea642f0d54dec4ff39086d5f  # v0.1.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.tag-validate.outputs.tag }}
          latest: true

      - name: 'Set release URL for already promoted release'
        id: 'set-promoted-url'
        if: steps.check-promoted.outputs.already_promoted == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag-validate.outputs.tag }}
        run: |
          # Set release URL for already promoted release
          RELEASE_URL=$(gh release view "$TAG" --json url --jq '.url')
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

      # A dry run reaches here having built, scanned and tested the
      # images without publishing, so there is nothing to promote and
      # no digest to retag. Reporting the plan keeps the lane's final
      # decisions observable: which tag would publish, and whether
      # 'latest' would move.
      - name: 'Report promotion plan (dry run)'
        if: ${{ inputs.dry_run }}
        shell: bash
        env:
          TAG: ${{ needs.tag-validate.outputs.tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          # Report what a real release would promote
          {
            echo "## Promotion plan (dry run)"
            echo ""
            echo "- Would promote draft release \`${TAG}\` and mark" \
              "it latest"
            if [ "${PUSH_LATEST}" = 'true' ]; then
              echo "- Would retag each published image as" \
                "\`latest\` by digest"
            else
              echo "- Would not move the \`latest\` image tag" \
                "(push_latest is false)"
            fi
            echo ""
            echo "Nothing published, so no image digest exists to" \
              "sign, attest or retag."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Dry run complete: release ${TAG} was not promoted"

      # The GitHub release is now promoted (or already was), so the
      # mutable consumer-facing 'latest' tag can move as the final
      # act: crane retags the already-pushed version tag
      # registry-side, preserving manifest lists. A failed promotion
      # above therefore never moves 'latest'.
      - name: 'Login to GHCR'
        if: ${{ inputs.push_latest && needs.build.outputs.ghcr == 'true' }}
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Login to Docker Hub'
        if: ${{ inputs.push_latest && needs.build.outputs.dockerhub == 'true' }}
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # The 'latest' retag on the registry input needs its login: the
      # build job resolved it, and the credential loads again here,
      # as job outputs must never carry a secret
      - name: 'Load registry credential'
        id: load-credential
        # yamllint disable-line rule:line-length
        if: ${{ inputs.push_latest && needs.build.outputs.registry_login != '' }}
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/credential-load-action@025002b47f4302fb7252175c470da69435060176  # v2.0.4
        with:
          # yamllint disable-line rule:line-length
          op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          vault_mapping_json: ${{ secrets.VAULT_MAPPING_JSON }}
          credential_name: ${{ needs.build.outputs.credential_name }}
          credential_grants_json: ${{ vars.CREDENTIAL_LOAD_GRANTS }}
          export_env: 'false'
      - name: 'Login to release registry'
        # yamllint disable-line rule:line-length
        if: ${{ inputs.push_latest && needs.build.outputs.registry_login != '' }}
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ needs.build.outputs.registry_login }}
          username: ${{ needs.build.outputs.registry_user }}
          password: ${{ steps.load-credential.outputs.credential }}

      - name: 'Set up crane'
        # yamllint disable-line rule:line-length
        if: ${{ inputs.push_latest && needs.build.outputs.pushed_count != '0' }}
        # yamllint disable-line rule:line-length
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b  # v0.7

      - name: 'Apply latest tags'
        # yamllint disable-line rule:line-length
        if: ${{ inputs.push_latest && needs.build.outputs.pushed_count != '0' }}
        shell: bash
        env:
          PUSHED: ${{ needs.build.outputs.pushed }}
        run: |
          # Retag every pushed image as latest by the immutable
          # digest this run scanned, signed and attested — never by
          # the mutable version tag, which another writer could move
          while IFS=$'\t' read -r image digest; do
            echo "Tagging ${image}@${digest} as latest"
            crane tag "${image}@${digest}" latest
          done < <(jq -r '.[] | [.image, .digest] | @tsv' \
            <<< "${PUSHED}")
