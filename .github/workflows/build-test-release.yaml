---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Reusable Docker build/test/release pipeline (Model A: tag-driven).
#
# Reproduces the canonical Linux Foundation release pipeline shape for
# container images: a validated, signed semver tag drives the version,
# the images build (multi-platform capable) and push to GHCR and/or
# Docker Hub, each pushed image signs with Sigstore cosign (keyless)
# and gains SLSA build provenance, and the audits gate the release:
#   tag-validate -> build -> sign
#   docker-metadata -> { audit | build }
#   build -> { sbom -> grype } -> tests
#     -> attach-artefacts -> promote-release
#
# Registries:
#   * GHCR: ghcr.io/<owner>/<name>, authenticated with GITHUB_TOKEN
#     (callers grant packages: write)
#   * Docker Hub: docker.io/<image_namespace>/<name>, authenticated
#     with the optional DOCKERHUB_USERNAME/DOCKERHUB_PASSWORD secrets;
#     skips with a warning when unset
#
# Platform strategy: the default single-platform build uses the
# buildx docker driver, so images build in array order against the
# daemon and same-repository FROM chains resolve exactly as in the
# verify lane. Passing more than one platform switches to the
# docker-container driver with QEMU emulation and pushes manifest
# lists directly; same-repository chains must then reference
# registry-resolvable images (or use build_args).
#
# The build_command escape hatch is deliberately absent from this
# lane: project-tooling builds cannot produce multi-platform
# manifests or per-registry digests reliably. Repositories needing it
# release through merge.yaml (Model B).
#
# Call this from a thin caller workflow on a tag push; see
# examples/build-test-release/ for both a plain GitHub-native caller
# and a Gerrit-sourced caller.
name: '[R] Docker Build/Test/Release'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      # --- Checkout target (defaults to the calling repository) ---
      repository:
        description: 'Repository to check out (owner/name)'
        required: false
        type: string
        default: ''
      ref:
        description: >-
          Branch/tag/SHA to check out for the metadata/housekeeping
          jobs (empty = default branch). The jobs that discover,
          build, lint and test content always check out the validated
          release tag, so published images match the tag regardless
          of this input.
        required: false
        type: string
        default: ''

      # --- Project layout ---
      path_prefix:
        description: 'Path to the project root directory'
        required: false
        type: string
        default: '.'

      # --- Image selection/build ---
      images:
        description: >-
          JSON array describing the images to build; an empty string
          (the default) auto-discovers Dockerfiles under path_prefix.
          When provided, the array must be non-empty; each entry takes
          name and context (required), dockerfile (default
          context/Dockerfile), target and build_args (optional list of
          KEY=VALUE strings). Array order is the build order.
        required: false
        type: string
        default: ''
      image_namespace:
        description: >-
          Docker Hub namespace (organisation/user) images publish
          under; required when dockerhub_publish is true. GHCR images
          always publish under the calling repository owner.
        required: false
        type: string
        default: ''
      platforms:
        description: >-
          Comma-separated target platforms (e.g.
          'linux/amd64,linux/arm64'). More than one platform engages
          QEMU emulation and pushes a manifest list per image.
        required: false
        type: string
        default: 'linux/amd64'
      build_timeout_minutes:
        description: 'Timeout for the build job in whole minutes'
        required: false
        type: number
        default: 30

      # --- Registry publishing ---
      ghcr_publish:
        description: 'Publish images to GHCR (ghcr.io/<owner>/<name>)'
        required: false
        type: boolean
        default: true
      dockerhub_publish:
        description: >-
          Publish images to Docker Hub
          (docker.io/<image_namespace>/<name>). Requires the
          DOCKERHUB_USERNAME/DOCKERHUB_PASSWORD secrets; skips with a
          warning when they are unavailable.
        required: false
        type: boolean
        default: false
      push_latest:
        description: >-
          Additionally publish the 'latest' tag per image. The tag
          applies registry-side during release promotion, after every
          gate (lint, scan, tests, signing) has passed, so a failed
          release never moves 'latest'.
        required: false
        type: boolean
        default: false

      # --- Tests ---
      test_command:
        description: >-
          Shell command run from path_prefix after the built images
          load into the Docker daemon (a smoke/integration hook, e.g.
          'make test'). The IMAGES environment variable carries a JSON
          array of the built image tags. Empty skips the test step
          with a notice.
        required: false
        type: string
        default: ''
      test_permit_fail:
        description: 'Permit test failures without failing the workflow'
        required: false
        type: boolean
        default: false

      # --- Audit (Dockerfile lint) ---
      audit_permit_fail:
        description: 'Permit hadolint findings (the NO_BLOCK pattern)'
        required: false
        type: boolean
        default: false

      # --- Grype scan ---
      grype_fail_on:
        description: 'Minimum severity that fails the Grype scan'
        required: false
        type: string
        default: 'medium'
      grype_permit_fail:
        description: >-
          Permit Grype findings without failing the job. When false, falls
          back to the NO_BLOCK_AUDIT_FAIL repository variable at runtime.
        required: false
        type: boolean
        default: false

      # --- Runner hardening ---
      harden_runner_egress:
        description: "Harden-runner egress policy: 'block' or 'audit'"
        required: false
        type: string
        default: 'block'
      harden_runner_allowlist:
        description: 'Out-of-band harden-runner allow-list configuration'
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@f0f76ac22f342c9a788ebcabe584e68a79cc2e83'  # v0.16.0
      build_permit_egress_traffic:
        description: >-
          Run harden-runner in audit mode for the build job only,
          permitting unrestricted egress. Use when base images or
          build-time dependencies come from registries/CDNs that are
          impractical to enumerate in the allow-list. Other jobs stay
          governed by harden_runner_egress; left unset, the build job
          follows it too.
        required: false
        type: boolean
        default: false

      # --- Gerrit-aware checkout (empty unless dispatched via Gerrit) ---
      gerrit_refspec:
        description: 'Gerrit refspec of the change under test'
        required: false
        type: string
        default: ''
      gerrit_project:
        description: 'Gerrit project name'
        required: false
        type: string
        default: ''
      gerrit_branch:
        description: 'Gerrit target branch'
        required: false
        type: string
        default: ''
      gerrit_url:
        description: >-
          Gerrit server URL. Empty falls back to the GERRIT_URL repository
          variable at runtime.
        required: false
        type: string
        default: ''

      # --- Release-only inputs ---
      attestations:
        description: >-
          Generate SLSA build provenance attestations for every pushed
          image (by digest; pushed to the registry for GHCR images).
          Keep it toggleable for air-gapped or Gerrit-mirrored
          consumers that cannot reach Sigstore.
        required: false
        type: boolean
        default: true
      sigstore_sign:
        description: >-
          Sign every pushed image with Sigstore cosign (keyless/OIDC,
          by digest). Keep it toggleable for air-gapped or
          Gerrit-mirrored consumers that cannot reach Sigstore.
        required: false
        type: boolean
        default: true
      sigstore_sign_required_registries:
        description: >-
          Space or comma separated registry hostnames whose cosign
          signing failures must fail the release. Signing runs against
          every pushed image regardless; this states which registries
          are known to store cosign signature artefacts, because
          support varies and cannot always be inferred from the
          hostname (see the registry capability matrix in README.md).
          A failure against a registry outside this list degrades to a
          warning, so an unproven registry cannot take a release down.
          Use '*' to require every registry, or '' to make signing
          best-effort everywhere.
        required: false
        type: string
        default: 'ghcr.io docker.io'

    secrets:
      DOCKERHUB_USERNAME:
        description: >-
          Docker Hub username used when dockerhub_publish is true. The
          build job skips Docker Hub publishing with a warning when
          unset, so PR/self-test contexts still work.
        required: false
      DOCKERHUB_PASSWORD:
        description: >-
          Docker Hub password or access token used when
          dockerhub_publish is true. The build job skips Docker Hub
          publishing with a warning when unset, so PR/self-test
          contexts still work.
        required: false

    outputs:
      tag:
        description: 'Validated release tag/version string'
        value: ${{ jobs.tag-validate.outputs.tag }}
      pushed:
        description: >-
          JSON array of pushed images as {name, image, digest}
          objects, one entry per image per registry
        value: ${{ jobs.build.outputs.pushed }}

permissions: {}

jobs:
  gerrit-validate:
    name: 'Validate Gerrit Inputs'
    # Fails fast with a clear message when gerrit_refspec is set without
    # the project/branch the Gerrit checkout path also requires. The
    # build-chain root job depends on this, so invalid Gerrit inputs stop
    # the pipeline early and cleanly. This job always runs (only the
    # Gerrit validation step is conditional), so gating dependents on it
    # does not trip GitHub's "skipped need skips dependents" behaviour.
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: 'Validate platforms input'
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          # Require a comma-separated list of os/arch[/variant]
          # platform specifiers; the value reaches docker buildx
          # --platform and must not carry hostile content
          pattern='^[a-z0-9]+(/[a-z0-9]+){1,2}'
          pattern+='(,[a-z0-9]+(/[a-z0-9]+){1,2})*$'
          if [[ ! "${PLATFORMS}" =~ ${pattern} ]]; then
            echo "::error::Invalid platforms input: ${PLATFORMS}" \
              "(expected csv of os/arch[/variant] specifiers)"
            exit 1
          fi
          echo "Platforms input validated ✅"

      - name: 'Require Gerrit project, branch and URL'
        if: inputs.gerrit_refspec != ''
        shell: bash
        env:
          GERRIT_PROJECT: ${{ inputs.gerrit_project }}
          GERRIT_BRANCH: ${{ inputs.gerrit_branch }}
          # yamllint disable-line rule:line-length
          GERRIT_URL: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
        run: |
          # gerrit_refspec is set, so the Gerrit checkout path runs and
          # also requires gerrit_project, gerrit_branch and a resolvable
          # Gerrit URL (the gerrit_url input or the GERRIT_URL variable).
          missing=''
          if [ -z "${GERRIT_PROJECT}" ]; then
            missing="${missing} gerrit_project"
          fi
          if [ -z "${GERRIT_BRANCH}" ]; then
            missing="${missing} gerrit_branch"
          fi
          if [ -z "${GERRIT_URL}" ]; then
            missing="${missing} gerrit_url/GERRIT_URL"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::gerrit_refspec is set but missing:${missing}"
            exit 1
          fi
          echo "Gerrit inputs validated ✅"

  repository-metadata:
    name: 'Repository Metadata'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d  # v0.2.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 'Gather repository metadata'
        id: repo-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/repository-metadata-action@8d17362fe9a656744433f3dec7fc60f14b23f858  # v0.2.6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: 'true'
          gerrit_summary: ${{ inputs.gerrit_refspec != '' }}
          artifact_upload: 'true'
          artifact_formats: 'json'

  tag-validate:
    name: 'Validate Tag Push'
    needs: gerrit-validate
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write  # Needed to draft a release
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag-validate.outputs.tag_name }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d  # v0.2.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 'Verify pushed tag'
        id: 'tag-validate'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/tag-validate-action@b2865c287f732486e12dfdfb75aef0692b024608  # v1.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          require_type: 'semver'
          reject_development: 'true'
          require_github: 'true'
          # yamllint disable-line rule:line-length
          require_signed: 'ssh,gpg-unverifiable'  # Cannot verify GPG without key

      - name: 'Ensure draft release exists'
        id: 'ensure-release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag-validate.outputs.tag_name }}
        run: |
          # Ensure draft release exists
          # Check if release exists and get its draft status
          if RELEASE_INFO=$(gh release view "$TAG" \
            --json isDraft 2>/dev/null); then
            IS_DRAFT=$(echo "$RELEASE_INFO" | jq -r '.isDraft')
            if [ "$IS_DRAFT" = "true" ]; then
              echo "Draft release for tag $TAG already exists"
            else
              echo "::error::A published release already exists for $TAG;" \
                "delete or recreate it as a draft, then re-run."
              exit 1
            fi
          else
            echo "Creating draft release for tag $TAG"
            gh release create "$TAG" \
              --draft \
              --title "Release $TAG" \
              --notes "Automated release for $TAG"
          fi

  docker-metadata:
    name: 'Docker Metadata'
    needs:
      - 'gerrit-validate'
      - 'tag-validate'
    runs-on: ubuntu-latest
    outputs:
      images_json: ${{ steps.discover.outputs.images_json }}
      image_count: ${{ steps.discover.outputs.image_count }}
      build_id: ${{ steps.discover.outputs.build_id }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d  # v0.2.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          # Pin to the validated tag: the published/audited content
          # must match the release tag, not a caller-chosen ref
          ref: ${{ needs.tag-validate.outputs.tag }}
          persist-credentials: false

      - name: 'Discover images'
        id: discover
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
          IMAGES_INPUT: ${{ inputs.images }}
          TARGET_REPOSITORY: ${{ inputs.repository || github.repository }}
          IMAGE_NAMESPACE: ${{ inputs.image_namespace }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          # Resolve the image list: an explicit 'images' input wins;
          # otherwise walk the estate-observed Dockerfile locations.
          cd "${PATH_PREFIX}"
          if [ -n "${IMAGES_INPUT}" ]; then
            if ! jq -e 'type == "array" and length > 0 and
                all(.[]; (.name | type == "string") and
                         (.context | type == "string") and
                         ((.dockerfile // "") | type == "string") and
                         ((.target // "") | type == "string") and
                         ((.build_args // []) | type == "array" and
                           all(.[]; type == "string")))' \
                >/dev/null 2>&1 <<< "${IMAGES_INPUT}"; then
              echo "::error::images input must be a non-empty JSON" \
                "array of objects with string 'name' and 'context'" \
                "keys; optional 'dockerfile'/'target' take strings" \
                "and 'build_args' a list of KEY=VALUE strings. Pass" \
                "an empty string (not []) for auto-discovery"
              exit 1
            fi
            images=$(jq -c . <<< "${IMAGES_INPUT}")
          else
            repo_name="${TARGET_REPOSITORY##*/}"
            if [ "${PATH_PREFIX}" != "." ]; then
              repo_name=$(basename "${PATH_PREFIX}")
            fi
            images='[]'
            add_image() {
              images=$(jq -c \
                --arg n "$1" --arg d "$2" --arg c "$3" \
                '. + [{name: $n, dockerfile: $d, context: $c}]' \
                <<< "${images}")
            }
            if [ -f Dockerfile ]; then
              add_image "${repo_name}" "Dockerfile" "."
            fi
            if [ -f docker/Dockerfile ]; then
              add_image "${repo_name}" "docker/Dockerfile" "docker"
            fi
            if [ -f src/main/docker/Dockerfile ]; then
              add_image "${repo_name}" \
                "src/main/docker/Dockerfile" "src/main/docker"
            fi
            for df in */Dockerfile; do
              [ -f "${df}" ] || continue
              dir="${df%/Dockerfile}"
              case "${dir}" in
                docker|src) continue ;;
              esac
              add_image "${dir}" "${df}" "${dir}"
            done
          fi
          # Sanitise names to the docker repository character set
          images=$(jq -c \
            '[.[] | .name |= (ascii_downcase |
              gsub("[^a-z0-9._-]"; "-"))]' \
            <<< "${images}")
          if [ -n "${IMAGES_INPUT}" ]; then
            # Explicit entries whose names collide after
            # normalisation (e.g. API and api) must reject: silently
            # dropping one would publish only part of the caller's
            # requested image set
            dupes=$(jq -r '[.[].name] | group_by(.) |
              map(select(length > 1) | .[0]) | .[]' \
              <<< "${images}")
            if [ -n "${dupes}" ]; then
              echo "::error::Duplicate image name(s) after" \
                "normalisation in the images input: ${dupes}"
              exit 1
            fi
          else
            # Auto-discovery drops duplicates (e.g. a root Dockerfile
            # plus docker/ both mapping to the repository name). The
            # de-duplication preserves array order — order is the
            # build order, which same-repository FROM chains rely on
            # — keeping the first occurrence of each name.
            images=$(jq -c \
              'reduce .[] as $img ([];
                if any(.[]; .name == $img.name) then .
                else . + [$img] end)' \
              <<< "${images}")
          fi
          count=$(jq 'length' <<< "${images}")
          if [ "${count}" -eq 0 ]; then
            echo "::error::No Dockerfiles found under" \
              "'${PATH_PREFIX}' and no images input provided"
            exit 1
          fi
          # Post-sanitisation validation: every name must be a valid
          # Docker repository component (start and end alphanumeric),
          # so reference construction fails here with a clear message
          # rather than at build/push time.
          bad=$(jq -r '.[] | .name |
            select(test("^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$") | not)' \
            <<< "${images}")
          if [ -n "${bad}" ]; then
            echo "::error::Invalid image name(s) after sanitisation:" \
              "${bad} (names must start/end with a-z or 0-9)"
            exit 1
          fi
          echo "Discovered ${count} image(s):"
          jq -r '.[] | "  \(.name)  (\(.dockerfile //
            (.context + "/Dockerfile")))"' <<< "${images}"
          echo "images_json=${images}" >> "$GITHUB_OUTPUT"
          echo "image_count=${count}" >> "$GITHUB_OUTPUT"
          # Artifact names must be unique per workflow-call invocation:
          # matrix legs calling this workflow in parallel would
          # otherwise overwrite each other's docker-archives/sbom-files
          # artifacts (upload-artifact overwrites duplicate names) and
          # downstream jobs would consume another leg's images. Hash
          # the distinguishing inputs into a stable per-leg id.
          build_id=$(printf '%s|%s|%s|%s|%s' \
            "${TARGET_REPOSITORY}" "${PATH_PREFIX}" "${IMAGES_INPUT}" \
            "${IMAGE_NAMESPACE}" "${PLATFORMS}" \
            | sha256sum | cut -c1-12)
          echo "build_id=${build_id}" >> "$GITHUB_OUTPUT"
          {
            echo "## Docker Images"
            echo ""
            echo "| Image | Dockerfile | Context |"
            echo "| ----- | ---------- | ------- |"
            jq -r '.[] | "| \(.name) | \(.dockerfile //
              (.context + "/Dockerfile")) | \(.context) |"' \
              <<< "${images}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: 'Docker Build/Push'
    needs:
      - 'tag-validate'
      - 'docker-metadata'
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.build.outputs.images }}
      image_count: ${{ steps.build.outputs.image_count }}
      pushed: ${{ steps.build.outputs.pushed }}
      pushed_count: ${{ steps.build.outputs.pushed_count }}
    permissions:
      contents: read
      packages: write  # Push images to GHCR
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    steps:
      # The build job can opt into audit egress independently of the
      # other jobs via build_permit_egress_traffic, for base images and
      # build-time dependencies from registries/CDNs impractical to
      # enumerate in the allow-list. Left unset it follows
      # harden_runner_egress like every other job.
      #
      # One harden-runner step with the policy computed, rather than
      # two selected by condition: harden-runner declares a 'pre'
      # entry point and no 'pre-if', so its pre-phase runs whatever a
      # step-level 'if:' says. Both would engage the agent, the first
      # would win, and audit mode would be unreachable.
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d  # v0.2.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ (inputs.build_permit_egress_traffic || inputs.harden_runner_egress == 'audit') && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          # Pin to the validated tag: the published/audited content
          # must match the release tag, not a caller-chosen ref
          ref: ${{ needs.tag-validate.outputs.tag }}
          persist-credentials: false

      # The Docker Hub secrets stay optional so PR/self-test contexts
      # can exercise the pipeline; when absent the Docker Hub leg
      # skips with a warning rather than failing. GHCR authenticates
      # with GITHUB_TOKEN, which always exists.
      - name: 'Resolve target registries'
        id: registries
        shell: bash
        env:
          GHCR_PUBLISH: ${{ inputs.ghcr_publish }}
          DOCKERHUB_PUBLISH: ${{ inputs.dockerhub_publish }}
          # yamllint disable-line rule:line-length
          HAS_DOCKERHUB_CREDS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_PASSWORD != '' }}
          IMAGE_NAMESPACE: ${{ inputs.image_namespace }}
        run: |
          # Gate each registry on its configuration/credentials
          dockerhub='false'
          if [ "${DOCKERHUB_PUBLISH}" = 'true' ]; then
            if [ "${HAS_DOCKERHUB_CREDS}" != 'true' ]; then
              echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_PASSWORD" \
                "unavailable; skipping Docker Hub publish"
            elif [ -z "${IMAGE_NAMESPACE}" ]; then
              echo "::error::dockerhub_publish requires the" \
                "image_namespace input (the Docker Hub organisation" \
                "or user the images publish under)"
              exit 1
            elif [[ ! "${IMAGE_NAMESPACE}" =~ ^[a-z0-9._-]+$ ]]; then
              echo "::error::Invalid image_namespace" \
                "'${IMAGE_NAMESPACE}' (lowercase alphanumerics," \
                "dots, dashes and underscores)"
              exit 1
            else
              dockerhub='true'
            fi
          fi
          if [ "${GHCR_PUBLISH}" != 'true' ] &&
            [ "${dockerhub}" != 'true' ]; then
            echo "::warning::No target registries resolved; images" \
              "will build and archive but nothing will publish"
          fi
          echo "dockerhub=${dockerhub}" >> "$GITHUB_OUTPUT"

      - name: 'Login to GHCR'
        if: inputs.ghcr_publish
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Login to Docker Hub'
        if: steps.registries.outputs.dockerhub == 'true'
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: 'Set up QEMU'
        if: inputs.platforms != 'linux/amd64'
        # yamllint disable-line rule:line-length
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: 'Set up Docker buildx'
        # yamllint disable-line rule:line-length
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
        with:
          # Single-platform (the default) builds with the docker
          # driver against the daemon's image store, so images build
          # in array order and same-repository FROM chains resolve as
          # in the verify lane. Multi-platform requires the
          # docker-container driver (the docker driver cannot build
          # manifest lists); chains must then reference
          # registry-resolvable images.
          # yamllint disable-line rule:line-length
          driver: ${{ inputs.platforms == 'linux/amd64' && 'docker' || 'docker-container' }}

      - name: 'Build and push images'
        id: build
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
          IMAGES_JSON: ${{ needs.docker-metadata.outputs.images_json }}
          IMAGE_NAMESPACE: ${{ inputs.image_namespace }}
          PLATFORMS: ${{ inputs.platforms }}
          TAG: ${{ needs.tag-validate.outputs.tag }}
          GHCR_PUBLISH: ${{ inputs.ghcr_publish }}
          DOCKERHUB: ${{ steps.registries.outputs.dockerhub }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Build every image, push it to the resolved registries and
          # capture the per-registry manifest digest (the subject the
          # sign job signs/attests). Each image also exports as a
          # docker archive so the test, SBOM and scan jobs consume
          # the published bits. The local working tag is the
          # lane-neutral <name>:verify alias, so same-repository FROM
          # chains resolve exactly as in the verify lane (local tags
          # never publish). Any failure fails the job: a release must
          # never publish a partial image set.
          cd "${PATH_PREFIX}"
          # Require the v prefix (the LF release convention): the
          # semver gate accepts both v1.2.3 and 1.2.3, and stripping
          # an optional v would let two distinct git tags publish the
          # same supposedly immutable registry tag
          if [[ ! "${TAG}" =~ ^v ]]; then
            echo "::error::Release tags must carry the 'v' prefix" \
              "(got '${TAG}'); accepting both v1.2.3 and 1.2.3" \
              "would alias the same registry tag"
            exit 1
          fi
          version="${TAG#v}"
          # Docker tags cannot carry SemVer build metadata ('+');
          # normalise it to '_' — collision-safe because SemVer
          # forbids '_' — so a valid signed tag such as
          # v1.2.3+build.5 still releases
          version="${version//+/_}"
          if [[ ! "${version}" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Invalid release version: ${version}"
            exit 1
          fi
          owner=$(tr '[:upper:]' '[:lower:]' <<< "${OWNER}")
          multi='false'
          if [ "${PLATFORMS}" != 'linux/amd64' ]; then
            multi='true'
          fi
          # The platform whose image feeds the test/SBOM/scan jobs:
          # the runner's native platform when the build targets it,
          # otherwise the first requested platform (Syft and Grype
          # analyse archives statically, so a foreign-architecture
          # archive still scans)
          scan_platform='linux/amd64'
          case ",${PLATFORMS}," in
            *,linux/amd64,*) ;;
            *) scan_platform="${PLATFORMS%%,*}" ;;
          esac
          # The verify and merge lanes prefix local tags with
          # image_namespace, so a caller whose chain references
          # <namespace>/<base>:verify through build_args builds there
          # and would fail here. Aliasing each image under the
          # namespace as well lets one images input travel between
          # the lanes unchanged.
          #
          # Whether to alias is decided once, here, against Docker's
          # reference grammar: runs of lowercase alphanumerics joined
          # by a single '.' or '_', exactly '__', or one or more '-',
          # in slash-separated components. Multi-component namespaces
          # such as team/project qualify, because this is a local
          # reference rather than a Docker Hub organisation, and that
          # gate enforces its own narrower shape separately. Anything
          # docker tag would reject, such as '-team' or 'team.',
          # yields no alias rather than failing a release that
          # publishes nowhere near Docker Hub.
          namespace_component='[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*'
          alias_namespace='false'
          if [ -n "${IMAGE_NAMESPACE}" ] &&
            [[ "${IMAGE_NAMESPACE}" =~ \
              ^${namespace_component}(/${namespace_component})*$ ]]
          then
            alias_namespace='true'
          elif [ -n "${IMAGE_NAMESPACE}" ]; then
            echo "::notice::image_namespace '${IMAGE_NAMESPACE}'" \
              "is not a usable local reference prefix; skipping the" \
              "namespaced :verify aliases"
          fi
          mkdir -p /tmp/docker-archives
          declare -a local_tags=()
          pushed='[]'
          while IFS= read -r spec; do
            name=$(jq -r '.name' <<< "${spec}")
            ctx=$(jq -r '.context' <<< "${spec}")
            df=$(jq -r '.dockerfile //
              (.context + "/Dockerfile")' <<< "${spec}")
            target=$(jq -r '.target // empty' <<< "${spec}")
            declare -a common=(-f "${df}")
            if [ -n "${target}" ]; then
              common+=(--target "${target}")
            fi
            while IFS= read -r build_arg; do
              [ -n "${build_arg}" ] &&
                common+=(--build-arg "${build_arg}")
            done < <(jq -r '.build_args[]? // empty' <<< "${spec}")
            declare -a repos=()
            if [ "${GHCR_PUBLISH}" = 'true' ]; then
              repos+=("ghcr.io/${owner}/${name}")
            fi
            if [ "${DOCKERHUB}" = 'true' ]; then
              repos+=("docker.io/${IMAGE_NAMESPACE}/${name}")
            fi
            declare -a refs=()
            for repo in "${repos[@]}"; do
              refs+=("${repo}:${version}")
            done
            declare -a tag_args=()
            for ref in "${refs[@]}"; do
              tag_args+=(-t "${ref}")
            done
            local_tag="${name}:verify"
            # The pushed digest captures from the push operation
            # itself (buildx metadata / the local daemon's post-push
            # record), never re-read through the mutable version tag:
            # a concurrent writer moving the tag cannot desynchronise
            # what the sign job signs from what this run pushed
            image_digest=''
            if [ "${multi}" = 'true' ]; then
              if [ "${#repos[@]}" -gt 0 ]; then
                # Manifest-list build pushed straight to the
                # registries; buildx SBOM/provenance stay off — the
                # sign job attests provenance by digest instead
                echo "::group::Build/push ${name} (${PLATFORMS})"
                docker buildx build --platform "${PLATFORMS}" \
                  --push --provenance=false --sbom=false \
                  --metadata-file /tmp/build-meta.json \
                  "${tag_args[@]}" "${common[@]}" "${ctx}"
                echo "::endgroup::"
                # One build pushes the same manifest list to every
                # repo, so the emitted digest covers them all
                image_digest=$(jq -r \
                  '."containerimage.digest" // empty' \
                  /tmp/build-meta.json)
                # The archive the test/SBOM/scan jobs consume pulls
                # back from the pushed manifest by its immutable
                # digest, so downstream jobs audit the published bits
                echo "::group::Pull ${name} (${scan_platform})"
                docker pull --platform "${scan_platform}" \
                  "${repos[0]}@${image_digest}"
                docker tag "${repos[0]}@${image_digest}" \
                  "${local_tag}"
                echo "::endgroup::"
              else
                # Nothing publishes: build a native-platform image
                # locally so the downstream jobs still have bits to
                # audit
                echo "::group::Build ${local_tag} (native)"
                docker buildx build --load -t "${local_tag}" \
                  "${common[@]}" "${ctx}"
                echo "::endgroup::"
              fi
            else
              echo "::group::Build ${local_tag}"
              docker buildx build --load -t "${local_tag}" \
                "${tag_args[@]}" "${common[@]}" "${ctx}"
              echo "::endgroup::"
              for ref in "${refs[@]}"; do
                echo "::group::Push ${ref}"
                docker push "${ref}"
                echo "::endgroup::"
              done
            fi
            for repo in "${repos[@]}"; do
              digest="${image_digest}"
              if [ -z "${digest}" ]; then
                # Single-platform path: the daemon records
                # repo@digest locally when it pushes, so this reads
                # the digest of our own push, not the registry's
                # current tag state
                digest=$(docker image inspect \
                  --format \
                  '{{range .RepoDigests}}{{println .}}{{end}}' \
                  "${local_tag}" \
                  | awk -F'@' -v repo="${repo}" \
                    '$1 == repo {print $2; exit}')
              fi
              if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "::error::Failed to resolve digest for" \
                  "${repo}:${version} (got: ${digest})"
                exit 1
              fi
              echo "${repo}@${digest}"
              pushed=$(jq -c \
                --arg n "${name}" --arg i "${repo}" \
                --arg d "${digest}" \
                '. + [{name: $n, image: $i, digest: $d}]' \
                <<< "${pushed}")
            done
            local_tags+=("${local_tag}")
            if [ "${alias_namespace}" = 'true' ]; then
              alias_repo="${IMAGE_NAMESPACE}/${name}"
              # Docker caps a repository name at 255 characters, so
              # a long namespace can carry a grammatical alias past
              # the limit even though every component is well
              # formed. Checking the assembled name keeps the
              # promise above: an alias this daemon would refuse is
              # skipped, never a reason for a release to fail.
              if [ "${#alias_repo}" -le 255 ]; then
                docker tag "${local_tag}" "${alias_repo}:verify"
              else
                echo "::notice::Skipping the namespaced alias for" \
                  "${name}: the assembled repository name is" \
                  "${#alias_repo} characters, over Docker's limit" \
                  "of 255"
              fi
            fi
            safe=$(tr '/:' '__' <<< "${local_tag}")
            docker save "${local_tag}" \
              -o "/tmp/docker-archives/${safe}.tar"
          done < <(jq -c '.[]' <<< "${IMAGES_JSON}")
          built=$(printf '%s\n' "${local_tags[@]}" | jq -cnR '[inputs]')
          pushed_count=$(jq 'length' <<< "${pushed}")
          echo "Built ${#local_tags[@]} image(s): ${built}"
          echo "Pushed ${pushed_count} image reference(s)"
          {
            echo "images=${built}"
            echo "image_count=${#local_tags[@]}"
            echo "pushed=${pushed}"
            echo "pushed_count=${pushed_count}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Docker Build/Push"
            echo ""
            echo "Built **${#local_tags[@]}** image(s);" \
              "pushed **${pushed_count}** reference(s):"
            echo ""
            if [ "${pushed_count}" -gt 0 ]; then
              jq -r '.[] | "- `\(.image)@\(.digest)`"' \
                <<< "${pushed}"
            else
              echo "- (nothing pushed)"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 'Upload image archives'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: docker-archives-${{ needs.docker-metadata.outputs.build_id }}
          path: /tmp/docker-archives/
          retention-days: 1
          if-no-files-found: error

  # Signs and attests every pushed image by digest: cosign keyless
  # (Sigstore) plus SLSA build provenance via GitHub attestations,
  # matching the verification story of the other workflow families.
  # Provenance pushes to the registry for GHCR images; Docker Hub
  # lacks dependable OCI referrers support, so its attestations live
  # in the GitHub attestation store (gh attestation verify).
  # Signing follows the same registry-aware principle from the other
  # end: it runs everywhere, but only failures against the registries
  # named in sigstore_sign_required_registries fail the release.
  sign:
    name: 'Sign & Attest'
    runs-on: ubuntu-latest
    needs: 'build'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.pushed_count != '0' && (inputs.sigstore_sign || inputs.attestations) }}
    permissions:
      contents: read
      id-token: write       # Sigstore OIDC + provenance signing
      attestations: write   # GitHub attestation store
      packages: write       # Push signatures/attestations to GHCR
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.pushed) }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d  # v0.2.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Login to GHCR'
        if: startsWith(matrix.image, 'ghcr.io/')
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Login to Docker Hub'
        if: startsWith(matrix.image, 'docker.io/')
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: 'Install cosign'
        if: inputs.sigstore_sign
        # yamllint disable-line rule:line-length
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: 'Sign image with cosign (keyless)'
        if: inputs.sigstore_sign
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ matrix.digest }}
          # yamllint disable-line rule:line-length
          REQUIRED_REGISTRIES: ${{ inputs.sigstore_sign_required_registries }}
        run: |
          # Keyless signature over the immutable digest; verification:
          #   cosign verify <image>@<digest> \
          #     --certificate-identity-regexp <workflow ref> \
          #     --certificate-oidc-issuer \
          #       https://token.actions.githubusercontent.com
          #
          # cosign-installer v4.1.2 brings cosign v3.0.6, which
          # stores the signature under the legacy tag scheme, as
          # sha256-<hex>.sig beside the image. OCI 1.1 referrer
          # storage needs --registry-referrers-mode oci-1-1, which
          # this step deliberately does not pass.
          #
          # Registries differ in what they accept, so a signature
          # is only load-bearing where the caller says it is:
          # anywhere else a failure warns and the release carries on
          # unsigned for that image rather than failing outright.
          # A non-zero exit does not name a culprit — the registry,
          # Sigstore OIDC, Fulcio and Rekor can each fail this step —
          # so the messages below point at the log rather than guess.
          registry="${IMAGE%%/*}"
          read -ra required_registries <<< "${REQUIRED_REGISTRIES//,/ }"
          required='false'
          for entry in "${required_registries[@]}"; do
            if [ "${entry}" = '*' ] || [ "${entry}" = "${registry}" ]; then
              required='true'
              break
            fi
          done

          if cosign sign --yes "${IMAGE}@${DIGEST}"; then
            echo "Signed ${IMAGE}@${DIGEST}"
            exit 0
          fi

          if [ "${required}" = 'true' ]; then
            echo "::error::cosign sign failed for" \
              "${IMAGE}@${DIGEST};" \
              "sigstore_sign_required_registries lists ${registry}," \
              "so this failure fails the release"
            exit 1
          fi

          echo "::warning::cosign sign failed for" \
            "${IMAGE}@${DIGEST}; ${registry} is absent from" \
            "sigstore_sign_required_registries, so the release" \
            "continues with this image unsigned. See the step log" \
            "above for the cause"
          {
            echo "## Docker Signing"
            echo ""
            echo "⚠️ \`${IMAGE}@${DIGEST}\` published **unsigned**:" \
              "\`cosign sign\` failed and \`${registry}\` is not a" \
              "required registry. The step log names the cause," \
              "which may be the registry, Sigstore OIDC, Fulcio or" \
              "Rekor."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 'Attest build provenance'
        if: inputs.attestations
        env:
          # Carried over from actions/attest-build-provenance, which
          # set this on its way through to actions/attest: node's
          # default 16KB response header limit overflows against some
          # OCI registries on the push-to-registry path. Removing it
          # reintroduces actions/attest-build-provenance#687.
          NODE_OPTIONS: '--max-http-header-size=32768'
        # yamllint disable-line rule:line-length
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ matrix.digest }}
          push-to-registry: ${{ startsWith(matrix.image, 'ghcr.io/') }}

  audit:
    name: 'Dockerfile Lint'
    runs-on: ubuntu-latest
    needs:
      - 'docker-metadata'
      - 'tag-validate'
    if: ${{ !cancelled() && needs.docker-metadata.result == 'success' }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d  # v0.2.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          # Pin to the validated tag: the published/audited content
          # must match the release tag, not a caller-chosen ref
          ref: ${{ needs.tag-validate.outputs.tag }}
          persist-credentials: false

      - name: 'Lint Dockerfiles (hadolint)'
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
          IMAGES_JSON: ${{ needs.docker-metadata.outputs.images_json }}
          # Digest-pinned hadolint container; docker.io serves it and
          # sits in the egress allow-list.
          # yamllint disable-line rule:line-length
          HADOLINT_IMAGE: 'hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d'
          # The NO_BLOCK/soft-fail pattern: the audit_permit_fail input
          # (or, when unset, the NO_BLOCK_AUDIT_FAIL repository
          # variable) disables failure propagation.
          # yamllint disable-line rule:line-length
          NO_BLOCK: ${{ inputs.audit_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
        run: |
          # Lint exactly the Dockerfiles the build consumes (from the
          # resolved image list), so per-image dockerfile overrides
          # and non-standard filenames stay covered. The resolved
          # paths are relative to path_prefix (discovery runs there).
          cd "${PATH_PREFIX}"
          status=0
          while IFS= read -r dockerfile; do
            echo "::group::hadolint ${dockerfile}"
            docker run --rm \
              -v "${PWD}:/mnt:ro" -w /mnt \
              "${HADOLINT_IMAGE}" \
              hadolint "${dockerfile}" || status=1
            echo "::endgroup::"
          done < <(jq -r '.[] | .dockerfile //
            (.context + "/Dockerfile")' <<< "${IMAGES_JSON}")
          if [ "${status}" = "0" ]; then
            echo "Dockerfile lint passed ✅"
            exit 0
          fi
          if [ "${NO_BLOCK}" = "true" ]; then
            echo "::warning::hadolint reported findings, but failures" \
              "are permitted so the job will not fail."
            exit 0
          fi
          echo "::error::hadolint reported findings"
          exit 1

  sbom:
    name: 'Image SBOM'
    runs-on: ubuntu-latest
    needs: ['build', 'docker-metadata']
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d  # v0.2.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download image archives'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: docker-archives-${{ needs.docker-metadata.outputs.build_id }}
          path: /tmp/docker-archives

      - name: 'Install Syft'
        id: syft
        # yamllint disable-line rule:line-length
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0

      - name: 'Generate image SBOMs'
        shell: bash
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: |
          # One CycloneDX SBOM per image archive; the Grype job scans
          # every sbom-cyclonedx-*.json this step produces. nullglob:
          # a missing/empty artifact must fail with a clear message,
          # not a literal-glob Syft error.
          shopt -s nullglob
          archives=(/tmp/docker-archives/*.tar)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::No image archives found to scan"
            exit 1
          fi
          total=0
          for archive in "${archives[@]}"; do
            base=$(basename "${archive}" .tar)
            out="sbom-cyclonedx-${base}.json"
            echo "::group::SBOM ${base}"
            "${SYFT_CMD}" scan "docker-archive:${archive}" \
              -o "cyclonedx-json=${out}"
            echo "::endgroup::"
            count=$(jq '.components | length' "${out}")
            echo "${base}: ${count} components"
            total=$((total + count))
          done
          {
            echo "## SBOM Summary"
            echo ""
            echo "CycloneDX SBOM per image;" \
              "**${total}** components in total"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 'Upload SBOM artifacts'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-files-${{ needs.docker-metadata.outputs.build_id }}
          path: sbom-cyclonedx-*.json
          retention-days: 45
          # Fail fast: the downstream Grype job requires this artifact,
          # so a missing/misnamed SBOM must surface here, not later
          if-no-files-found: error

  grype:
    name: 'Grype Audit SBOM'
    runs-on: ubuntu-latest
    needs: ['sbom', 'docker-metadata']
    if: ${{ !cancelled() && needs.sbom.result == 'success' }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read  # Read maintainer-approved CVE bypass issues
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d  # v0.2.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Download SBOM artefact'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom-files-${{ needs.docker-metadata.outputs.build_id }}

      # The grype_permit_fail input (or, when unset, the NO_BLOCK_AUDIT_FAIL
      # repository variable) disables failure propagation so releases
      # can proceed when blocked by newly discovered CVEs in base images
      # or transitive dependencies.
      - name: 'Grype audit SBOMs'
        id: grype-audit
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@87fd7bdad7f0809af58108e65f60debc244df348  # v0.0.2
        with:
          sbom: 'sbom-cyclonedx-*.json'
          fail-on: ${{ inputs.grype_fail_on }}
          # yamllint disable-line rule:line-length
          permit-fail: ${{ inputs.grype_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
          # yamllint disable-line rule:line-length
          artifact-name: grype-scan-results-${{ needs.docker-metadata.outputs.build_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: 'Tests'
    runs-on: ubuntu-latest
    # Deferred until the audit operations (hadolint and Grype) pass,
    # so the expensive test hook is skipped when either audit fails
    # (gating inversion: audits gate tests on releases).
    needs:
      - 'build'
      - 'docker-metadata'
      - 'tag-validate'
      - 'audit'
      - 'grype'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.audit.result == 'success' && needs.grype.result == 'success' }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d  # v0.2.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          # Pin to the validated tag: the published/audited content
          # must match the release tag, not a caller-chosen ref
          ref: ${{ needs.tag-validate.outputs.tag }}
          persist-credentials: false

      # Foreign-architecture images (platform sets excluding the
      # runner-native linux/amd64) need binfmt emulation to run
      - name: 'Set up QEMU'
        # yamllint disable-line rule:line-length
        if: inputs.test_command != '' && inputs.platforms != 'linux/amd64'
        # yamllint disable-line rule:line-length
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: 'Download image archives'
        if: inputs.test_command != ''
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: docker-archives-${{ needs.docker-metadata.outputs.build_id }}
          path: /tmp/docker-archives

      - name: 'Run tests'
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
          TEST_COMMAND: ${{ inputs.test_command }}
          IMAGES: ${{ needs.build.outputs.images }}
          # The NO_BLOCK/soft-fail pattern: the test_permit_fail input
          # (or, when unset, the NO_BLOCK_AUDIT_FAIL repository
          # variable) disables failure propagation.
          # yamllint disable-line rule:line-length
          NO_BLOCK: ${{ inputs.test_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
        run: |
          # Load the built images and run the caller's test hook; the
          # IMAGES environment variable carries the built tag list.
          if [ -z "${TEST_COMMAND}" ]; then
            echo "::notice::No test_command provided; nothing to run"
            exit 0
          fi
          # nullglob: a missing/empty artifact must fail with a clear
          # message, not a literal-glob docker load error.
          shopt -s nullglob
          archives=(/tmp/docker-archives/*.tar)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::No image archives found to load"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            docker load -i "${archive}"
          done
          cd "${PATH_PREFIX}"
          status=0
          bash -e -c "${TEST_COMMAND}" || status=$?
          if [ "${status}" != "0" ]; then
            if [ "${NO_BLOCK}" = "true" ]; then
              echo "::warning::Tests failed, but failures are" \
                "permitted so the job will not fail."
              exit 0
            fi
            exit "${status}"
          fi

  attach-artefacts:
    name: 'Attach Artefacts to Release'
    runs-on: 'ubuntu-latest'
    needs:
      - 'tag-validate'
      - 'docker-metadata'
      - 'build'
      - 'tests'
    permissions:
      contents: write  # IMPORTANT: needed to edit release, attach artefacts
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d  # v0.2.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: '⬇ Download SBOM artefacts'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom-files-${{ needs.docker-metadata.outputs.build_id }}

      # The digest manifest records exactly what pushed where, giving
      # consumers the immutable references to verify signatures and
      # provenance against.
      - name: 'Write image digest manifest'
        shell: bash
        env:
          PUSHED: ${{ needs.build.outputs.pushed }}
        run: |
          # Pretty-print the pushed-image manifest for the release
          jq '.' <<< "${PUSHED:-[]}" > docker-digests.json
          cat docker-digests.json

      - name: 'Attach artefacts to release'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/release-assets-action@22a6302f3d1775e4a192c45235cc7833a2781b12  # v0.1.1
        with:
          # yamllint disable-line rule:line-length
          asset_paths: '["sbom-cyclonedx-*.json", "docker-digests.json"]'
          release_tag: ${{ needs.tag-validate.outputs.tag }}
          # The assets are deterministic per tag, so replacing them
          # keeps this step rerunnable when a later job (signing,
          # promotion) fails and the workflow re-runs
          deny_overwrite: 'false'

  promote-release:
    name: 'Promote Draft Release'
    needs:
      - 'tag-validate'
      - 'build'
      - 'attach-artefacts'
      - 'sign'
    runs-on: 'ubuntu-latest'
    # The sign job legitimately skips (nothing pushed, or both signing
    # toggles off); only a failed/cancelled sign blocks promotion.
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.attach-artefacts.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    permissions:
      contents: write  # IMPORTANT: needed for draft release promotion
      packages: write  # Apply the latest tag to GHCR images
    timeout-minutes: 5
    outputs:
      # yamllint disable-line rule:line-length
      release_url: ${{ steps.promote-release.outputs.release_url || steps.set-promoted-url.outputs.release_url }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d  # v0.2.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: 'Check if release is already promoted'
        id: 'check-promoted'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag-validate.outputs.tag }}
        run: |
          # Check if release is already promoted
          if gh release view "$TAG" --json isDraft --jq '.isDraft' \
              2>/dev/null | grep -q "false"; then
            echo "Release $TAG is already promoted, skipping promotion"
            echo "already_promoted=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG is draft or doesn't exist, " \
                 "proceeding with promotion"
            echo "already_promoted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Promote draft release'
        id: 'promote-release'
        if: steps.check-promoted.outputs.already_promoted == 'false'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/draft-release-promote-action@072990900b99030363d81d4131c2bf2855f07df0  # v0.1.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.tag-validate.outputs.tag }}
          latest: true

      - name: 'Set release URL for already promoted release'
        id: 'set-promoted-url'
        if: steps.check-promoted.outputs.already_promoted == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag-validate.outputs.tag }}
        run: |
          # Set release URL for already promoted release
          RELEASE_URL=$(gh release view "$TAG" --json url --jq '.url')
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

      # The GitHub release is now promoted (or already was), so the
      # mutable consumer-facing 'latest' tag can move as the final
      # act: crane retags the already-pushed version tag
      # registry-side, preserving manifest lists. A failed promotion
      # above therefore never moves 'latest'.
      - name: 'Login to GHCR'
        # yamllint disable-line rule:line-length
        if: ${{ inputs.push_latest && contains(needs.build.outputs.pushed, 'ghcr.io/') }}
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Login to Docker Hub'
        # yamllint disable-line rule:line-length
        if: ${{ inputs.push_latest && contains(needs.build.outputs.pushed, 'docker.io/') }}
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: 'Set up crane'
        # yamllint disable-line rule:line-length
        if: ${{ inputs.push_latest && needs.build.outputs.pushed_count != '0' }}
        # yamllint disable-line rule:line-length
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b  # v0.7

      - name: 'Apply latest tags'
        # yamllint disable-line rule:line-length
        if: ${{ inputs.push_latest && needs.build.outputs.pushed_count != '0' }}
        shell: bash
        env:
          PUSHED: ${{ needs.build.outputs.pushed }}
        run: |
          # Retag every pushed image as latest by the immutable
          # digest this run scanned, signed and attested — never by
          # the mutable version tag, which another writer could move
          while IFS=$'\t' read -r image digest; do
            echo "Tagging ${image}@${digest} as latest"
            crane tag "${image}@${digest}" latest
          done < <(jq -r '.[] | [.image, .digest] | @tsv' \
            <<< "${PUSHED}")
